<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏝️ Aqua Island 〜無人島アクアリウム〜</title>
<style>
:root{--bg:#062a3e;--panel:#0b3a52;--card:#11506e;--acc:#4fd1c5;--gold:#ffd166;--txt:#e8f7ff;--sub:#9cc7da}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:linear-gradient(#04202f,#073246) fixed;color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
#top{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px 4px;position:sticky;top:0;background:rgba(4,32,47,.96);z-index:5}
.stat{background:var(--panel);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;line-height:1.3;color:var(--sub)}
.stat b{display:block;font-size:14px;color:var(--gold);white-space:nowrap}
#dayBar{grid-column:1/-1;height:4px;background:#0b3a52;border-radius:2px;overflow:hidden}
#dayFill{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff8fab,#7b6cff)}
#tabs{display:flex;gap:4px;padding:4px 8px 0}
.tab{flex:1;padding:9px 2px;border:none;border-radius:10px 10px 0 0;background:var(--panel);color:var(--sub);font-size:12.5px;font-weight:bold;font-family:inherit}
.tab.on{background:var(--card);color:#fff}
#stage{position:relative;margin:0 8px;border-top:3px solid var(--card)}
canvas#cv{display:block;width:100%;height:min(50vh,420px);border-radius:0 0 12px 12px;background:#000;touch-action:manipulation}
#log{position:absolute;left:6px;top:6px;right:6px;pointer-events:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.msg{background:rgba(0,18,30,.72);padding:3px 9px;border-radius:8px;font-size:12px;transition:opacity .8s;max-width:92%;border-left:3px solid var(--acc)}
#panel{padding:8px 8px 40px;flex:1}
.btn{border:none;border-radius:10px;padding:10px 12px;background:var(--acc);color:#04202f;font-weight:bold;font-size:14px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn:disabled{background:#2e5568;color:#7fa2b2}
.btn.sm{padding:6px 9px;font-size:12px}
.btn.gold{background:var(--gold)}
.btn.red{background:#ff7b8a}
.btn.ghost{background:var(--card);color:var(--txt)}
.btn.on{outline:2px solid #fff}
.btn.big{flex:1;padding:14px;font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.card{background:var(--panel);border-radius:12px;padding:10px;margin-bottom:8px}
h3{margin:2px 0 8px;font-size:14.5px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.item{background:var(--card);border-radius:10px;padding:6px;display:flex;gap:6px;align-items:center;font-size:12px}
.item .info{flex:1;min-width:0}
.item .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:48px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.th img{max-width:48px;max-height:30px}
.th .em{font-size:24px;line-height:1}
.unk{filter:brightness(0) opacity(.45)}
.up{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:6px}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .info{flex:1;font-size:12px}
.up .info b{font-size:13.5px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.dc{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;border:2px solid transparent}
.dc .th{margin:0 auto 3px;width:64px;height:40px}
.dc .th img{max-width:64px;max-height:40px}
.dc .th .em{font-size:30px}
.prog{height:8px;background:#062a3e;border-radius:4px;overflow:hidden;margin-top:4px}
.prog div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
.mbox{background:var(--panel);border-radius:16px;padding:16px;width:min(90vw,360px);text-align:center}
.mbox .th{width:150px;height:90px;margin:4px auto 8px}
.mbox .th img{max-width:150px;max-height:90px}
.mbox .th .em{font-size:64px}
.mbox table{width:100%;font-size:13px;margin:8px 0;text-align:left}
.mbox td:first-child{color:var(--sub);width:40%}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat">所持金<b id="sG">0G</b></div>
    <div class="stat">日付<b id="sD">Day 1</b></div>
    <div class="stat">観光客<b id="sV">0人</b></div>
    <div class="stat">島の評価<b id="sR">Lv1</b></div>
    <div id="dayBar"><div id="dayFill"></div></div>
  </div>
  <div id="tabs">
    <button class="tab on" data-tab="tank">🐠 水槽</button>
    <button class="tab" data-tab="fish">🎣 釣り場</button>
    <button class="tab" data-tab="island">🏝️ 島・設備</button>
    <button class="tab" data-tab="dex">📖 図鑑</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="log"></div></div>
  <div id="panel"></div>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
// ===================== データ =====================
const AREAS=[
 {id:'beach',n:'浅瀬',ic:'🏖️',cost:0,req:1,w:['#62d4e8','#0c6f93']},
 {id:'reef',n:'サンゴ礁',ic:'🐠',cost:600,req:2,w:['#48e0cf','#0b5f86']},
 {id:'open',n:'沖合',ic:'🌊',cost:2500,req:3,w:['#2d8fd0','#0a3768']},
 {id:'deep',n:'深海',ic:'🌑',cost:9000,req:5,w:['#1b4a7c','#01060f']},
];
const AREAM={};AREAS.forEach(a=>AREAM[a.id]=a);
const RAR=['','★','★★','★★★','★★★★','★★★★★'];
const RCOL=['','#cfd8dc','#7ee081','#5ab0ff','#c98bff','#ffcf40'];
const SPECIES=[
 // 浅瀬
 {id:'iwashi',n:'マイワシ',a:'beach',r:1,ap:3,mn:10,mx:22,c1:'#dfeaf2',c2:'#2f5f8f',h:.3,pat:'dots',d:'体の横に黒い点が並ぶ小魚。大きな群れをつくって外敵から身を守る。'},
 {id:'kisu',n:'シロギス',a:'beach',r:1,ap:5,mn:15,mx:30,c1:'#f4efe4',c2:'#c9b98f',h:.24,pat:'none',d:'砂地にすむ上品な白身魚。その美しさから「海の女王」とも呼ばれる。'},
 {id:'aji',n:'マアジ',a:'beach',r:1,ap:4,mn:15,mx:40,c1:'#e3ead2',c2:'#5f7f55',h:.33,pat:'line',d:'体の側面に「ぜいご」という硬いウロコの列をもつ。食卓でもおなじみ。'},
 {id:'kawahagi',n:'カワハギ',a:'beach',r:2,ap:9,mn:12,mx:30,c1:'#e0cfa2',c2:'#8b6a3a',h:.62,pat:'spots',d:'おちょぼ口でエサだけをかすめ取る、釣り人泣かせの「エサ取り名人」。'},
 {id:'harisen',n:'ハリセンボン',e:'🐡',a:'beach',r:2,ap:13,mn:15,mx:35,d:'驚くと水を吸って体をふくらませ、トゲを立てて身を守る。'},
 {id:'kani',n:'イソガニ',e:'🦀',a:'beach',r:1,ap:4,mn:3,mx:8,g:1,bottom:1,d:'磯の岩のすき間にすむ小さなカニ。横歩きでちょこちょこ動き回る。'},
 {id:'hitode',n:'イトマキヒトデ',e:'⭐',a:'beach',r:1,ap:3,mn:5,mx:15,g:1,bottom:1,d:'糸巻きのような形のヒトデ。腕が切れても再生する力をもつ。'},
 {id:'yado',n:'ヤドカリ',e:'🐚',a:'beach',r:2,ap:7,mn:2,mx:10,g:1,bottom:1,d:'貝殻をお家にして暮らす。成長すると大きな貝殻へお引っ越し。'},
 {id:'ebi',n:'イセエビ',e:'🦞',a:'beach',r:3,ap:22,mn:15,mx:35,g:1,bottom:1,d:'長いヒゲが立派な高級エビ。夜になると岩陰から出てくる。'},
 // サンゴ礁
 {id:'kumanomi',n:'カクレクマノミ',a:'reef',r:2,ap:15,mn:5,mx:11,c1:'#ff8a2b',c2:'#ffffff',h:.46,pat:'band',d:'イソギンチャクと共生するオレンジの人気者。水族館の大スター。'},
 {id:'chou',n:'チョウチョウウオ',a:'reef',r:2,ap:14,mn:10,mx:22,c1:'#ffe14d',c2:'#2b2b2b',h:.82,pat:'eyebar',d:'尾の近くの黒い点は「ニセの目」。敵に頭の位置をごまかす作戦。'},
 {id:'nanyo',n:'ナンヨウハギ',a:'reef',r:3,ap:24,mn:12,mx:30,c1:'#2457e6',c2:'#ffd23f',h:.55,pat:'tang',d:'鮮やかな青い体に黄色い尾びれ。尾の付け根には鋭いトゲがある。'},
 {id:'tako',n:'マダコ',e:'🐙',a:'reef',r:3,ap:28,mn:30,mx:80,bottom:1,d:'とても頭が良く、ビンのフタを開けることも。体の色を自在に変える。'},
 {id:'kame',n:'アオウミガメ',e:'🐢',a:'reef',r:4,ap:65,mn:60,mx:120,d:'海藻を食べるおだやかなウミガメ。何十年も生きる長寿の生き物。'},
 // 沖合
 {id:'katsuo',n:'カツオ',a:'open',r:2,ap:18,mn:40,mx:90,c1:'#cfd9e4',c2:'#1d3352',h:.32,pat:'stripes',d:'黒潮にのって旅をする回遊魚。お腹の縞模様は興奮すると浮き出る。'},
 {id:'kurage',n:'ミズクラゲ',shape:'jelly',a:'open',r:3,ap:35,mn:10,mx:30,c1:'rgba(225,238,255,0.5)',c2:'#ffb3d9',d:'ふわふわと漂う癒やし系。四つ葉のクローバーのような模様が目印。'},
 {id:'maguro',n:'クロマグロ',a:'open',r:4,ap:75,mn:100,mx:300,c1:'#c3cfdb',c2:'#13243c',h:.3,pat:'back',d:'時速80kmにもなる海の弾丸。止まると呼吸できず、一生泳ぎ続ける。'},
 {id:'manbou',n:'マンボウ',shape:'manbou',a:'open',r:4,ap:85,mn:100,mx:330,c1:'#a9b5c1',c2:'#5f6c7a',d:'一度に数億個の卵を産むといわれる。のんびり屋の人気者。'},
 {id:'jinbei',n:'ジンベエザメ',a:'open',r:5,ap:160,mn:400,mx:1200,c1:'#456a8c',c2:'#22384e',h:.3,pat:'ws',d:'世界最大の魚。大きな口でプランクトンを吸い込む、やさしい巨人。'},
 // 深海
 {id:'kinme',n:'キンメダイ',a:'deep',r:2,ap:20,mn:25,mx:50,c1:'#ff4d4d',c2:'#b3122b',h:.5,pat:'none',bigEye:1,d:'金色に光る大きな目は、暗い深海でわずかな光を集めるため。'},
 {id:'menda',n:'メンダコ',shape:'menda',a:'deep',r:3,ap:50,mn:10,mx:20,c1:'#ff8fa8',d:'耳のようなヒレをパタパタさせて泳ぐ、深海のアイドル。'},
 {id:'anko',n:'チョウチンアンコウ',shape:'angler',a:'deep',r:4,ap:95,mn:10,mx:60,c1:'#3b3140',c2:'#a8f0ff',d:'頭の「ちょうちん」を光らせ、寄ってきた獲物をパクリ。'},
 {id:'ika',n:'ダイオウイカ',e:'🦑',a:'deep',r:5,ap:210,mn:300,mx:1300,d:'全長10mを超えることもある幻の巨大イカ。目はバスケットボール大。'},
 {id:'ryugu',n:'リュウグウノツカイ',shape:'long',a:'deep',r:5,ap:260,mn:200,mx:800,c1:'#dfe8f0',c2:'#ff3b5c',d:'銀色の長い体に赤いヒレ。人魚伝説のモデルともいわれる幻の魚。'},
];
const SPM={};SPECIES.forEach((p,i)=>{p.i=i;SPM[p.id]=p;});

const ROD_COST=[0,0,150,500,1500,4000,10000];
const NEWTANK_COST=[0,800,3000,9000];
const CAFE=[{c:300,q:2},{c:1500,q:3},{c:5000,q:5}];
const COTT=[{c:600,q:2},{c:2500,q:4},{c:7000,q:6}];
const DAY_SEC=90;
const KEY='aquaIsland_v1';

// ===================== 状態 =====================
function newState(){return{v:1,gold:120,day:1,time:0.08,rating:1,xp:0,rod:1,tanks:[{cap:3,fish:[]}],cur:0,bucket:[],dex:{},
 b:{cafe:0,cottage:0,lighthouse:0,pier:0},areas:['beach'],area:'beach',visToday:0,incToday:0,totalVis:0,totalInc:0,uid:1,last:Date.now()};}
let s=load()||newState();
let tab='tank',T=0,APPEAL=0;
const anim={};let bubbles=[],ripples=[],present=[],sparks=[];
let pend={g:0,n:0,cafe:0,t:0},visAcc=0,saveT=0,topT=0,gatherCd=0,selFish=null;
const fs={st:'idle',t:0,wait:0,sp:null,size:0,bx:0,by:0,sx:0,sy:0,hits:0,need:1,z0:0,z1:0,mk:0,md:1,speed:1,win:1,nib:0,nibT:1,res:null,flash:null};

// ===================== ユーティリティ =====================
const $=q=>document.querySelector(q);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function lerpCol(a,b,f){const A=hex2rgb(a),B=hex2rgb(b);return rgb([A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f]);}
function shade(h,f){if(h[0]!=='#')return h;const c=hex2rgb(h);return rgb(c.map(v=>f<0?v*(1+f):v+(255-v)*f));}
function fmtSize(z){return z>=100?(z/100).toFixed(2)+'m':z.toFixed(1)+'cm';}
function fmtG(g){return Math.floor(g).toLocaleString()+'G';}
function hourNow(){return(6+s.time*24)%24;}
function night(h){if(h<5||h>=20.5)return 1;if(h<7)return(7-h)/2;if(h>18.5)return(h-18.5)/2;return 0;}
function timeMult(h){if(h>=9&&h<19)return 1;if(h>=6&&h<9)return .5;if(h>=19&&h<22)return .6;return .15;}
function xpNeed(lv){return Math.floor(20*Math.pow(lv,1.7));}
function pxOf(sp,z){let L=clamp(14+11*Math.log2(z/4),18,86);if(sp.shape==='long')L*=1.7;if(sp.shape==='jelly'||sp.shape==='menda')L*=.85;return L;}

// ===================== ログ =====================
function log(t,col){const el=document.createElement('div');el.className='msg';el.textContent=t;if(col)el.style.borderLeftColor=col;
 const lg=$('#log');lg.appendChild(el);while(lg.children.length>5)lg.removeChild(lg.firstChild);
 setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.remove(),900);},4500);}

// ===================== キャンバス =====================
const cv=$('#cv'),ctx=cv.getContext('2d');let W=300,H=300;
function resize(){const DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);

// ===================== 生き物の描画 =====================
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function drawCreature(c,sp,L,t,ph,dir){
 c.save();
 if(sp.e){c.scale(-dir,1);c.rotate(Math.sin(t*2+ph)*.07);c.font=`${L}px ${EMOJI_FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(sp.e,0,0);c.restore();return;}
 c.scale(dir,1);
 switch(sp.shape){
  case'jelly':drawJelly(c,sp,L,t,ph);break;
  case'manbou':drawManbou(c,sp,L,t,ph);break;
  case'menda':drawMenda(c,sp,L,t,ph);break;
  case'angler':drawAngler(c,sp,L,t,ph);break;
  case'long':drawLong(c,sp,L,t,ph);break;
  default:drawFishBody(c,sp,L,t,ph);
 }
 c.restore();
}
function drawEye(c,x,y,r){c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(x+r*.15,y,r*.6,0,7);c.fill();c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(x+r*.35,y-r*.3,r*.22,0,7);c.fill();}
function drawFishBody(c,sp,L,t,ph){
 const h=L*(sp.h||.4),w=Math.sin(t*7+ph)*.35;
 const finCol=sp.pat==='tang'?sp.c2:(sp.pat==='band'?sp.c1:shade(sp.c1,-.2));
 // 尾びれ
 c.save();c.translate(-L*.42,0);c.rotate(w);c.fillStyle=sp.pat==='tang'?sp.c2:shade(sp.c1,-.15);
 c.beginPath();c.moveTo(4,0);c.lineTo(-L*.28,-h*.62);c.quadraticCurveTo(-L*.17,0,-L*.28,h*.62);c.closePath();c.fill();
 if(sp.pat==='band'){c.strokeStyle='#111';c.lineWidth=1.2;c.stroke();}
 c.restore();
 // 背びれ・腹びれ
 c.fillStyle=finCol;c.beginPath();c.moveTo(-L*.25,-h*.3);c.quadraticCurveTo(-L*.02,-h*.95-Math.sin(t*3+ph)*2,L*.14,-h*.38);c.fill();
 c.beginPath();c.moveTo(-L*.12,h*.36);c.quadraticCurveTo(0,h*.78,L*.06,h*.4);c.fill();
 // 体
 c.beginPath();c.ellipse(0,0,L/2,h/2,0,0,Math.PI*2);
 const g=c.createLinearGradient(0,-h/2,0,h/2);
 if(sp.pat==='back'||sp.pat==='stripes'||sp.pat==='ws'){g.addColorStop(0,sp.c2);g.addColorStop(.5,sp.c1);g.addColorStop(1,shade(sp.c1,.4));}
 else{g.addColorStop(0,shade(sp.c1,-.25));g.addColorStop(.5,sp.c1);g.addColorStop(1,shade(sp.c1,.35));}
 c.fillStyle=g;c.fill();
 c.save();c.clip();
 switch(sp.pat){
  case'dots':c.fillStyle='rgba(20,35,55,.8)';for(let i=0;i<6;i++){c.beginPath();c.arc(-L*.28+i*L*.1,-h*.05,h*.07,0,7);c.fill();}break;
  case'line':c.strokeStyle=sp.c2;c.lineWidth=Math.max(1,h*.07);c.beginPath();c.moveTo(-L*.45,h*.02);for(let i=0;i<9;i++)c.lineTo(-L*.4+i*L*.08,(i%2?-1:1)*h*.04);c.stroke();break;
  case'spots':c.fillStyle='rgba(110,80,40,.55)';for(let i=0;i<9;i++){c.beginPath();c.arc(-L*.35+((i*37)%70)/100*L,-h*.35+((i*53)%70)/100*h,h*.07,0,7);c.fill();}break;
  case'band':for(const x of[L*.2,-L*.06,-L*.32]){c.fillStyle='#111';c.fillRect(x-L*.065,-h,L*.13,h*2);c.fillStyle='#fff';c.fillRect(x-L*.045,-h,L*.09,h*2);}break;
  case'eyebar':c.fillStyle='#222';c.fillRect(L*.24,-h,L*.07,h*2);c.fillStyle='#fff';c.beginPath();c.arc(-L*.25,-h*.12,h*.15,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(-L*.25,-h*.12,h*.11,0,7);c.fill();
   c.strokeStyle='rgba(180,130,0,.5)';c.lineWidth=1;for(let i=-3;i<4;i++){c.beginPath();c.moveTo(-L*.5,i*h*.15);c.lineTo(L*.5,i*h*.15+h*.3);c.stroke();}break;
  case'tang':c.strokeStyle='#0a0a2a';c.lineWidth=h*.13;c.lineCap='round';c.beginPath();c.moveTo(L*.28,-h*.18);c.quadraticCurveTo(0,h*.32,-L*.38,-h*.08);c.stroke();c.beginPath();c.moveTo(-L*.05,-h*.3);c.quadraticCurveTo(-L*.2,-h*.05,-L*.3,-h*.35);c.stroke();break;
  case'stripes':c.strokeStyle='rgba(25,45,75,.55)';c.lineWidth=Math.max(1,h*.06);for(const y of[.08,.19,.3]){c.beginPath();c.moveTo(-L*.4,h*y);c.lineTo(L*.25,h*y);c.stroke();}break;

  a.turn-=dt;if(a.turn<=0){a.turn=rand(4,10);if(!p.bottom)a.ty=rand(H*.14,H*.72);if(Math.random()<.25)a.vx*=-1;}

 }

function updateFishing(dt){
 fs.t+=dt;if(fs.flash)fs.flash.t-=dt;
 for(const rp of ripples)rp.t+=dt*.8;ripples=ripples.filter(r=>r.t<1);
 for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt*1.2;}sparks=sparks.filter(p=>p.l>0);
 if(fs.st==='cast'&&fs.t>=.6){fs.st='wait';fs.t=0;ripples.push({x:fs.bx,y:fs.by,t:0});splash(fs.bx,fs.by,6);}
 else if(fs.st==='wait'){
  fs.nibT-=dt;if(fs.nib>0)fs.nib-=dt;
  if(fs.nibT<=0){fs.nibT=rand(.8,2);if(fs.t<fs.wait-.5){fs.nib=.25;ripples.push({x:fs.bx,y:fs.by,t:.3});}}
  if(fs.t>=fs.wait){fs.st='bite';fs.t=0;fs.sp=pickSpecies(s.area);fs.size=rollSize(fs.sp);fs.win=clamp(.95+s.rod*.08-fs.sp.r*.07,.5,1.4);
   ripples.push({x:fs.bx,y:fs.by,t:0});splash(fs.bx,fs.by,10);if(navigator.vibrate)navigator.vibrate(60);}
 }
 else if(fs.st==='bite'&&fs.t>fs.win){fs.st='idle';flash('逃げられた…💦','#ffb3b3');log('🐟 魚に逃げられた… 浮きが沈んだらすぐタップ！');}
 else if(fs.st==='reel'){fs.mk+=fs.md*fs.speed*dt;if(fs.mk>1){fs.mk=1;fs.md=-1;}if(fs.mk<0){fs.mk=0;fs.md=1;}}
 else if(fs.st==='result'&&fs.t>4){fs.st='idle';}
}
function flash(txt,col){fs.flash={txt,col,t:1.4};}
function splash(x,y,n){for(let i=0;i<n;i++)sparks.push({x,y,vx:rand(-60,60),vy:rand(-160,-60),l:1});}
function pickSpecies(area){const rw=[0,50,28,13,5,1.6];const list=SPECIES.filter(p=>p.a===area&&!p.g);let tot=0;
 const ws=list.map(p=>{const w=rw[p.r]*(1+(s.rod-1)*.22*(p.r-1));tot+=w;return w;});let r=Math.random()*tot;
 for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i];}return list[0];}
function rollSize(p){const k=Math.pow(Math.random(),Math.max(.6,1.7-s.rod*.15));return Math.round((p.mn+(p.mx-p.mn)*k)*10)/10;}
function bucketCap(){return 8+(s.b.pier?6:0);}
function newZone(){const w=clamp(.3+s.rod*.035-fs.sp.r*.035,.1,.45);fs.z0=rand(.05,.95-w);fs.z1=fs.z0+w;}
function fishTap(){
 switch(fs.st){
  case'idle':
   if(s.bucket.length>=bucketCap()){flash('いけすが満杯！','#ffb3b3');log('🪣 いけすが満杯です。水槽タブで展示するか売りましょう');return;}
   fs.st='cast';fs.t=0;fs.bx=rand(W*.45,W*.8);fs.by=rand(H*.5,H*.66);fs.wait=rand(1.5,4.2)*(s.b.pier?.7:1);fs.nib=0;fs.nibT=rand(.5,1.2);break;
  case'cast':case'wait':fs.st='idle';flash('早すぎた！','#ffb3b3');break;
  case'bite':fs.st='reel';fs.t=0;fs.hits=0;fs.need=fs.sp.r>=5?3:fs.sp.r>=4?2:1;fs.mk=0;fs.md=1;fs.speed=.8+fs.sp.r*.22;newZone();break;
  case'reel':
   if(fs.mk>=fs.z0&&fs.mk<=fs.z1){fs.hits++;splash(fs.bx,fs.by,6);if(navigator.vibrate)navigator.vibrate(30);
    if(fs.hits>=fs.need)catchFish();else{newZone();fs.speed*=1.12;}}
   else{fs.st='idle';flash('糸が切れた…','#ffb3b3');log(`💥 大物（${RAR[fs.sp.r]}）に逃げられた…`);}
   break;

 }
}
function registerCatch(sp,size){

 return{isNew,record};
}

 ctx.globalAlpha=1;
 const c=got.length,tot=SPECIES.length;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(W/2-110,H/2-30,220,60);
 ctx.fillStyle='#ffd166';ctx.font='bold 24px sans-serif';ctx.fillText(`📖 ${c} / ${tot} 種`,W/2,H/2-6);ctx.fillStyle='#cfe';ctx.font='12px sans-serif';ctx.fillText(`コンプリート率 ${Math.floor(c/tot*100)}%`,W/2,H/2+18);
}

// ===================== 経営 =====================
function fishAppeal(f){const p=SPM[f.s],k=clamp((f.z-p.mn)/(p.mx-p.mn),0,1);return p.ap*(.8+.5*k);}
function recalc(){let a=0;const set=new Set();for(const t of s.tanks)for(const f of t.fish){a+=fishAppeal(f);set.add(f.s);}APPEAL=a*(1+set.size*.03);}
function ticket(){return Math.round(4+Math.sqrt(APPEAL)*1.2+s.rating*1.5);}
function visRate(){if(APPEAL<=0)return 0;return(.1+Math.sqrt(APPEAL)/40)*(1+.12*s.b.cottage)*(s.b.lighthouse?1.15:1);}
function addXp(x){s.xp+=x;let need;while(s.xp>=(need=xpNeed(s.rating))){s.xp-=need;s.rating++;log(`🎉 島の評価が Lv${s.rating} にアップ！新しい施設やエリアが解放されるかも`,'#ffd166');if(tab==='island')renderPanel();}}
function updateEconomy(dt){
 s.time+=dt/DAY_SEC;if(s.time>=1)endDay();
 const h=hourNow();
 visAcc+=visRate()*timeMult(h)*dt;
 while(visAcc>=1){visAcc--;const tk=ticket(),cafe=s.b.cafe*4;s.gold+=tk+cafe;pend.g+=tk;pend.cafe+=cafe;pend.n++;s.visToday++;s.totalVis++;s.incToday+=tk+cafe;s.totalInc+=tk+cafe;
  present.push({until:T+rand(18,30),ix:Math.floor(Math.random()*1000),kid:Math.random()<.3});addXp(s.b.lighthouse?1.5:1);}
 present=present.filter(v=>v.until>T);
 pend.t+=dt;if(pend.t>=7){if(pend.n>0)log(`🎫 入場料 +${pend.g}G（${pend.n}人）${pend.cafe?` ☕カフェ +${pend.cafe}G`:''}`,'#4fd1c5');pend={g:0,n:0,cafe:0,t:0};}
}
function endDay(){
 const bonus=s.b.cottage*30*s.rating;s.gold+=bonus;
 log(`🌙 Day ${s.day} 終了 — 来場 ${s.visToday}人 / 売上 ${fmtG(s.incToday+bonus)}${bonus?`（コテージ宿泊 +${bonus}G）`:''}`,'#c98bff');
 s.day++;s.time=0;s.visToday=0;s.incToday=0;save();
}

// ===================== UI =====================
function updateTop(){
 $('#sG').textContent=fmtG(s.gold);
 const h=hourNow(),hh=Math.floor(h),mm=Math.floor((h-hh)*6)*10;
 $('#sD').textContent=`Day ${s.day} ${hh}:${String(mm).padStart(2,'0')}`;
 $('#sV').textContent=`${present.length}人`;
 $('#sR').textContent=`Lv${s.rating} ${'⭐'.repeat(Math.min(3,Math.ceil(s.rating/3)))}`;
 $('#dayFill').style.width=(s.time*100)+'%';
 if(tab==='fish'){const gb=$('#gatherBtn');if(gb){gb.disabled=gatherCd>0;gb.textContent=gatherCd>0?`🏖️ 採取（${Math.ceil(gatherCd)}秒）`:'🏖️ 浜辺で採取';}}
 if(tab==='island'){document.querySelectorAll('[data-cost]').forEach(b=>{b.disabled=s.gold<+b.dataset.cost||b.dataset.lock==='1';});}
}
function fishItem(f,btns){const p=SPM[f.s];return`<div class="item">${thumb(p)}<div class="info"><div style="color:${RCOL[p.r]}">${p.n}</div><div class="sub">${fmtSize(f.z)} 魅力${Math.round(fishAppeal(f))}</div><div class="row" style="margin:3px 0 0">${btns}</div></div></div>`;}
function sellPrice(f){return Math.max(1,Math.round(fishAppeal(f)*2));}
function renderPanel(){
 const P=$('#panel');let h='';
 if(tab==='tank'){
  const tank=s.tanks[s.cur];
  h+=`<div class="row">${s.tanks.map((t,i)=>`<button class="btn sm ${i===s.cur?'':'ghost'}" data-act="seltank" data-i="${i}">水槽${i+1}（${t.fish.length}/${t.cap}）</button>`).join('')}</div>`;
  h+=`<div class="card"><h3>📊 経営状況</h3><div class="sub">総魅力度 <b style="color:var(--gold)">${Math.round(APPEAL)}</b>　入場料 <b style="color:var(--gold)">${ticket()}G</b>${s.b.cafe?`（+カフェ${s.b.cafe*4}G）`:''}<br>来場ペース 約${(visRate()*60).toFixed(1)}人/分（昼）　本日 ${s.visToday}人・${fmtG(s.incToday)}<br><span style="opacity:.8">※種類が多いほど魅力度ボーナス！大きい個体ほど魅力UP</span></div></div>`;
  h+=`<div class="card"><h3>🐠 水槽${s.cur+1}に展示中（${tank.fish.length}/${tank.cap}）</h3>`;
  h+=tank.fish.length?`<div class="list">${tank.fish.map(f=>fishItem(f,`<button class="btn sm ghost" data-act="back" data-u="${f.u}">いけすへ</button>`)).join('')}</div>`:`<div class="sub">まだ何もいません。下のいけすから展示しよう。</div>`;
  h+=`</div><div class="card"><h3>🪣 いけす（未展示） ${s.bucket.length}/${bucketCap()}</h3>`;
  if(s.bucket.length){h+=`<div class="row"><button class="btn sm gold" data-act="sellall">全部売る（+${fmtG(s.bucket.reduce((a,f)=>a+sellPrice(f),0))}）</button></div><div class="list">${s.bucket.map(f=>fishItem(f,`<button class="btn sm" data-act="put" data-u="${f.u}" ${tank.fish.length>=tank.cap?'disabled':''}>展示</button><button class="btn sm gold" data-act="sell" data-u="${f.u}">売る ${sellPrice(f)}G</button>`)).join('')}</div>`;}
  else h+=`<div class="sub">空っぽです。🎣釣り場で魚を集めよう！</div>`;
  h+='</div>';
 }
 else if(tab==='fish'){
  h+=`<div class="row"><button class="btn big" data-act="fishtap">🎣 キャスト / アクション</button></div>`;
  h+=`<div class="row"><button class="btn gold" id="gatherBtn" data-act="gather" style="flex:1">🏖️ 浜辺で採取</button><div class="sub" style="flex:1">いけす ${s.bucket.length}/${bucketCap()}<br>釣り竿 Lv${s.rod}</div></div>`;
  h+=`<div class="card"><h3>🗺️ 釣り場エリア</h3><div class="row">${AREAS.map(a=>{const ok=s.areas.includes(a.id);return`<button class="btn sm ${s.area===a.id?'':'ghost'}" data-act="area" data-id="${a.id}" ${ok?'':'disabled'}>${ok?a.ic:'🔒'} ${a.n}</button>`;}).join('')}</div>`;
  const list=SPECIES.filter(p=>p.a===s.area&&!p.g);
  h+=`<div class="sub">このエリアの魚：</div><div class="row">${list.map(p=>`<div title="${s.dex[p.id]?p.n:'？？？'}">${thumb(p,!s.dex[p.id])}</div>`).join('')}</div></div>`;
  h+=`<div class="card sub"><b>遊び方</b><br>① 画面（または上のボタン）をタップして仕掛けを投げる<br>② 浮きが沈んで「！」が出たらすぐタップ（早すぎると失敗）<br>③ 動くバーが<span style="color:#38d36b">緑ゾーン</span>に入った瞬間にタップ！レア魚は複数回必要<br>🏖️採取ではカニやエビなど浜辺の生き物が手に入ります</div>`;
 }
 else if(tab==='island'){
  const ups=[];const tank=s.tanks[s.cur];
  ups.push({ic:'🎣',n:'釣り竿の強化',lv:`Lv${s.rod}${s.rod>=6?'（MAX）':''}`,d:'判定ゾーンが広がり、レア魚・大物が出やすくなる',cost:s.rod<6?ROD_COST[s.rod+1]:null,req:1,act:'rod'});
  ups.push({ic:'💧',n:`水槽${s.cur+1}の拡張`,lv:`定員${tank.cap}匹${tank.cap>=10?'（MAX）':''}`,d:'展示できる数が+1（水槽タブで対象を切替）',cost:tank.cap<10?Math.round(80*Math.pow(1.55,tank.cap-3)):null,req:1,act:'tankup'});
  ups.push({ic:'🏗️',n:'新しい水槽',lv:`${s.tanks.length}/4基`,d:'別テーマの水槽を増設（サンゴ・外洋・深海）',cost:s.tanks.length<4?NEWTANK_COST[s.tanks.length]:null,req:s.tanks.length+1,act:'newtank'});
  const cf=CAFE[s.b.cafe];ups.push({ic:'☕',n:'カフェ',lv:s.b.cafe?`Lv${s.b.cafe}`:'未建設',d:'観光客1人ごとに+4G×Lvの売上',cost:cf?cf.c:null,req:cf?cf.q:0,act:'cafe'});
  const ct=COTT[s.b.cottage];ups.push({ic:'🛖',n:'コテージ',lv:s.b.cottage?`${s.b.cottage}棟`:'未建設',d:'来場ペース+12%/棟、1日の終わりに宿泊収入',cost:ct?ct.c:null,req:ct?ct.q:0,act:'cottage'});
  ups.push({ic:'💡',n:'灯台',lv:s.b.lighthouse?'建設済':'未建設',d:'来場ペース+15%、評価経験値×1.5。夜を照らす',cost:s.b.lighthouse?null:1500,req:3,act:'lighthouse'});
  ups.push({ic:'⚓',n:'桟橋',lv:s.b.pier?'建設済':'未建設',d:'魚がかかるまでの時間-30%、いけす+6',cost:s.b.pier?null:400,req:1,act:'pier'});
  const upHtml=u=>{const lock=s.rating<u.req;return`<div class="up"><div class="ic">${u.ic}</div><div class="info"><b>${u.n}</b> <span style="color:var(--gold)">${u.lv}</span><div class="sub">${u.d}${lock&&u.cost!=null?`<br>🔒 評価Lv${u.req}で解放`:''}</div></div>${u.cost!=null?`<button class="btn sm gold" data-act="buy" data-k="${u.act}" data-cost="${u.cost}" data-lock="${lock?1:0}" ${s.gold<u.cost||lock?'disabled':''}>${fmtG(u.cost)}</button>`:'<span class="sub">完了✓</span>'}</div>`;};
  h+=`<div class="card"><h3>⭐ 島の評価 Lv${s.rating}</h3><div class="sub">次のLvまで ${Math.floor(s.xp)}/${xpNeed(s.rating)}（観光客の来場・新種発見で上昇）</div><div class="prog"><div style="width:${s.xp/xpNeed(s.rating)*100}%"></div></div></div>`;
  h+=`<div class="card"><h3>🔧 設備・投資</h3>${ups.map(upHtml).join('')}</div>`;
  h+=`<div class="card"><h3>⛵ 新エリア解放</h3>${AREAS.slice(1).map(a=>{const ok=s.areas.includes(a.id),lock=s.rating<a.req;return`<div class="up"><div class="ic">${a.ic}</div><div class="info"><b>${a.n}</b><div class="sub">${ok?'解放済み — 釣り場で選択できます':`${lock?`🔒 評価Lv${a.req}で解放 / `:''}新しい魚が釣れるエリア`}</div></div>${ok?'<span class="sub">✓</span>':`<button class="btn sm gold" data-act="area_buy" data-id="${a.id}" data-cost="${a.cost}" data-lock="${lock?1:0}" ${s.gold<a.cost||lock?'disabled':''}>${fmtG(a.cost)}</button>`}</div>`;}).join('')}</div>`;
  h+=`<div class="card"><h3>💾 データ</h3><div class="sub">自動セーブされます（ブラウザを閉じてもOK）。累計来場 ${s.totalVis}人 / 累計売上 ${fmtG(s.totalInc)}</div><div class="row" style="margin-top:6px"><button class="btn sm" data-act="save">今すぐセーブ</button><button class="btn sm red" data-act="reset">データを消して最初から</button></div></div>`;
 }
 else if(tab==='dex'){
  const c=Object.keys(s.dex).length;
  h+=`<div class="card"><h3>📖 魚図鑑 ${c}/${SPECIES.length}</h3><div class="prog"><div style="width:${c/SPECIES.length*100}%"></div></div></div>`;
  for(const a of AREAS){const list=SPECIES.filter(p=>p.a===a.id);
   h+=`<div class="card"><h3>${a.ic} ${a.n}</h3><div class="dex">${list.map(p=>{const d=s.dex[p.id];return`<div class="dc" data-act="dex" data-id="${p.id}" style="border-color:${d?RCOL[p.r]+'66':'transparent'}">${thumb(p,!d)}<div style="color:${d?'#fff':'#789'}">${d?p.n:'？？？'}</div><div style="color:${RCOL[p.r]}">${RAR[p.r]}</div></div>`;}).join('')}</div></div>`;}
 }
 P.innerHTML=h;
}
function showDex(id){
 const p=SPM[id],d=s.dex[id];
 $('#mbox').innerHTML=d?`${thumb(p)}<h3 style="color:${RCOL[p.r]}">${p.n}</h3><div style="color:${RCOL[p.r]}">${RAR[p.r]}</div>
 <table><tr><td>生息エリア</td><td>${AREAM[p.a].ic} ${AREAM[p.a].n}${p.g?'（採取）':''}</td></tr><tr><td>最高サイズ</td><td>${fmtSize(d.max)}</td></tr><tr><td>サイズの目安</td><td>${fmtSize(p.mn)}〜${fmtSize(p.mx)}</td></tr><tr><td>捕まえた数</td><td>${d.c}匹</td></tr><tr><td>基本魅力度</td><td>${p.ap}</td></tr></table>
 <div class="sub" style="text-align:left">${p.d}</div><button class="btn" style="margin-top:12px;width:100%" data-close>閉じる</button>`
 :`${thumb(p,true)}<h3>？？？</h3><div style="color:${RCOL[p.r]}">${RAR[p.r]}</div><div class="sub" style="margin:10px 0">${AREAM[p.a].ic} ${AREAM[p.a].n}で${p.g?'採取できる':'釣れる'}らしい…</div><button class="btn" style="width:100%" data-close>閉じる</button>`;
 $('#modal').style.display='flex';
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.hasAttribute('data-close'))$('#modal').style.display='none';});

function findFish(u){return s.bucket.find(f=>f.u===u);}
$('#panel').addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,u=+el.dataset.u;
 switch(act){
  case'seltank':s.cur=+el.dataset.i;bubbles=[];break;
  case'put':{const tank=s.tanks[s.cur],f=findFish(u);if(f&&tank.fish.length<tank.cap){s.bucket=s.bucket.filter(x=>x.u!==u);tank.fish.push(f);log(`🐠 ${SPM[f.s].n}を水槽${s.cur+1}に展示した`);}break;}
  case'back':{const tank=s.tanks[s.cur],f=tank.fish.find(x=>x.u===u);if(!f)break;if(s.bucket.length>=bucketCap()){log('🪣 いけすが満杯です');return;}tank.fish=tank.fish.filter(x=>x.u!==u);delete anim[u];s.bucket.push(f);break;}
  case'sell':{const f=findFish(u);if(f){const g=sellPrice(f);s.gold+=g;s.bucket=s.bucket.filter(x=>x.u!==u);log(`💰 ${SPM[f.s].n}を ${g}G で売った`,'#ffd166');}break;}
  case'sellall':{const g=s.bucket.reduce((a,f)=>a+sellPrice(f),0);s.gold+=g;log(`💰 いけすの${s.bucket.length}匹を ${g}G で売った`,'#ffd166');s.bucket=[];break;}
  case'fishtap':fishTap();return;
  case'gather':gather();return;
  case'area':s.area=el.dataset.id;fs.st='idle';break;
  case'buy':buy(el.dataset.k);break;
  case'area_buy':{const a=AREAM[el.dataset.id];if(s.gold>=a.cost&&s.rating>=a.req&&!s.areas.includes(a.id)){s.gold-=a.cost;s.areas.push(a.id);log(`⛵ 新エリア「${a.n}」を解放！釣り場で選べます`,'#ffd166');}break;}
  case'dex':showDex(el.dataset.id);return;
  case'save':save();log('💾 セーブしました');return;
  case'reset':if(confirm('本当にデータを消して最初からやり直しますか？')){localStorage.removeItem(KEY);s=newState();for(const k in anim)delete anim[k];log('🌴 新しい島での生活が始まった！');}break;
 }
 recalc();save();renderPanel();updateTop();
});
function buy(k){
 const tank=s.tanks[s.cur];let cost=0,ok=false,msg='';
 switch(k){
  case'rod':cost=ROD_COST[s.rod+1];if(s.rod<6&&s.gold>=cost){s.rod++;ok=true;msg=`🎣 釣り竿が Lv${s.rod} になった！`;}break;
  case'tankup':cost=Math.round(80*Math.pow(1.55,tank.cap-3));if(tank.cap<10&&s.gold>=cost){tank.cap++;ok=true;msg=`💧 水槽${s.cur+1}を拡張！定員${tank.cap}匹`;}break;
  case'newtank':cost=NEWTANK_COST[s.tanks.length];if(s.tanks.length<4&&s.gold>=cost&&s.rating>=s.tanks.length+1){s.tanks.push({cap:3,fish:[]});ok=true;msg=`🏗️ 水槽${s.tanks.length}（${AREAS[s.tanks.length-1].n}テーマ）を増設！`;}break;
  case'cafe':{const c=CAFE[s.b.cafe];if(c&&s.gold>=c.c&&s.rating>=c.q){cost=c.c;s.b.cafe++;ok=true;msg=`☕ カフェが Lv${s.b.cafe} に！`;}break;}
  case'cottage':{const c=COTT[s.b.cottage];if(c&&s.gold>=c.c&&s.rating>=c.q){cost=c.c;s.b.cottage++;ok=true;msg=`🛖 コテージを建てた！（${s.b.cottage}棟）`;}break;}
  case'lighthouse':cost=1500;if(!s.b.lighthouse&&s.gold>=cost&&s.rating>=3){s.b.lighthouse=1;ok=true;msg='💡 灯台が完成！夜の島が明るくなった';}break;
  case'pier':cost=400;if(!s.b.pier&&s.gold>=cost){s.b.pier=1;ok=true;msg='⚓ 桟橋が完成！釣りがはかどる';}break;
 }
 if(ok){s.gold-=cost;log(msg,'#ffd166');}
}

// タブ
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
 tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 bubbles=[];if(tab==='dex')for(let i=0;i<20;i++)bubbles.push({x:rand(0,W),y:rand(0,H),r:rand(2,6),v:rand(10,30),ph:rand(0,6)});
 renderPanel();updateTop();}));
// キャンバスのタップ
cv.addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(tab==='fish')fishTap();
 else if(tab==='tank'){let best=null,bd=1e9;for(const f of s.tanks[s.cur].fish){const a=anim[f.u];if(!a)continue;const d=Math.hypot(a.x-x,a.y-y);if(d<Math.max(30,a.L*.6)&&d<bd){bd=d;best=f;}}
  if(best)selFish={u:best.u,until:T+2.5};else for(let i=0;i<6;i++)bubbles.push({x:x+rand(-6,6),y,r:rand(2,5),v:rand(40,70),ph:rand(0,6)});}
});

// ===================== セーブ/ロード =====================
function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1){const n=newState();d.b=Object.assign(n.b,d.b||{});return Object.assign(n,d);}}catch(e){}return null;}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

// ===================== ループ =====================
let lastT=performance.now();
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;T+=dt;
 updateEconomy(dt);if(gatherCd>0)gatherCd-=dt;
 if(tab==='tank')updateTank(dt);
 if(tab==='fish'||fs.st!=='idle')updateFishing(dt);
 if(tab==='dex'){for(const b of bubbles){b.y-=b.v*dt;if(b.y<-10){b.y=H+10;b.x=rand(0,W);}}}
 ctx.clearRect(0,0,W,H);
 if(tab==='tank')drawTank();else if(tab==='fish')drawFishing();else if(tab==='island')drawIsland();else drawDexBg();
 topT-=dt;if(topT<=0){topT=.25;updateTop();}
 saveT+=dt;if(saveT>10){saveT=0;save();}
 requestAnimationFrame(loop);
}
// 起動
resize();recalc();
(function offline(){const el=Math.min(7200,(Date.now()-(s.last||Date.now()))/1000);
 if(el>60&&APPEAL>0){const g=Math.round(visRate()*.6*ticket()*el*.4);s.gold+=g;log(`🌙 留守の間に観光客が来ていた！ +${fmtG(g)}`,'#ffd166');}})();
if(!s.totalVis&&!Object.keys(s.dex).length)setTimeout(()=>log('🌴 ようこそ無人島へ！まずは「🎣釣り場」で魚を釣ってみよう'),300);
renderPanel();updateTop();requestAnimationFrame(loop);
</script>
</body>
</html>
