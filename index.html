<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏝️ Aqua Island 〜無人島アクアリウム〜</title>
<style>
:root{--bg:#062a3e;--panel:#0b3a52;--card:#11506e;--acc:#4fd1c5;--gold:#ffd166;--txt:#e8f7ff;--sub:#9cc7da}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:#073246 linear-gradient(#04202f,#073246) fixed;color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
#top{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px 4px;position:sticky;top:0;background:rgba(4,32,47,.96);z-index:5}
.stat{background:var(--panel);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;line-height:1.3;color:var(--sub)}
.stat b{display:block;font-size:14px;color:var(--gold);white-space:nowrap}
#dayBar{grid-column:1/-1;height:4px;background:#0b3a52;border-radius:2px;overflow:hidden}
#dayFill{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff8fab,#7b6cff)}
#tabs{display:flex;gap:4px;padding:4px 8px 0}
.tab{flex:1;padding:9px 2px;border:none;border-radius:10px 10px 0 0;background:var(--panel);color:var(--sub);font-size:12.5px;font-weight:bold;font-family:inherit}
.tab.on{background:var(--card);color:#fff}
#stage{position:relative;margin:0 8px;border-top:3px solid var(--card)}
canvas#cv{display:block;width:100%;height:min(50vh,420px);border-radius:0 0 12px 12px;background:#000;touch-action:manipulation}
#log{position:absolute;left:6px;top:6px;right:6px;pointer-events:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.msg{background:rgba(0,18,30,.72);padding:3px 9px;border-radius:8px;font-size:12px;transition:opacity .8s;max-width:92%;border-left:3px solid var(--acc)}
#panel{padding:8px 8px 40px;flex:1}
.btn{border:none;border-radius:10px;padding:10px 12px;background:var(--acc);color:#04202f;font-weight:bold;font-size:14px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn:disabled{background:#2e5568;color:#7fa2b2}
.btn.sm{padding:6px 9px;font-size:12px}
.btn.gold{background:var(--gold)}
.btn.red{background:#ff7b8a}
.btn.ghost{background:var(--card);color:var(--txt)}
.btn.on{outline:2px solid #fff}
.btn.big{flex:1;padding:14px;font-size:16px}
.btn.gold:disabled,.btn.red:disabled,.btn.ghost:disabled{background:#2e5568;color:#7fa2b2}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.card{background:var(--panel);border-radius:12px;padding:10px;margin-bottom:8px}
h3{margin:2px 0 8px;font-size:14.5px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.item{background:var(--card);border-radius:10px;padding:6px;display:flex;gap:6px;align-items:center;font-size:12px}
.item .info{flex:1;min-width:0}
.item .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:48px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.th img{max-width:48px;max-height:30px}
.th .em{font-size:24px;line-height:1}
.unk{filter:brightness(0) opacity(.45)}
.up{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:6px}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .info{flex:1;font-size:12px}
.up .info b{font-size:13.5px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.dc{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;border:2px solid transparent}
.dc .th{margin:0 auto 3px;width:64px;height:40px}
.dc .th img{max-width:64px;max-height:40px}
.dc .th .em{font-size:30px}
.prog{height:8px;background:#062a3e;border-radius:4px;overflow:hidden;margin-top:4px}
.prog div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
.mbox{background:var(--panel);border-radius:16px;padding:16px;width:min(90vw,360px);text-align:center}
.mbox .th{width:150px;height:90px;margin:4px auto 8px}
.mbox .th img{max-width:150px;max-height:90px}
.mbox .th .em{font-size:64px}
.mbox table{width:100%;font-size:13px;margin:8px 0;text-align:left}
.mbox{max-height:88vh;overflow-y:auto}
.gmin{width:100%;padding:9px;border-radius:8px;border:1px solid #2e6a88;background:#062a3e;color:#fff;font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
.gmbox{text-align:left}.gms{font-weight:bold;font-size:13px;margin:10px 0 5px;color:var(--gold)}
[data-gm],[data-tab=dex]{-webkit-touch-callout:none;touch-action:none}
.mbox td:first-child{color:var(--sub);width:40%}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat">所持金<b id="sG">0G</b></div>
    <div class="stat"><span id="sW">日付</span><b id="sD">Day 1</b></div>
    <div class="stat">観光客<b id="sV">0人</b></div>
    <div class="stat">島の評価<b id="sR">Lv1</b></div>
    <div id="dayBar"><div id="dayFill"></div></div>
  </div>
  <div id="tabs">
    <button class="tab on" data-tab="tank">🐠 水槽</button>
    <button class="tab" data-tab="fish">🎣 釣り場</button>
    <button class="tab" data-tab="island">🏝️ 島・設備</button>
    <button class="tab" data-tab="dex">📖 図鑑</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="log"></div></div>
  <div id="panel"></div>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
// ===================== データ =====================
const AREAS=[
 {id:'beach',n:'浅瀬',ic:'🏖️',cost:0,req:1,w:['#62d4e8','#0c6f93']},
 {id:'reef',n:'サンゴ礁',ic:'🐠',cost:600,req:2,w:['#48e0cf','#0b5f86']},
 {id:'open',n:'沖合',ic:'🌊',cost:2500,req:3,w:['#2d8fd0','#0a3768']},
 {id:'deep',n:'深海',ic:'🌑',cost:9000,req:5,w:['#1b4a7c','#01060f']},
];
const AREAM={};AREAS.forEach(a=>AREAM[a.id]=a);
const DREAM={id:'dream',n:'夢で見た海',ic:'🌙',w:['#e8d8ff','#f6d6ec']};AREAM.dream=DREAM;
const DREAM_WAIT=[0,5.6,4.5,3.5,2.7,1.85,1.2];  // 竿Lvごとの「夢で見た海」の待ち時間倍率
const BOAT_CHANCE=.06;                      // 雨の日に幻の小舟が現れる確率
const RAR=['','★','★★','★★★','★★★★','★★★★★','🌈幻★6'];
const RCOL=['','#cfd8dc','#7ee081','#5ab0ff','#c98bff','#ffcf40','#ff6bd6'];
const WAIT_MULT=[1,1.35,1.75,2.2];      // エリアが深いほど魚がかかるまで遅い
const RAIN_CHANCE=[0,.1,.2,.3];        // 解放エリア数に応じた雨の確率
const TANK_BASE=[80,300,900,2500];     // 解放エリア数に応じた水槽拡張の基本価格
const S=(id,n,a,r,ap,mn,mx,o,d)=>Object.assign({id,n,a,r,ap,mn,mx,d},o);
const SPECIES=[
// ---- 浅瀬 ----
S('iwashi','マイワシ','beach',1,3,10,22,{c1:'#dfeaf2',c2:'#2f5f8f',h:.3,pat:'dots'},'体の横に黒い点が並ぶ小魚。大きな群れをつくって外敵から身を守る。'),
S('kisu','シロギス','beach',1,5,15,30,{c1:'#f4efe4',c2:'#c9b98f',h:.24,pat:'none'},'砂地にすむ上品な白身魚。その美しさから「海の女王」とも呼ばれる。'),
S('aji','マアジ','beach',1,4,15,40,{c1:'#e3ead2',c2:'#5f7f55',h:.33,pat:'line'},'体の側面に「ぜいご」という硬いウロコの列をもつ。食卓でもおなじみ。'),
S('haze','マハゼ','beach',1,4,8,20,{c1:'#d6c8a6',c2:'#7a6646',h:.26,pat:'spots'},'河口や浅い砂地にすむ。秋のハゼ釣りは昔からの風物詩。'),
S('suzume','スズメダイ','beach',1,4,5,12,{c1:'#56688a',c2:'#28324a',h:.5,pat:'none'},'岩場で群れる小さな魚。地味な色だが、よく見ると青く光る。'),
S('mejina','メジナ','beach',1,5,15,40,{c1:'#46596a',c2:'#1d2a35',h:.45,pat:'none'},'磯釣りの人気ターゲット。「グレ」とも呼ばれ、引きが強い。'),
S('kawahagi','カワハギ','beach',2,9,12,30,{c1:'#e0cfa2',c2:'#8b6a3a',h:.62,pat:'spots'},'おちょぼ口でエサだけをかすめ取る、釣り人泣かせの「エサ取り名人」。'),
S('harisen','ハリセンボン','beach',2,13,15,35,{e:'🐡'},'驚くと水を吸って体をふくらませ、トゲを立てて身を守る。'),
S('kasago','カサゴ','beach',2,10,10,30,{c1:'#c0392b',c2:'#6e1b14',h:.42,pat:'spots',bigEye:1},'岩のすき間でじっと獲物を待つ。ゴツゴツした見た目だが味は絶品。'),
S('mebaru','メバル','beach',2,9,15,30,{c1:'#8a6a55',c2:'#4a3528',h:.42,pat:'vstripe',bigEye:1},'大きな目が名前の由来（目張る）。夜になると活発に泳ぐ。'),
S('karei','マコガレイ','beach',2,11,15,45,{c1:'#b9a27e',c2:'#6b5638',h:.62,pat:'spots'},'平たい体で砂にまぎれる。成長すると両目が体の右側に寄る。'),
S('ishidai','イシダイ','beach',2,14,20,60,{c1:'#e8e2d0',c2:'#222222',h:.55,pat:'vstripe'},'白黒のしま模様が目印。硬い歯でサザエの殻もかみ砕く。'),
S('madai','マダイ','beach',3,28,30,90,{c1:'#ff7a8a',c2:'#5ab0ff',h:.5,pat:'bluedots'},'「魚の王様」と呼ばれるおめでたい魚。体には青い点が散らばる。'),
S('hirame','ヒラメ','beach',3,26,30,90,{c1:'#a8916a',c2:'#5b4628',h:.6,pat:'spots'},'カレイとは逆に、目が体の左側にある。砂に潜って獲物を狙う。'),
S('hata','キジハタ','beach',3,24,20,50,{c1:'#c96f3a',c2:'#ff9a5a',h:.4,pat:'spots'},'オレンジの斑点が美しい高級魚。関西では「アコウ」と呼ばれる。'),
S('tatsu','タツノオトシゴ','beach',3,30,5,15,{shape:'seahorse',c1:'#f2b84b',c2:'#c47a1a'},'馬のような顔をした魚の仲間。オスがお腹の袋で赤ちゃんを育てる。'),
S('ei','アカエイ','beach',3,32,40,150,{shape:'ray',c1:'#a0705a',c2:'#5e3c2c'},'ひらひらと海底を飛ぶように泳ぐ。尾には毒のトゲがある。'),
S('kue','クエ','beach',4,60,60,130,{c1:'#6b5a4a',c2:'#3a2e24',h:.42,pat:'spots'},'岩礁の主ともいえる大型のハタ。幻の高級魚として知られる。'),
// ---- 浜辺の採取 ----
S('kani','イソガニ','beach',1,4,3,8,{e:'🦀',g:1,bottom:1},'磯の岩のすき間にすむ小さなカニ。横歩きでちょこちょこ動き回る。'),
S('hitode','イトマキヒトデ','beach',1,3,5,15,{e:'⭐',g:1,bottom:1},'糸巻きのような形のヒトデ。腕が切れても再生する力をもつ。'),
S('namako','マナマコ','beach',1,4,10,30,{shape:'slug',c1:'#6a5a3a',c2:'#3d3220',g:1,bottom:1},'海底の砂を食べてきれいにする「海の掃除屋」。'),
S('yado','ヤドカリ','beach',2,7,2,10,{e:'🐚',g:1,bottom:1},'貝殻をお家にして暮らす。成長すると大きな貝殻へお引っ越し。'),
S('kuruma','クルマエビ','beach',2,10,10,25,{e:'🦐',g:1,bottom:1},'体を丸めると縞模様が車輪のように見えることが名前の由来。'),
S('uni','ムラサキウニ','beach',2,8,4,8,{shape:'urchin',c1:'#4b2a5a',c2:'#2a1033',g:1,bottom:1},'トゲをゆっくり動かして歩く。海藻を食べる磯の住人。'),
S('ebi','イセエビ','beach',3,22,15,35,{e:'🦞',g:1,bottom:1},'長いヒゲが立派な高級エビ。夜になると岩陰から出てくる。'),
S('sakura','サクラガイ','beach',3,18,1,3,{shape:'shell',c1:'#ffc0cb',c2:'#ff8fab',g:1,bottom:1},'桜の花びらのような薄ピンクの貝殻。浜辺で見つかると幸運のしるし。'),
S('shinju','アコヤガイ','beach',4,50,5,10,{shape:'shell',c1:'#e8e0d0',c2:'#b8a890',g:1,bottom:1,pearl:1},'貝の中で真珠を育てる。ごくまれに大粒の真珠を抱いている。'),
// ---- サンゴ礁 ----
S('deba','デバスズメダイ','reef',1,5,4,8,{c1:'#7fe3e0',c2:'#3fb8b5',h:.5,pat:'none'},'エメラルド色の小魚。危険を感じるとサンゴの枝の間に逃げ込む。'),
S('sora','ソラスズメダイ','reef',1,6,4,8,{c1:'#2f6bff',c2:'#1a3fb0',h:.48,pat:'none',tc:'#ffd23f'},'空のような青い体と黄色い尾びれ。サンゴ礁の彩り役。'),
S('kumanomi','カクレクマノミ','reef',2,15,5,11,{c1:'#ff8a2b',c2:'#ffffff',h:.46,pat:'band'},'イソギンチャクと共生するオレンジの人気者。水族館の大スター。'),
S('chou','チョウチョウウオ','reef',2,14,10,22,{c1:'#ffe14d',c2:'#2b2b2b',h:.82,pat:'eyebar'},'尾の近くの黒い点は「ニセの目」。敵に頭の位置をごまかす作戦。'),
S('hanadai','キンギョハナダイ','reef',2,12,6,12,{c1:'#ff8c42',c2:'#c95a20',h:.42,pat:'none',tc:'#ff4f9a'},'オレンジ色の群れでサンゴ礁を彩る。成長するとメスがオスに変わる。'),
S('tsuno','ツノダシ','reef',2,16,10,20,{c1:'#ffe14d',c2:'#111111',h:.85,pat:'vstripe'},'長く伸びた背びれがチャームポイント。白黒黄色のおしゃれな魚。'),
S('hako','ハコフグ','reef',2,14,8,20,{c1:'#ffd23f',c2:'#333333',h:.7,pat:'dots'},'体が硬い骨の箱で覆われている。小さなヒレで一生懸命泳ぐ。'),
S('iro','イロブダイ','reef',2,15,30,60,{c1:'#3ad0a0',c2:'#ff6fa8',h:.42,pat:'bluedots'},'夜は自分で作った粘液の膜に包まって眠る。'),
S('nanyo','ナンヨウハギ','reef',3,24,12,30,{c1:'#2457e6',c2:'#ffd23f',h:.55,pat:'tang'},'鮮やかな青い体に黄色い尾びれ。尾の付け根には鋭いトゲがある。'),
S('tako','マダコ','reef',3,28,30,80,{e:'🐙',bottom:1},'とても頭が良く、ビンのフタを開けることも。体の色を自在に変える。'),
S('nishiki','ニシキヤッコ','reef',3,28,15,25,{c1:'#ffcf33',c2:'#2f5bd8',h:.65,pat:'vstripe'},'黄色と青の縞が錦のように美しいキンチャクダイの仲間。'),
S('mino','ミノカサゴ','reef',3,34,15,35,{c1:'#ffb3a3',c2:'#8a1a1a',h:.5,pat:'vstripe',wing:1},'大きなヒレを広げて優雅に泳ぐ。トゲには毒がある。'),
S('mongara','モンガラカワハギ','reef',3,30,20,40,{c1:'#20202e',c2:'#ffd23f',h:.58,pat:'ws',tc:'#ffd23f'},'お腹の白い水玉模様が派手な、サンゴ礁のおしゃれさん。'),
S('utsubo','ハナヒゲウツボ','reef',3,30,60,120,{shape:'eel',c1:'#2a5bd8',c2:'#ffd23f'},'青と黄色の鮮やかなウツボ。成長につれて黒→青→黄と色が変わる。'),
S('kame','アオウミガメ','reef',4,65,60,120,{e:'🐢'},'海藻を食べるおだやかなウミガメ。何十年も生きる長寿の生き物。'),
S('napoleon','メガネモチノウオ','reef',4,70,60,200,{c1:'#3aa58a',c2:'#1f6a5a',h:.5,pat:'wave'},'通称ナポレオンフィッシュ。おでこのコブが帽子のように見える。'),
S('manta','マンタ','reef',5,190,300,700,{shape:'ray',c1:'#2a3442',c2:'#e8eef4'},'翼を広げると7mにもなる巨大なエイ。ゆったり舞う姿は圧巻。'),
// ---- 沖合 ----
S('saba','マサバ','open',1,6,25,50,{c1:'#b8d0dc',c2:'#2a5070',h:.28,pat:'wave'},'背中のくねくね模様が特徴。大きな群れで回遊する。'),
S('sanma','サンマ','open',1,5,25,40,{c1:'#d0dce8',c2:'#2a3e6a',h:.17,pat:'back'},'刀のように細長い秋の味覚。漢字では「秋刀魚」と書く。'),
S('katsuo','カツオ','open',2,18,40,90,{c1:'#cfd9e4',c2:'#1d3352',h:.32,pat:'stripes'},'黒潮にのって旅をする回遊魚。お腹の縞模様は興奮すると浮き出る。'),
S('tobiuo','トビウオ','open',2,14,20,40,{c1:'#c8d8f0',c2:'#2a4a8a',h:.25,pat:'back',wing:1},'大きな胸びれを広げ、海面を数百mも滑空する。'),
S('buri','ブリ','open',2,18,50,120,{c1:'#a8bccb',c2:'#ffd23f',h:.3,pat:'line'},'成長とともに名前が変わる出世魚。ワカシ→イナダ→ワラサ→ブリ。'),
S('akakurage','アカクラゲ','open',2,20,10,25,{shape:'jelly',c1:'rgba(255,170,150,0.5)',c2:'#d4503a'},'赤い縞模様の傘をもつクラゲ。触手には毒があるので注意。'),
S('kurage','ミズクラゲ','open',3,35,10,30,{shape:'jelly',c1:'rgba(225,238,255,0.5)',c2:'#ffb3d9'},'ふわふわと漂う癒やし系。四つ葉のクローバーのような模様が目印。'),
S('shiira','シイラ','open',3,30,60,150,{c1:'#3fbf6a',c2:'#ffd23f',h:.35,pat:'bluedots'},'金と緑に輝く体。流木の下に集まる習性がある。'),
S('eboshi','カツオノエボシ','open',3,38,10,30,{shape:'jelly',c1:'rgba(150,170,255,0.55)',c2:'#7a5cff'},'青い浮き袋で海面を漂う。正体はたくさんの生き物の集まり。'),
S('maguro','クロマグロ','open',4,75,100,300,{c1:'#c3cfdb',c2:'#13243c',h:.3,pat:'back'},'時速80kmにもなる海の弾丸。止まると呼吸できず、一生泳ぎ続ける。'),
S('manbou','マンボウ','open',4,85,100,330,{shape:'manbou',c1:'#a9b5c1',c2:'#5f6c7a'},'一度に数億個の卵を産むといわれる。のんびり屋の人気者。'),

function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function lerpCol(a,b,f){const A=hex2rgb(a),B=hex2rgb(b);return rgb([A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f]);}
function shade(h,f){if(h[0]!=='#')return h;const c=hex2rgb(h);return rgb(c.map(v=>f<0?v*(1+f):v+(255-v)*f));}
function fmtSize(z){return z>=100?(z/100).toFixed(2)+'m':z.toFixed(1)+'cm';}
function fmtG(g){return Math.floor(g).toLocaleString()+'G';}

function timeMult(h){const ev=curEvent();if(ev&&ev.night&&(h>=19||h<6))return .95;if(h>=9&&h<19)return 1;if(h>=6&&h<9)return .5;if(h>=19&&h<22)return .6;return .15;}

const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function drawCreature(c,sp,L,t,ph,dir){
 c.save();if(sp.a==='dream'){c.globalAlpha*=.85;c.shadowColor='rgba(255,210,245,.9)';c.shadowBlur=Math.min(18,L*.25);}
 if(sp.e){c.scale(-dir,1);c.rotate(Math.sin(t*2+ph)*.07);c.font=`${L}px ${EMOJI_FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(sp.e,0,0);c.restore();return;}
 c.scale(dir,1);
 switch(sp.shape){
  case'jelly':drawJelly(c,sp,L,t,ph);break;
  case'manbou':drawManbou(c,sp,L,t,ph);break;
  case'menda':drawMenda(c,sp,L,t,ph);break;
  case'angler':drawAngler(c,sp,L,t,ph);break;
  case'long':case'eel':drawLong(c,sp,L,t,ph);break;
  case'seahorse':drawSeahorse(c,sp,L,t,ph);break;
  case'ray':drawRay(c,sp,L,t,ph);break;
  case'urchin':drawUrchin(c,sp,L,t,ph);break;
  case'slug':drawSlug(c,sp,L,t,ph);break;
  case'shell':drawShell(c,sp,L,t,ph);break;
  case'isopod':drawIsopod(c,sp,L,t,ph);break;
  case'clione':drawClione(c,sp,L,t,ph);break;
  case'junk':drawJunk(c,sp,L,t,ph);break;
  default:drawFishBody(c,sp,L,t,ph);
 }
 c.restore();
}
function drawEye(c,x,y,r){c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(x+r*.15,y,r*.6,0,7);c.fill();c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(x+r*.35,y-r*.3,r*.22,0,7);c.fill();}
function drawFishBody(c,sp,L,t,ph){
 const h=L*(sp.h||.4),w=Math.sin(t*7+ph)*(sp.shark?.22:.35);
 const fx=sp.pat==='rainbow'?`hsl(${(t*60+ph*40)%360},90%,70%)`:sp.pat==='gold'?'#e0a800':null;
 const tailCol=fx||sp.tc||(sp.pat==='tang'?sp.c2:shade(sp.c1,-.15));
 const finCol=fx||(sp.pat==='tang'?sp.c2:(sp.pat==='band'?sp.c1:shade(sp.c1,-.2)));
 // 尾びれ
 c.save();c.translate(-L*.42,0);c.rotate(w);c.fillStyle=tailCol;c.beginPath();
 if(sp.shark){c.moveTo(4,0);c.lineTo(-L*.3,-h*1.1);c.quadraticCurveTo(-L*.12,-h*.1,-L*.18,h*.55);c.closePath();}
 else{c.moveTo(4,0);c.lineTo(-L*.28,-h*.62);c.quadraticCurveTo(-L*.17,0,-L*.28,h*.62);c.closePath();}
 c.fill();if(sp.pat==='band'){c.strokeStyle='#111';c.lineWidth=1.2;c.stroke();}c.restore();
 // 背びれ
 c.fillStyle=finCol;
 if(sp.sail){c.save();c.globalAlpha=.85;c.fillStyle=sp.c2;c.beginPath();c.moveTo(L*.3,-h*.35);c.quadraticCurveTo(L*.1,-h*2.6-Math.sin(t*2+ph)*3,-L*.3,-h*.3);c.fill();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;for(let i=0;i<6;i++){const x=L*.25-i*L*.09;c.beginPath();c.moveTo(x,-h*.35);c.lineTo(x-L*.02,-h*(2.1-Math.abs(i-2)*.25));c.stroke();}c.restore();}
 else if(sp.shark){c.beginPath();c.moveTo(-L*.12,-h*.4);c.lineTo(-L*.02,-h*1.25);c.lineTo(L*.1,-h*.4);c.fill();c.beginPath();c.moveTo(-L*.32,-h*.25);c.lineTo(-L*.3,-h*.55);c.lineTo(-L*.25,-h*.25);c.fill();}
 else{c.beginPath();c.moveTo(-L*.25,-h*.3);c.quadraticCurveTo(-L*.02,-h*.95-Math.sin(t*3+ph)*2,L*.14,-h*.38);c.fill();}
 c.beginPath();c.moveTo(-L*.12,h*.36);c.quadraticCurveTo(0,h*.78,L*.06,h*.4);c.fill();
 // 吻（カジキ・ミツクリザメ）
 if(sp.bill){c.strokeStyle=shade(sp.c1,-.3);c.lineWidth=Math.max(1.5,h*.09);c.lineCap='round';c.beginPath();c.moveTo(L*.44,-h*.05);c.lineTo(L*(sp.shark?.66:.85),-h*.1);c.stroke();}
 // 体
 c.beginPath();
 if(sp.shark){c.moveTo(L*.52,-h*.02);c.quadraticCurveTo(L*.35,-h*.62,-L*.1,-h*.5);c.quadraticCurveTo(-L*.45,-h*.3,-L*.5,0);c.quadraticCurveTo(-L*.4,h*.35,0,h*.48);c.quadraticCurveTo(L*.4,h*.4,L*.52,-h*.02);}
 else c.ellipse(0,0,L/2,h/2,0,0,Math.PI*2);
 let g=c.createLinearGradient(0,-h/2,0,h/2);
 if(sp.pat==='rainbow'){for(let i=0;i<6;i++)g.addColorStop(i/5,`hsl(${(t*60+i*55+ph*40)%360},90%,${62+i*3}%)`);}

function skyCol(h){const K=[[0,'#0b1030','#1b2350'],[5,'#2b2f6b','#e8838a'],[7,'#7ec8f0','#ffd9a8'],[12,'#3fa8ee','#c4ecff'],[17,'#5a8fd8','#ffc58a'],[18.7,'#3b3f8a','#ff8a6b'],[20.5,'#121a45','#3a2f6b'],[24,'#0b1030','#1b2350']];
 for(let i=0;i<K.length-1;i++)if(h>=K[i][0]&&h<=K[i+1][0]){const f=(h-K[i][0])/(K[i+1][0]-K[i][0]);return[lerpCol(K[i][1],K[i+1][1],f),lerpCol(K[i][2],K[i+1][2],f)];}return[K[0][1],K[0][2]];}
function drawRain(){const st=stormStage(),n=st==='storm'?220:st==='warn'?160:90,sl=st==='storm'?.6:.2;ctx.strokeStyle='rgba(200,220,255,.45)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<n;i++){const v=480+(i%5)*70,y=((i*97.3)+T*v)%(H+30)-15,x=(((i*137.5)%W)+y*sl)%W;ctx.moveTo(x,y);ctx.lineTo(x-13*sl,y+13);}ctx.stroke();
 if(thunder>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(.6,thunder*2)})`;ctx.fillRect(0,0,W,H);}}
function drawSky(hz){
 const h=hourNow(),nt=night(h);
 if(s.rain){let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,lerpCol('#5a6672','#14181e',nt));g.addColorStop(1,lerpCol('#8a96a2','#262c34',nt));ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+1);
  ctx.fillStyle=`rgba(${70-nt*40},${78-nt*40},${88-nt*40},.9)`;for(let i=0;i<6;i++){const x=((T*(5+i*2)+i*W*.3)%(W+200))-100,y=hz*(.12+(i%3)*.18);for(const [dx,dy,r] of[[0,0,22],[22,-8,26],[48,0,20],[24,6,22]]){ctx.beginPath();ctx.arc(x+dx,y+dy,r,0,7);ctx.fill();}}return Math.max(nt,.35);}
 const [a,b]=skyCol(h);
 let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+1);
 if(nt>0){ctx.fillStyle=`rgba(255,255,255,${nt*.8})`;for(let i=0;i<40;i++){const tw=.5+.5*Math.sin(T*2+i);ctx.globalAlpha=nt*tw;ctx.fillRect((i*137)%W,(i*71)%(hz*.9),1.5,1.5);}ctx.globalAlpha=1;}
 const dayP=(h-6)/12;if(dayP>=0&&dayP<=1){const x=W*dayP,y=hz-Math.sin(Math.PI*dayP)*hz*.8;const sg=ctx.createRadialGradient(x,y,0,x,y,40);sg.addColorStop(0,'rgba(255,250,220,1)');sg.addColorStop(.3,'rgba(255,230,150,.8)');sg.addColorStop(1,'rgba(255,200,100,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(x,y,40,0,7);ctx.fill();}
 else{const mp=((h+6)%24)/12;if(mp>=0&&mp<=1){const x=W*mp,y=hz-Math.sin(Math.PI*mp)*hz*.8;ctx.fillStyle='#f4f1d0';ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill();ctx.fillStyle=a;ctx.beginPath();ctx.arc(x+5,y-3,10,0,7);ctx.fill();}}
 ctx.fillStyle=`rgba(255,255,255,${.75-nt*.5})`;
 for(let i=0;i<3;i++){const x=((T*(6+i*3)+i*W*.4)%(W+160))-80,y=hz*(.2+i*.2);for(const [dx,dy,r] of[[0,0,16],[16,-6,18],[34,0,14],[18,4,16]]){ctx.beginPath();ctx.arc(x+dx,y+dy,r,0,7);ctx.fill();}}
 return nt;
}
function drawDreamSky(hz){
 let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#ffd6ec');g.addColorStop(.55,'#e2dcff');g.addColorStop(1,'#fff2f8');ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+1);
 const mx=W*.7,my=hz*.42,mg=ctx.createRadialGradient(mx,my,0,mx,my,70);mg.addColorStop(0,'rgba(255,255,255,1)');mg.addColorStop(.25,'rgba(255,240,250,.8)');mg.addColorStop(1,'rgba(255,220,240,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,70,0,7);ctx.fill();
 for(let i=0;i<4;i++){const x=((T*(3+i)+i*W*.33)%(W+200))-100,y=hz*(.55+i*.1);ctx.fillStyle='rgba(200,180,240,.35)';ctx.beginPath();ctx.ellipse(x,y,40+i*10,8+i*2,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(x,y-10-i*2,18+i*4,10+i*3,0,Math.PI,0);ctx.fill();}
 for(let i=0;i<30;i++){const a=.4+.6*Math.sin(T*2+i*1.7);ctx.fillStyle=`rgba(255,255,255,${a*.8})`;ctx.fillRect((i*137)%W,(i*71)%(hz*.9),1.6,1.6);}
 return 0;}
function drawMist(hz){
 for(let i=0;i<6;i++){const x=((T*(8+i*3)+i*W*.37)%(W*1.6))-W*.3,y=hz+(H-hz)*(.05+i*.17),rx2=W*(.35+(i%3)*.1),ry2=18+i*4;
  const g=ctx.createRadialGradient(x,y,0,x,y,rx2);g.addColorStop(0,`rgba(${i%2?'255,230,245':'225,240,255'},.55)`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.save();ctx.translate(x,y);ctx.scale(1,ry2/rx2);ctx.beginPath();ctx.arc(0,0,rx2,0,7);ctx.fill();ctx.restore();}
 for(let i=0;i<18;i++){const y=H-((T*(10+i%4*4)+i*53)%(H+20)),x=(i*97+Math.sin(T+i)*20)%W;ctx.fillStyle=i%2?'rgba(255,190,225,.7)':'rgba(200,230,255,.7)';ctx.beginPath();ctx.ellipse(x,y,2.5,1.5,T+i,0,7);ctx.fill();}
}
function drawFishing(){
 const hz=H*.36,dream=s.area==='dream',nt=dream?drawDreamSky(hz):drawSky(hz),ar=AREAM[s.area];
 let g;
 if(dream){g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#f4e4ff');g.addColorStop(.5,'#c8e2f8');g.addColorStop(1,'#f6d6ec');ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  for(let i=0;i<5;i++){const x=W*(.1+i*.2)+Math.sin(T*.3+i)*10;g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-6,hz,12,H-hz);}}
 else{
 // 遠くの島
 ctx.fillStyle=lerpCol('#5d8a73','#1a2a3a',nt);ctx.beginPath();ctx.ellipse(W*.82,hz,W*.14,hz*.18,0,Math.PI,0);ctx.fill();
 // 海
 g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,shade(s.rain?'#5f7f8f':ar.w[0],-nt*.6));g.addColorStop(1,shade(ar.w[1],-nt*.5));ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);}
 ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5;
 for(let r=0;r<7;r++){const y=hz+8+r*r*7;ctx.beginPath();for(let x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*.04+T*1.5+r)*(1+r*.4));ctx.stroke();}
 // 魚影
 ctx.fillStyle=dream?'rgba(255,255,255,.3)':'rgba(0,0,0,.13)';for(let i=0;i<3;i++){const x=((T*(15+i*8)+i*200)%(W+100))-50,y=hz+(H-hz)*(.45+i*.15);ctx.beginPath();ctx.ellipse(x,y,22-i*3,7,0,0,7);ctx.fill();}
 // 波紋
 for(const rp of ripples){ctx.strokeStyle=`rgba(255,255,255,${1-rp.t})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(rp.x,rp.y,rp.t*30+4,rp.t*10+2,0,0,7);ctx.stroke();}
 // 桟橋
 ctx.fillStyle=lerpCol('#8b5a2b','#3a2a1a',nt);ctx.beginPath();ctx.moveTo(0,H*.78);ctx.lineTo(W*.22,H*.84);ctx.lineTo(W*.22,H);ctx.lineTo(0,H);ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(W*.04*i,H*.78+H*.012*i);ctx.lineTo(W*.04*i,H);ctx.stroke();}
 // 竿と糸
 const bend=fs.st==='reel'?18+Math.sin(T*20)*3:fs.st==='bite'?10:0;
 const rx=W*.12,ry=H*.97,tx=W*.3,ty=H*.42+bend;
 ctx.strokeStyle='#3b2a1a';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(rx,ry);ctx.quadraticCurveTo(W*.18,H*.6,tx,ty);ctx.stroke();
 ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(rx+8,ry-28,6,0,7);ctx.fill();
 if(fs.st!=='idle'&&fs.st!=='result'){
  let bx=fs.bx,by=fs.by;
  if(fs.st==='cast'){const k=Math.min(1,fs.t/.6);bx=tx+(fs.bx-tx)*k;by=ty+(fs.by-ty)*k-Math.sin(Math.PI*k)*H*.2;}
  let off=Math.sin(T*2.5)*2;if(fs.nib>0)off+=Math.sin(fs.nib*40)*3+3;if(fs.st==='bite')off=9+Math.sin(T*30)*2;if(fs.st==='reel'){off=6;bx+=Math.sin(T*9)*6;}
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo((tx+bx)/2,Math.max(ty,by+off)+(fs.st==='reel'?0:30),bx,by+off);ctx.stroke();
  // ウキ
  ctx.save();ctx.translate(bx,by+off);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI);ctx.fill();ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.arc(0,0,7,Math.PI,0);ctx.fill();ctx.fillRect(-1,-15,2,8);
  if(fs.st!=='cast'){ctx.fillStyle=shade(ar.w[0],-nt*.6);ctx.globalAlpha=.55;ctx.fillRect(-10,2+(fs.st==='bite'?-6:0),20,10);ctx.globalAlpha=1;}ctx.restore();
  if(fs.st==='bite'){ctx.fillStyle='#ffeb3b';ctx.strokeStyle='#b71c1c';ctx.lineWidth=4;ctx.font='bold 46px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.strokeText('！',bx,by-14);ctx.fillText('！',bx,by-14);}
 }
 // UIテキスト
 ctx.textAlign='center';ctx.textBaseline='middle';
 const txt=(t,y,size,col)=>{ctx.font=`bold ${size}px sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,20,40,.7)';ctx.strokeText(t,W/2,y);ctx.fillStyle=col||'#fff';ctx.fillText(t,W/2,y);};
 if(dream)drawMist(hz);
 if(s.rain&&!dream&&fs.st!=='result')drawRain();
 if(!dream&&stormStage()==='storm'){ctx.fillStyle='rgba(15,20,30,.45)';ctx.fillRect(0,0,W,H);txt('🌪 大嵐のため釣り場は閉鎖中',H*.5,17,'#ffb3b3');}
 if(dream&&fs.st!=='result')txt('🌙 夢で見た海 — 今日だけの不思議な海',H*.36+16,12,'#fff0fa');
 if(s.rain&&!dream&&fs.st!=='result')txt('☔ 雨の日ステージ',H*.36+16,12,'#bfe0ff');
 if(fs.st==='idle'){txt('タップでキャスト！🎣',H*.6+Math.sin(T*3)*3,18);txt(`${s.rain?'☔':ar.ic} ${ar.n}${s.rain?'（雨）':''}  ／  竿Lv${s.rod}`,H*.6+26,12,'#cfe');}
 if(fs.st==='wait'||fs.st==='cast')txt('…じっと待って、浮きが沈んだらタップ',H*.92,13,'#dff');
 if(fs.st==='bite')txt('今だ！タップ！',H*.92,18,'#ffeb3b');
 if(fs.st==='reel'){
  const bw=W*.76,bxx=(W-bw)/2,byy=H*.8,bh=20;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bxx-4,byy-34,bw+8,bh+44);
  txt(`リールを巻け！緑ゾーンでタップ (${fs.hits}/${fs.need})`,byy-18,13,'#fff');
  ctx.fillStyle='#173a4f';ctx.fillRect(bxx,byy,bw,bh);
  ctx.fillStyle='#38d36b';ctx.fillRect(bxx+bw*fs.z0,byy,bw*(fs.z1-fs.z0),bh);
  ctx.fillStyle='#b8ffcc';ctx.fillRect(bxx+bw*(fs.z0+fs.z1)/2-1,byy,2,bh);
  const mx=bxx+bw*fs.mk;ctx.fillStyle='#fff';ctx.fillRect(mx-2,byy-5,4,bh+10);ctx.beginPath();ctx.moveTo(mx-7,byy-10);ctx.lineTo(mx+7,byy-10);ctx.lineTo(mx,byy-3);ctx.fill();
 }
 if(fs.flash&&fs.flash.t>0){ctx.globalAlpha=Math.min(1,fs.flash.t);txt(fs.flash.txt,H*.5,22,fs.flash.col);ctx.globalAlpha=1;}
 if(fs.st==='result'){
  const r=fs.res,p=r.sp;ctx.fillStyle=dream?'rgba(110,80,140,.42)':'rgba(0,15,30,.6)';ctx.fillRect(0,0,W,H);
  const gl=ctx.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.min(W,H)*.45);gl.addColorStop(0,RCOL[p.r]+'88');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2+T,rr=Math.min(W,H)*.3+Math.sin(T*3+i)*8;ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(W/2+Math.cos(a)*rr,H*.42+Math.sin(a)*rr*.6,2,0,7);ctx.fill();}
  let L=Math.min(W,H)*.38;if(p.junk)L*=.8;if(p.shape==='long'||p.shape==='eel')L=W*.8;if(p.shape==='angler'||p.shape==='manbou'||p.sail||p.bill)L*=.8;
  ctx.save();ctx.translate(W/2,H*.4);if(p.r>=5)aura(ctx,L,p.r);ctx.scale(1+Math.sin(T*4)*.03,1+Math.sin(T*4)*.03);drawCreature(ctx,p,L,T,0,1);ctx.restore();
  if(p.junk){txt(p.price>=50?`💎 お宝！${p.n}`:`ハズレ…${p.n}`,H*.72,19,p.price>=50?'#ffd166':'#ccc');txt(`売値 ${p.price}G`,H*.72+26,15,'#ccc');}
  else{txt(`${p.n}を釣り上げた！`,H*.72,19,'#fff');txt(`${fmtSize(r.size)}  ${RAR[p.r]}`,H*.72+26,15,RCOL[p.r]);}
  if(r.isNew)txt('✨ NEW! 図鑑に登録 ✨',H*.12,16,'#ffd166');else if(r.record)txt('🏆 最高サイズ更新！',H*.12,16,'#ffd166');
  txt('タップで続ける',H*.95,11,'#bcd');
 }
 for(const sp of sparks){ctx.fillStyle=`rgba(255,255,255,${sp.l})`;ctx.beginPath();ctx.arc(sp.x,sp.y,2.5,0,7);ctx.fill();}
}
function updateFishing(dt){
 fs.t+=dt;if(fs.flash)fs.flash.t-=dt;
 if(s.rain&&s.area!=='dream'&&Math.random()<dt*6)ripples.push({x:rand(0,W),y:rand(H*.4,H),t:.4});
 for(const rp of ripples)rp.t+=dt*.8;ripples=ripples.filter(r=>r.t<1);
 for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt*1.2;}sparks=sparks.filter(p=>p.l>0);
 if(fs.st==='cast'&&fs.t>=.6){fs.st='wait';fs.t=0;ripples.push({x:fs.bx,y:fs.by,t:0});splash(fs.bx,fs.by,6);}
 else if(fs.st==='wait'){
  fs.nibT-=dt;if(fs.nib>0)fs.nib-=dt;
  if(fs.nibT<=0){fs.nibT=rand(.8,2);if(fs.t<fs.wait-.5){fs.nib=.25;ripples.push({x:fs.bx,y:fs.by,t:.3});}}
  if(fs.t>=fs.wait){fs.st='bite';fs.t=0;fs.sp=pickSpecies(s.area);fs.size=rollSize(fs.sp);fs.win=clamp(.95+s.rod*.08-fs.sp.r*.07,.5,1.4);
   ripples.push({x:fs.bx,y:fs.by,t:0});splash(fs.bx,fs.by,10);if(navigator.vibrate)navigator.vibrate(60);}
 }
 else if(fs.st==='bite'&&fs.t>fs.win){fs.st='idle';flash('逃げられた…💦','#ffb3b3');log('🐟 魚に逃げられた… 浮きが沈んだらすぐタップ！');}
 else if(fs.st==='reel'){fs.mk+=fs.md*fs.speed*dt;if(fs.mk>1){fs.mk=1;fs.md=-1;}if(fs.mk<0){fs.mk=0;fs.md=1;}}
 else if(fs.st==='result'&&fs.t>4){fs.st='idle';}
}
function flash(txt,col){fs.flash={txt,col,t:1.4};}
function splash(x,y,n){for(let i=0;i<n;i++)sparks.push({x,y,vx:rand(-60,60),vy:rand(-160,-60),l:1});}
function fishPool(area){return SPECIES.filter(p=>p.a===area&&!p.g&&(area==='dream'||s.rain||!p.rain));}
const JRW=[0,8,5,3,1.5,.6];
function pickSpecies(area){if(area==='dream'){const l=fishPool('dream');let tot=0;const w=l.map(p=>{const v=p.r>=6?.6:1;tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<l.length;i++){r-=w[i];if(r<=0)return l[i];}return l[0];}
 const rw=[0,50,28,13,5,1.6,.4];const fish=fishPool(area),junk=SPECIES.filter(p=>p.junk&&(s.rain||!p.rain)),list=fish.concat(junk);let tot=0;const jk=Math.max(.3,1.3-s.rod*.15);
 const rb=(curEvent()||{}).rare||1;const ws=list.map(p=>{const w=p.junk?JRW[p.r]*jk:rw[p.r]*(1+(s.rod-1)*.22*(p.r-1))*(s.rain?(p.rain?2.2:.4):1)*(p.r>=3?rb:1);tot+=w;return w;});let r=Math.random()*tot;
 for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i];}return list[0];}
function rollSize(p){const k=Math.pow(Math.random(),Math.max(.6,1.7-s.rod*.15));return Math.round((p.mn+(p.mx-p.mn)*k)*10)/10;}
function bucketCap(){return 8+(s.b.pier?6:0)+(s.b.bucket||0)*4;}
function newZone(){const w=fs.sp.junk?.4:clamp(.3+s.rod*.035-fs.sp.r*.035,.1,.45)*(fs.sp.a==='dream'?.8:1);fs.z0=rand(.05,.95-w);fs.z1=fs.z0+w;}
function fishTap(){
 switch(fs.st){
  case'idle':
   if(stormStage()==='storm'){flash('嵐で海に出られない…','#ffb3b3');return;}
   if(s.bucket.length>=bucketCap()){flash('いけすが満杯！','#ffb3b3');log('🪣 いけすが満杯です。水槽タブで展示するか売りましょう');return;}
   fs.st='cast';fs.t=0;fs.bx=rand(W*.45,W*.8);fs.by=rand(H*.5,H*.66);fs.wait=s.area==='dream'?rand(1,3)*DREAM_WAIT[s.rod]:rand(1.5,4.2)*WAIT_MULT[areaIdx(s.area)]*(s.b.pier?.7:1);fs.nib=0;fs.nibT=rand(.5,1.2);break;
  case'cast':case'wait':fs.st='idle';flash('早すぎた！','#ffb3b3');break;
  case'bite':fs.st='reel';fs.t=0;fs.hits=0;fs.need=fs.sp.junk?1:fs.sp.r>=6?4:fs.sp.r>=5?3:fs.sp.r>=4?2:1;fs.mk=0;fs.md=1;fs.speed=fs.sp.junk?.7:(.8+fs.sp.r*.22)*(fs.sp.a==='dream'?1.08:1);newZone();break;
  case'reel':
   if(fs.mk>=fs.z0&&fs.mk<=fs.z1){fs.hits++;splash(fs.bx,fs.by,6);if(navigator.vibrate)navigator.vibrate(30);
    if(fs.hits>=fs.need)catchFish();else{newZone();fs.speed*=1.12;}}
   else{fs.st='idle';flash('糸が切れた…','#ffb3b3');log(`💥 大物（${RAR[fs.sp.r]}）に逃げられた…`);}
   break;
  case'result':if(fs.t>.5)fs.st='idle';break;
 }
}
function registerCatch(sp,size){
 const f={u:s.uid++,s:sp.id,z:size};s.bucket.push(f);
 const d=s.dex[sp.id];const isNew=!d;let record=false;
 if(!d)s.dex[sp.id]={c:1,max:size};else{d.c++;if(size>d.max){d.max=size;record=true;}}
 if(isNew)addXp(5*sp.r);
 return{isNew,record};
}
function catchFish(){
 const sp=fs.sp,size=fs.size,r=registerCatch(sp,size);
 fs.st='result';fs.t=0;fs.res={sp,size,...r};splash(fs.bx,fs.by,16);
 if(sp.junk)log(sp.price>=50?`💎 お宝！${sp.n}を釣り上げた！（売値 ${sp.price}G）${r.isNew?' ✨NEW':''}`:`🥾 ハズレ…${sp.n}を釣り上げた${r.isNew?'（図鑑に登録）':''}`,sp.price>=50?'#ffd166':'#888');
 else log(`🎣 ${sp.n}（${fmtSize(size)}）を釣った！${r.isNew?' ✨NEW':''}${r.record?' 🏆記録更新':''}`,RCOL[sp.r]);
 save();if(tab==='fish')renderPanel();
}
function gather(){
 if(gatherCd>0)return;if(stormStage()==='storm'){log('🌪 嵐で浜辺に出られない…');return;}

 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e4d6e');g.addColorStop(1,'#04202f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const b of bubbles){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke();}
 const got=SPECIES.filter(p=>s.dex[p.id]);
 got.forEach((p,i)=>{const k=i/Math.max(1,got.length),x=((T*20*(1+(i%3)*.3)+k*W*1.7)%(W+160))-80,y=H*(.18+((i*0.37)%1)*.62)+Math.sin(T+i)*8;
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=.85;drawCreature(ctx,p,Math.min(60,pxOf(p,s.dex[p.id].max)),T,i,1);ctx.restore();});
 ctx.globalAlpha=1;
 const c=got.length,tot=SPECIES.length;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(W/2-110,H/2-30,220,60);
 ctx.fillStyle='#ffd166';ctx.font='bold 24px sans-serif';ctx.fillText(`📖 ${c} / ${tot} 種`,W/2,H/2-6);ctx.fillStyle='#cfe';ctx.font='12px sans-serif';ctx.fillText(`コンプリート率 ${Math.floor(c/tot*100)}%`,W/2,H/2+18);
}

// ===================== 経営 =====================
function fishAppeal(f){const p=SPM[f.s],k=clamp((f.z-p.mn)/(p.mx-p.mn),0,1);return p.ap*(.8+.5*k);}
function tankTheme(i){return AREAS[Math.min(i,3)];}
function tankAppeal(t,i){
 const th=tankTheme(i).id,cnt={},tiers=new Set();let base=0,match=0,star=0;
 for(const f of t.fish){const p=SPM[f.s];cnt[f.s]=(cnt[f.s]||0)+1;let v=fishAppeal(f)*[1,.6,.4,.3,.25][Math.min(4,cnt[f.s]-1)];
  if(p.a===th||p.a==='dream'){v*=1.25;match++;}else v*=.8;base+=v;tiers.add(p.r);if(p.r>=4)star++;}
 const n=t.fish.length,uniq=Object.keys(cnt).length,variety=uniq*.05,eco=Math.max(0,tiers.size-1)*.12,unity=n>=3&&match===n?.2:0,jam=n>=3&&star/n>.5?-.25:0,dirt=tankDirt(t);
 const mul=Math.max(.1,1+variety+eco+unity+jam);
 return{base,n,uniq,tiers:tiers.size,match,variety,eco,unity,jam,dirt,mul,total:base*mul*(1-.6*dirt)};}
function curEvent(){return s.event&&s.event.left>0?EVM[s.event.id]:null;}
function evApp(){const e=curEvent();return e?e.app:1;}
function evVis(){const e=curEvent();return e?e.vis:1;}
let APPEAL_BASE=0;
function recalc(){let a=0;s.tanks.forEach((t,i)=>a+=tankAppeal(t,i).total);APPEAL_BASE=a;APPEAL=a*evApp()*stormApp();}
function evReqOk(e){for(const k in e.req){const v=e.req[k];if(k==='_pier'&&!s.b.pier)return false;if(k==='_lighthouse'&&!s.b.lighthouse)return false;if(k==='_rating'&&s.rating<v)return false;if(k==='_land'&&s.land<v)return false;if(k[0]!=='_'&&(s.deco[k]||0)<v)return false;}return true;}
function evReqText(e){return Object.entries(e.req).map(([k,v])=>{const ok=k==='_pier'?s.b.pier:k==='_lighthouse'?s.b.lighthouse:k==='_rating'?s.rating>=v:k==='_land'?s.land>=v:(s.deco[k]||0)>=v;
 const n=k==='_pier'?'⚓桟橋':k==='_lighthouse'?'💡灯台':k==='_rating'?`⭐評価Lv${v}`:k==='_land'?`🏗️埋め立て${v}段階`:`${DECOM[k].ic}${DECOM[k].n}${v>1?'×'+v:''}`;return`${ok?'✅':'🔒'}${n}`;}).join(' ');}
function avgTM(night){let a=0;for(let i=0;i<24;i++){const h=i+.5;a+=night&&(h>=19||h<6)?.95:timeMult(h);}return a/24;}
function estDaily(e){const A=APPEAL_BASE*(e?e.app:1);if(A<=0)return 0;const tk=Math.round(4+Math.sqrt(A)*1.2+s.rating*1.5)+cafeLv()*4+shopIncome();
 const vr=(.1+Math.sqrt(A)/40)*(1+.12*cottLv())*(lhOn()?1.15:1)*(s.rain?.7:1)*(1+nigiwai()/100)*dirtVisMul()*(e?e.vis:1);
 let tm=0;for(let i=0;i<24;i++){const h=i+.5;tm+=e&&e.night&&(h>=19||h<6)?.95:(h>=9&&h<19?1:h>=6&&h<9?.5:h>=19&&h<22?.6:.15);}return vr*(tm/24)*DAY_SEC*tk;}
function eventCost(e){return Math.round((e.min+Math.max(0,estDaily(e)-estDaily(null))*e.days*1.2)/100)*100;}
function startEvent(id){const e=EVM[id];if(s.storm){log('🌪 嵐の影響で、今はイベントを開催できない…');return;}if(curEvent()||!evReqOk(e))return;const free=(s.freeEv||0)>0,c=free?0:eventCost(e);if(s.gold<c)return;
 if(free)s.freeEv--;s.gold-=c;s.event={id,left:e.days*DAY_SEC,cost:c,inc:0};recalc();log(`${e.ic} ${e.n} 開催！（${e.days}日間・${free?'🎫 無料券を使用':'開催費 -'+fmtG(c)}）`,'#ff9ad5');addXp(10*e.days);}
function updateEvent(dt){if(!s.event)return;if(s.event.left>0){s.event.left-=dt;if(s.event.left<=0){const e=EVM[s.event.id];
 log(`${e.ic} ${e.n} 終了！期間中の売上 ${fmtG(s.event.inc)}（開催費 ${fmtG(s.event.cost)}）`,'#ff9ad5');s.event=null;recalc();if(tab==='island')renderPanel();}}}
function nigiwai(){const st=s.storm&&s.storm.debris||{};let b=0;for(let i=0;i<s.land;i++)if(!st['l'+i])b+=10;const a=activeDeco();for(const id in a)b+=(DECOM[id]?DECOM[id].b:0)*a[id];return Math.round(b);}
function shopIncome(){let g=0;const a=activeDeco();for(const id in a)g+=(DECOM[id]&&DECOM[id].shop||0)*a[id];return g;}
function nightIncome(){let g=0;const a=activeDeco();for(const id in a)g+=(DECOM[id]&&DECOM[id].night||0)*a[id];return Math.round(g*(1+s.rating*.05));}
function dirtVisMul(){let w=0,d=0;for(const t of s.tanks){w+=t.fish.length;d+=tankDirt(t)*t.fish.length;}return w?1-.6*d/w:1;}
function decoCost(id){const d=DECOM[id];return Math.round(d.c*Math.pow(d.lvl?2:1.45,s.deco[id]||0));}
function ticket(){return Math.round(4+Math.sqrt(APPEAL)*1.2+s.rating*1.5);}

function visRate(){if(APPEAL<=0)return 0;return(.1+Math.sqrt(APPEAL)/40)*(1+.12*cottLv())*(lhOn()?1.15:1)*(s.rain?.7:1)*(1+nigiwai()/100)*dirtVisMul()*evVis()*stormVis();}
function addXp(x){s.xp+=x;let need;while(s.xp>=(need=xpNeed(s.rating))){s.xp-=need;s.rating++;log(`🎉 島の評価が Lv${s.rating} にアップ！新しい施設やエリアが解放されるかも`,'#ffd166');if(tab==='island')renderPanel();}}
function updateEconomy(dt){
 s.time+=dt/DAY_SEC;if(s.time>=1)endDay();
 const h=hourNow();
 visAcc+=visRate()*timeMult(h)*dt;
 while(visAcc>=1){visAcc--;const tk=ticket(),cafe=cafeLv()*4+shopIncome();s.gold+=tk+cafe;pend.g+=tk;pend.cafe+=cafe;pend.n++;s.visToday++;s.totalVis++;s.incToday+=tk+cafe;if(s.event)s.event.inc+=tk+cafe;s.totalInc+=tk+cafe;
  present.push({until:T+rand(18,30),ix:Math.floor(Math.random()*1000),kid:Math.random()<.3});addXp((lhOn()?1.5:1)*((curEvent()||{}).xp||1));}
 present=present.filter(v=>v.until>T);
 pend.t+=dt;if(pend.t>=7){if(pend.n>0)log(`🎫 入場料 +${pend.g}G（${pend.n}人）${pend.cafe?` ☕お店 +${pend.cafe}G`:''}`,'#4fd1c5');pend={g:0,n:0,cafe:0,t:0};}
}
function boardBoat(){if(!s.boat)return;s.boat=false;s.dream=true;s.dreamVisited=true;s.dreamTrips=(s.dreamTrips||0)+1;s.time=0;s.area='dream';fs.st='idle';
 log('⛵ 小舟に乗ると、深い霧に包まれた…気がつくと、その日の朝に戻っていた。','#ffc8ec');log('🌙 「夢で見た海」へ！今日1日だけ、伝説級の魚が釣れる','#ffc8ec');
 save();document.querySelector('[data-tab=fish]').click();}
function endDay(){
 const bonus=stormStage()==='storm'?0:cottLv()*30*s.rating+nightIncome();s.gold+=bonus;
 log(`🌙 Day ${s.day} 終了 — 来場 ${s.visToday}人 / 売上 ${fmtG(s.incToday+bonus)}${bonus?`（宿泊 +${bonus}G）`:''}`,'#c98bff');
 s.day++;s.time=0;s.visToday=0;s.incToday=0;
 if(s.boat){s.boat=false;log('🌫️ 砂浜の幻の小舟は、霧の中へ消えていった…','#d8c8ff');}
 if(s.dream){s.dream=false;if(s.area==='dream')s.area='beach';fs.st='idle';log('🌙 目が覚めると、いつもの島の朝だった…','#ffc8ec');}
 const was=s.rain;
 if(stormNextDay()){if(tab==='fish'||tab==='dex'||tab==='island')renderPanel();save();return;}
 s.rain=Math.random()<rainChance();
 if(s.rain&&!s.storm&&Math.random()<BOAT_CHANCE){s.boat=true;log('🌫️ 雨にけむる砂浜に、見慣れない小舟が流れ着いている…？（島タブ）','#d8c8ff');}
 if(s.rain)log(`☔ Day ${s.day} は雨…どの釣り場も「雨の日ステージ」に！雨の日限定の魚を狙おう`,'#7ab8ff');else if(was)log(`☀️ Day ${s.day} 雨が上がって晴れた！`,'#ffd166');
 if(tab==='fish'||tab==='dex')renderPanel();save();
}

 $('#sV').textContent=`${present.length}人`;
 {const e=curEvent(),st=stormStage();$('#sW').textContent=(st==='storm'?'🌪 大嵐':st==='warn'?'⛈ 大雨':s.rain?'☔ 雨':'☀️ 晴れ')+(e?' '+e.ic:'')+(st==='damage'?' 🔨':'');}
 $('#sR').textContent=`Lv${s.rating} ${'⭐'.repeat(Math.min(3,Math.ceil(s.rating/3)))}`;

function fishItem(f,btns,ti){const p=SPM[f.s],m=ti!=null&&(p.a===tankTheme(ti).id||p.a==='dream');return`<div class="item">${thumb(p)}<div class="info"><div style="color:${p.junk?'#aaa':RCOL[p.r]}">${p.n}</div><div class="sub">${p.junk?'🥾 ハズレ（展示不可）':`${fmtSize(f.z)} 魅力${Math.round(fishAppeal(f))}${m?' <span style="color:#7ee081">◎テーマ</span>':''} ${AREAM[p.a].ic}`}</div><div class="row" style="margin:3px 0 0">${btns}</div></div></div>`;}
function sellPrice(f){const p=SPM[f.s];return p.junk?p.price:Math.max(1,Math.round(fishAppeal(f)*2));}

   <span style="opacity:.8">💡 同じ種類は2匹目から効果ダウン。★1〜★6を混ぜて、テーマに合った生き物で揃えると高評価！</span></div></div>`;
  h+=`<div class="card"><h3>📊 経営状況</h3><div class="sub">総魅力度 <b style="color:var(--gold)">${Math.round(APPEAL)}</b>　入場料 <b style="color:var(--gold)">${ticket()}G</b>${s.b.cafe||shopIncome()?`（+お店${s.b.cafe*4+shopIncome()}G）`:''}<br>来場ペース 約${(visRate()*60).toFixed(1)}人/分（昼）　本日 ${s.visToday}人・${fmtG(s.incToday)}<br>${s.storm?`<b style="color:#ff9a9a">${stormStage()==='damage'?'🔨 嵐の被害で魅力度40%（島タブで復興）':stormStage()==='storm'?'🌪 大嵐で休業中':'⚠️ 明日、大嵐が来ます'}</b><br>`:''}島の賑わい +${nigiwai()}%${dirtVisMul()<.99?`　濁りによる客足 ${Math.round(dirtVisMul()*100)}%`:''}</div></div>`;

 }

 }

const STORM_CHANCE=.03;   // 全部そろえた後、1日ごとに嵐が来る確率
function endgameDone(){return s.areas.length>=AREAS.length&&s.land>=LAND.length&&(freeSlot()<0||DECOS.every(d=>(s.deco[d.id]||0)>=d.max));}
function stormStage(){return s.storm?s.storm.stage:null;}
function bOn(k){return s.b[k]&&!(s.storm&&s.storm.bld&&s.storm.bld[k]);}
function cafeLv(){return bOn('cafe')?s.b.cafe:0;}
function cottLv(){return bOn('cottage')?s.b.cottage:0;}
function lhOn(){return !!bOn('lighthouse');}
function brokenSet(){return new Set(s.storm&&s.storm.broken||[]);}
function activeDeco(){const bs=brokenSet(),c={};s.decoList.forEach((id,i)=>{if(id&&i<slotCount()&&!bs.has(i))c[id]=(c[id]||0)+(DECOM[id].lvl?(s.deco[id]||1):1);});return c;}
function stormApp(){return stormStage()==='damage'?.4:1;}
function stormVis(){const st=stormStage();return st==='storm'?0:st==='warn'?.7:1;}
function decoPaid(i){const id=s.decoList[i],d=DECOM[id];if(d.lvl){let t=0;for(let j=0;j<(s.deco[id]||1);j++)t+=d.c*Math.pow(2,j);return t;}let n=0;for(let k=0;k<i;k++)if(s.decoList[k]===id)n++;return DECOM[id].c*Math.pow(1.45,n);}
function repairList(){if(stormStage()!=='damage')return[];const st=s.storm,L=[];
 if(st.debris.main)L.push({k:'main',ic:'🧹',n:'本島の片付け（倒木・がれき撤去）',c:100000});
 for(let i=0;i<s.land;i++)if(st.debris['l'+i])L.push({k:'l'+i,ic:'🧹',n:`${LAND[i].n}の片付け`,c:Math.round(LAND[i].c*.3*(1+(landLv(i)-1)*.5))});
 const sum=(arr,n)=>arr.slice(0,n).reduce((a,x)=>a+x.c,0);
 if(st.bld.cafe)L.push({k:'cafe',ic:'☕',n:'カフェの再建',c:Math.round(sum(CAFE,s.b.cafe)*.3)});
 if(st.bld.cottage)L.push({k:'cottage',ic:'🛖',n:`コテージ${s.b.cottage}棟の再建`,c:Math.round(sum(COTT,s.b.cottage)*.3)});
 if(st.bld.lighthouse)L.push({k:'lighthouse',ic:'💡',n:'灯台の再建',c:450});
 st.broken.forEach(i=>{const d=DECOM[s.decoList[i]];L.push({k:'d'+i,ic:d.ic,n:`${d.n}の再建`,c:Math.round(decoPaid(i)*.3)});});
 return L;}
function stormDamage(){
 const idx=s.decoList.map((_,i)=>i).filter(i=>i<slotCount()&&s.decoList[i]);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
 const broken=idx.slice(0,Math.max(1,Math.round(idx.length*rand(.3,.5)))).sort((a,b)=>a-b);
 const bld={};if(s.b.cafe&&Math.random()<.5)bld.cafe=1;if(s.b.cottage&&Math.random()<.6)bld.cottage=1;if(s.b.lighthouse&&Math.random()<.4)bld.lighthouse=1;
 const debris={main:1};for(let i=0;i<s.land;i++)debris['l'+i]=1;
 s.storm={stage:'damage',broken,bld,debris};
 s.tanks.forEach(t=>{ensureDirt(t);for(let i=0;i<t.dirt.length;i++)t.dirt[i]=Math.min(100,t.dirt[i]+40);});
 const tot=repairList().reduce((a,x)=>a+x.c,0);
 log(`🌪 嵐が去った…装飾${broken.length}か所と${Object.keys(bld).length}つの建物が崩壊し、島は荒れ果ててしまった`,'#ff8a8a');
 log(`🔨 復興に必要な費用：約${fmtG(tot)}。すべて復興するまで魅力度は40%に…（島タブ「🌪 復興」）`,'#ff8a8a');}
function fixItem(k){const it=repairList().find(x=>x.k===k);if(!it||s.gold<it.c)return false;s.gold-=it.c;const st=s.storm;
 if(k==='main'||/^l\d+$/.test(k))delete st.debris[k];else if(k[0]==='d')st.broken=st.broken.filter(i=>i!==+k.slice(1));else delete st.bld[k];
 log(`${it.ic} ${it.n}が完了（-${fmtG(it.c)}）`,'#ffd166');
 if(!repairList().length){s.storm=null;s.freeEv=(s.freeEv||0)+1;log('🎉 復興完了！リゾートが元の輝きを取り戻した！','#7ef0ff');log('🎫 お祝いに「イベント無料券」を1枚もらった！好きなイベントを無料で開催できます（島タブ→🎉イベント）','#ff9ad5');addXp(100);}
 return true;}
function stormNextDay(){ // endDay から呼ぶ（日付が進んだ後）
 const st=stormStage();
 if(st==='warn'){s.storm.stage='storm';s.rain=true;log('🌪 大型の嵐が上陸！本日リゾートは臨時休業です。釣りにも出られない…','#ff8a8a');return true;}
 if(st==='storm'){stormDamage();s.rain=false;return true;}
 if(!s.storm&&endgameDone()&&!curEvent()&&!s.dream&&Math.random()<STORM_CHANCE){s.storm={stage:'warn'};s.rain=true;
  log('⚠️ 気象警報：今日は大雨。明日、大型の嵐🌪が島を直撃する見込みです…','#ffb36b');return true;}
 return false;}

  case'tanks':while(s.tanks.length<4)s.tanks.push({cap:3,fish:[]});s.tanks.forEach(t=>{t.cap=TANK_MAX;ensureDirt(t);});break;
  case'land':if(s.land<LAND.length){s.landLv[s.land]=1;addLandSlots(s.land,1);s.land++;}break;
  case'landMax':for(let i=0;i<s.land;i++)while(landLv(i)<LAND_LV_MAX){const lv=landLv(i);s.landLv[i]=lv+1;addLandSlots(i,lv+1);}break;
  case'decoAll':for(const d of DECOS)while((s.deco[d.id]||0)<d.max&&placeDeco(d.id));m=`✅ 区画 ${decoUsed()}/${slotCount()} まで配置`;break;
  case'evEnd':if(s.event){s.event.left=0.001;}break;
  case'stormWarn':s.storm={stage:'warn'};s.rain=true;m='✅ 今日は大雨、明日が大嵐です';break;
  case'stormNow':s.storm={stage:'storm'};s.rain=true;m='✅ 大嵐になりました（休業中）';break;
  case'stormDmg':s.storm={stage:'storm'};stormDamage();s.rain=false;m=`✅ 被害が発生（復興${repairList().length}件）`;break;
  case'stormFix':if(s.storm&&stormStage()==='damage'){for(const it of repairList()){s.gold+=it.c;fixItem(it.k);}}else s.storm=null;m='✅ 復興完了にしました';break;
  case'ticket':s.freeEv=(s.freeEv||0)+1;m=`✅ 無料券 ${s.freeEv}枚`;break;
  case'dirty':s.tanks.forEach(t=>{ensureDirt(t);t.dirt.fill(90);});break;
  case'cleanAll':s.tanks.forEach(t=>{ensureDirt(t);t.dirt.fill(0);});break;
 }
 afterChange();openGM(m);
}
$('#mbox').addEventListener('click',e=>{
 if(e.target.closest('[data-yes]')){const cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();return;}
 if(e.target.closest('[data-gmok]')){checkCode();return;}
 const g=e.target.closest('[data-gma]');if(g)gmAct(g.dataset.gma);
});

// ===================== セーブ/ロード =====================
function save(){s.last=Date.now();for(const t of s.tanks)if(t.dirt)t.dirt=t.dirt.map(v=>Math.round(v*10)/10);try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1){const n=newState();d.b=Object.assign(n.b,d.b||{});if(!d.landLv)d.landLv=[];if(d.decoList)for(const dd of DECOS)if(dd.lvl){let f=-1;d.decoList.forEach((x,i)=>{if(x===dd.id){if(f<0)f=i;else d.decoList[i]=null;}});if(d.deco&&d.deco[dd.id])d.deco[dd.id]=Math.min(dd.max,d.deco[dd.id]);}(d.tanks||[]).forEach(ensureDirt);return Object.assign(n,d);}}catch(e){}return null;}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

// ===================== ループ =====================
let lastT=performance.now();
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;T+=dt;
 updateEconomy(dt);updateDirt(dt);updateEvent(dt);if(gatherCd>0)gatherCd-=dt;
 recalcT-=dt;if(recalcT<=0){recalcT=1;recalc();}
 if(thunder>0)thunder-=dt;else if(s.rain&&Math.random()<dt*.04){thunder=.35;if(tab==='fish')log('⚡ ゴロゴロ…');}
 if(stormStage()==='storm'&&thunder<=0&&Math.random()<dt*.35)thunder=.3;
 if(tab==='tank')updateTank(dt);
 if(tab==='fish'||fs.st!=='idle')updateFishing(dt);
 if(tab==='dex'){for(const b of bubbles){b.y-=b.v*dt;if(b.y<-10){b.y=H+10;b.x=rand(0,W);}}}
 ctx.clearRect(0,0,W,H);
 if(tab==='tank')drawTank();else if(tab==='fish')drawFishing();else if(tab==='island')drawIsland();else drawDexBg();
 topT-=dt;if(topT<=0){topT=.25;updateTop();}
 saveT+=dt;if(saveT>10){saveT=0;save();}
 requestAnimationFrame(loop);
}
// 起動
resize();recalc();
(function offline(){const el=Math.min(7200,(Date.now()-(s.last||Date.now()))/1000);if(el>60){updateDirt(el*.5);recalc();}
 if(el>60&&APPEAL>0){const g=Math.round(visRate()*.6*ticket()*el*.4);s.gold+=g;log(`🌙 留守の間に観光客が来ていた！ +${fmtG(g)}`,'#ffd166');}})();
if(!s.totalVis&&!Object.keys(s.dex).length)setTimeout(()=>log('🌴 ようこそ無人島へ！まずは「🎣釣り場」で魚を釣ってみよう'),300);
(function migrateHotel(){const n=s.decoList.filter(x=>x==='hotel').length,own=s.deco.hotel||0;if(own>n){let short=own-n;while(short>0){const i=freeSlot();if(i<0)break;s.decoList[i]='hotel';short--;}
 if(short>0){s.deco.hotel=own-short;const g=Math.round(400000*short);s.gold+=g;log(`🏨 ホテルの仕様変更のため、置けなかった${short}棟分 ${fmtG(g)} を返金しました`,'#ffd166');}save();}})();
renderPanel();updateTop();requestAnimationFrame(loop);
</script>
