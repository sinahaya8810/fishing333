<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏝️ Aqua Island 〜無人島アクアリウム〜</title>
<style>
:root{--bg:#062a3e;--panel:#0b3a52;--card:#11506e;--acc:#4fd1c5;--gold:#ffd166;--txt:#e8f7ff;--sub:#9cc7da}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:#073246 linear-gradient(#04202f,#073246) fixed;color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
#top{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px 4px;position:sticky;top:0;background:rgba(4,32,47,.96);z-index:5}
.stat{background:var(--panel);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;line-height:1.3;color:var(--sub)}
.stat b{display:block;font-size:14px;color:var(--gold);white-space:nowrap}
#dayBar{grid-column:1/-1;height:4px;background:#0b3a52;border-radius:2px;overflow:hidden}
#dayFill{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff8fab,#7b6cff)}
#tabs{display:flex;gap:4px;padding:4px 8px 0}
.tab{flex:1;padding:9px 2px;border:none;border-radius:10px 10px 0 0;background:var(--panel);color:var(--sub);font-size:12.5px;font-weight:bold;font-family:inherit}
.tab.on{background:var(--card);color:#fff}
#stage{position:relative;margin:0 8px;border-top:3px solid var(--card)}
canvas#cv{display:block;width:100%;height:min(50vh,420px);border-radius:0 0 12px 12px;background:#000;touch-action:manipulation}
#log{position:absolute;left:6px;top:6px;right:6px;pointer-events:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.msg{background:rgba(0,18,30,.72);padding:3px 9px;border-radius:8px;font-size:12px;transition:opacity .8s;max-width:92%;border-left:3px solid var(--acc)}
#panel{padding:8px 8px 40px;flex:1}
.btn{border:none;border-radius:10px;padding:10px 12px;background:var(--acc);color:#04202f;font-weight:bold;font-size:14px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn:disabled{background:#2e5568;color:#7fa2b2}
.btn.sm{padding:6px 9px;font-size:12px}
.btn.gold{background:var(--gold)}
.btn.red{background:#ff7b8a}
.btn.ghost{background:var(--card);color:var(--txt)}
.btn.on{outline:2px solid #fff}
.btn.big{flex:1;padding:14px;font-size:16px}
.btn.gold:disabled,.btn.red:disabled,.btn.ghost:disabled{background:#2e5568;color:#7fa2b2}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.card{background:var(--panel);border-radius:12px;padding:10px;margin-bottom:8px}
h3{margin:2px 0 8px;font-size:14.5px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.item{background:var(--card);border-radius:10px;padding:6px;display:flex;gap:6px;align-items:center;font-size:12px}
.item .info{flex:1;min-width:0}
.item .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:48px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.th img{max-width:48px;max-height:30px}
.th .em{font-size:24px;line-height:1}
.unk{filter:brightness(0) opacity(.45)}
.up{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:6px}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .info{flex:1;font-size:12px}
.up .info b{font-size:13.5px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.dc{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;border:2px solid transparent}
.dc .th{margin:0 auto 3px;width:64px;height:40px}
.dc .th img{max-width:64px;max-height:40px}
.dc .th .em{font-size:30px}
.prog{height:8px;background:#062a3e;border-radius:4px;overflow:hidden;margin-top:4px}
.prog div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
.mbox{background:var(--panel);border-radius:16px;padding:16px;width:min(90vw,360px);text-align:center}
.mbox .th{width:150px;height:90px;margin:4px auto 8px}
.mbox .th img{max-width:150px;max-height:90px}
.mbox .th .em{font-size:64px}
.mbox table{width:100%;font-size:13px;margin:8px 0;text-align:left}
.mbox{max-height:88vh;overflow-y:auto}
.gmin{width:100%;padding:9px;border-radius:8px;border:1px solid #2e6a88;background:#062a3e;color:#fff;font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
.cafeHead{background:linear-gradient(135deg,#3a2216,#7a4a2a);border-radius:14px;padding:12px;text-align:center;color:#ffe8c0;margin-bottom:8px;border:1px solid #c89a5a}
.cafeTitle{font-family:"Brush Script MT","Snell Roundhand",Georgia,serif;font-style:italic;font-size:28px;color:#fff3dc;letter-spacing:1px}
.cafeOpt{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#f6ead6,#e4cca8);color:#3a2216;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #c89a5a;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cafeOpt:active{transform:scale(.98)}.cafeOpt .ci{font-size:30px;width:44px;text-align:center}.cafeOpt b{font-size:15px}.sub2{font-size:12px;opacity:.8;line-height:1.5}
.cafeMenu{background:linear-gradient(180deg,#fbf3e4,#efdcbc)!important;color:#3a2216}.cafeMenu .mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed #c8a878}
.gmbox{text-align:left}.gms{font-weight:bold;font-size:13px;margin:10px 0 5px;color:var(--gold)}
[data-gm],[data-tab=dex]{-webkit-touch-callout:none;touch-action:none}
.mbox td:first-child{color:var(--sub);width:40%}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat">所持金<b id="sG">0G</b></div>
    <div class="stat"><span id="sW">日付</span><b id="sD">Day 1</b></div>
    <div class="stat">観光客<b id="sV">0人</b></div>
    <div class="stat">島の評価<b id="sR">Lv1</b></div>
    <div id="dayBar"><div id="dayFill"></div></div>
  </div>
  <div id="tabs">
    <button class="tab on" data-tab="tank">🐠 水槽</button>
    <button class="tab" data-tab="fish">🎣 釣り場</button>
    <button class="tab" data-tab="island">🏝️ 島・設備</button>
    <button class="tab" data-tab="dex">📖 図鑑</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="log"></div></div>
  <div id="panel"></div>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
// ===================== データ =====================
const AREAS=[
 {id:'beach',n:'浅瀬',ic:'🏖️',cost:0,req:1,w:['#62d4e8','#0c6f93']},
 {id:'reef',n:'サンゴ礁',ic:'🐠',cost:600,req:2,w:['#48e0cf','#0b5f86']},
 {id:'open',n:'沖合',ic:'🌊',cost:2500,req:3,w:['#2d8fd0','#0a3768']},
 {id:'deep',n:'深海',ic:'🌑',cost:9000,req:5,w:['#1b4a7c','#01060f']},
];
const AREAM={};AREAS.forEach(a=>AREAM[a.id]=a);
const DREAM={id:'dream',n:'夢で見た海',ic:'🌙',w:['#e8d8ff','#f6d6ec']};AREAM.dream=DREAM;
const DREAM_WAIT=[0,5.6,4.5,3.5,2.7,1.85,1.2,1.05,.95,.85,.75];  // 竿Lvごとの「夢で見た海」の待ち時間倍率
const BOAT_CHANCE=.06;                      // 雨の日に幻の小舟が現れる確率
const RAR=['','★','★★','★★★','★★★★','★★★★★','🌈幻★6'];
const RCOL=['','#cfd8dc','#7ee081','#5ab0ff','#c98bff','#ffcf40','#ff6bd6'];
const WAIT_MULT=[1,1.35,1.75,2.2];      // エリアが深いほど魚がかかるまで遅い
const RAIN_CHANCE=[0,.1,.2,.3];        // 解放エリア数に応じた雨の確率
const TANK_BASE=[80,300,900,2500];     // 解放エリア数に応じた水槽拡張の基本価格
const S=(id,n,a,r,ap,mn,mx,o,d)=>Object.assign({id,n,a,r,ap,mn,mx,d},o);
const SPECIES=[
// ---- 浅瀬 ----
S('iwashi','マイワシ','beach',1,3,10,22,{c1:'#dfeaf2',c2:'#2f5f8f',h:.3,pat:'dots',tail:'fork'},'体の横に黒い点が並ぶ小魚。大きな群れをつくって外敵から身を守る。'),
S('kisu','シロギス','beach',1,5,15,30,{c1:'#f4efe4',c2:'#c9b98f',h:.24,pat:'none',tail:'square',dor:'double'},'砂地にすむ上品な白身魚。その美しさから「海の女王」とも呼ばれる。'),
S('aji','マアジ','beach',1,4,15,40,{c1:'#e3ead2',c2:'#5f7f55',h:.33,pat:'line',tail:'fork',dor:'double'},'体の側面に「ぜいご」という硬いウロコの列をもつ。食卓でもおなじみ。'),
S('haze','マハゼ','beach',1,4,8,20,{c1:'#d6c8a6',c2:'#7a6646',h:.26,pat:'spots'},'河口や浅い砂地にすむ。秋のハゼ釣りは昔からの風物詩。'),
S('suzume','スズメダイ','beach',1,4,5,12,{c1:'#56688a',c2:'#28324a',h:.5,pat:'none',tail:'fork',dor:'long'},'岩場で群れる小さな魚。地味な色だが、よく見ると青く光る。'),
S('mejina','メジナ','beach',1,5,15,40,{c1:'#46596a',c2:'#1d2a35',h:.45,pat:'scales',tail:'square'},'磯釣りの人気ターゲット。「グレ」とも呼ばれ、引きが強い。'),
S('kawahagi','カワハギ','beach',2,9,12,30,{c1:'#e0cfa2',c2:'#8b6a3a',h:.62,pat:'spots'},'おちょぼ口でエサだけをかすめ取る、釣り人泣かせの「エサ取り名人」。'),
S('harisen','ハリセンボン','beach',2,13,15,35,{shape:'puffer',c1:'#e6d49a',c2:'#5a4a2a'},'驚くと水を吸って体をふくらませ、トゲを立てて身を守る。'),
S('kasago','カサゴ','beach',2,10,10,30,{c1:'#c0392b',c2:'#6e1b14',h:.42,pat:'spots',bigEye:1,tail:'round',dor:'spiny'},'岩のすき間でじっと獲物を待つ。ゴツゴツした見た目だが味は絶品。'),
S('mebaru','メバル','beach',2,9,15,30,{c1:'#8a6a55',c2:'#4a3528',h:.42,pat:'vstripe',bigEye:1,tail:'square',dor:'spiny'},'大きな目が名前の由来（目張る）。夜になると活発に泳ぐ。'),
S('karei','マコガレイ','beach',2,11,15,45,{c1:'#b9a27e',c2:'#6b5638',h:.62,pat:'spots',tail:'round',dor:'long'},'平たい体で砂にまぎれる。成長すると両目が体の右側に寄る。'),
S('ishidai','イシダイ','beach',2,14,20,60,{c1:'#e8e2d0',c2:'#222222',h:.55,pat:'vstripe',dor:'spiny'},'白黒のしま模様が目印。硬い歯でサザエの殻もかみ砕く。'),
S('madai','マダイ','beach',3,28,30,90,{c1:'#ff7a8a',c2:'#5ab0ff',h:.5,pat:'bluedots',tail:'fork',dor:'spiny'},'「魚の王様」と呼ばれるおめでたい魚。体には青い点が散らばる。'),
S('hirame','ヒラメ','beach',3,26,30,90,{c1:'#a8916a',c2:'#5b4628',h:.6,pat:'spots',tail:'round',dor:'long'},'カレイとは逆に、目が体の左側にある。砂に潜って獲物を狙う。'),
S('hata','キジハタ','beach',3,24,20,50,{c1:'#c96f3a',c2:'#ff9a5a',h:.4,pat:'spots',tail:'round',dor:'spiny'},'オレンジの斑点が美しい高級魚。関西では「アコウ」と呼ばれる。'),
S('tatsu','タツノオトシゴ','beach',3,30,5,15,{shape:'seahorse',c1:'#f2b84b',c2:'#c47a1a'},'馬のような顔をした魚の仲間。オスがお腹の袋で赤ちゃんを育てる。'),
S('ei','アカエイ','beach',3,32,40,150,{shape:'ray',c1:'#a0705a',c2:'#5e3c2c'},'ひらひらと海底を飛ぶように泳ぐ。尾には毒のトゲがある。'),
S('kue','クエ','beach',4,60,60,130,{c1:'#6b5a4a',c2:'#3a2e24',h:.42,pat:'saddle',tail:'round',dor:'spiny'},'岩礁の主ともいえる大型のハタ。幻の高級魚として知られる。'),
// ---- 浜辺の採取 ----
S('kani','イソガニ','beach',1,4,3,8,{shape:'crab',c1:'#c0503a',c2:'#7a2a1a',g:1,bottom:1},'磯の岩のすき間にすむ小さなカニ。横歩きでちょこちょこ動き回る。'),
S('hitode','イトマキヒトデ','beach',1,3,5,15,{shape:'star',c1:'#ff8a3a',c2:'#3a5ad8',g:1,bottom:1},'糸巻きのような形のヒトデ。腕が切れても再生する力をもつ。'),
S('namako','マナマコ','beach',1,4,10,30,{shape:'slug',c1:'#6a5a3a',c2:'#3d3220',g:1,bottom:1},'海底の砂を食べてきれいにする「海の掃除屋」。'),
S('yado','ヤドカリ','beach',2,7,2,10,{shape:'hermit',c1:'#e8cba0',c2:'#d0402a',g:1,bottom:1},'貝殻をお家にして暮らす。成長すると大きな貝殻へお引っ越し。'),
S('kuruma','クルマエビ','beach',2,10,10,25,{shape:'shrimp',c1:'#d8c0a0',c2:'#4a3a5a',band:1,g:1,bottom:1},'体を丸めると縞模様が車輪のように見えることが名前の由来。'),
S('uni','ムラサキウニ','beach',2,8,4,8,{shape:'urchin',c1:'#4b2a5a',c2:'#2a1033',g:1,bottom:1},'トゲをゆっくり動かして歩く。海藻を食べる磯の住人。'),
S('ebi','イセエビ','beach',3,22,15,35,{shape:'shrimp',c1:'#a83a2a',c2:'#f0d0a0',lob:1,g:1,bottom:1},'長いヒゲが立派な高級エビ。夜になると岩陰から出てくる。'),
S('sakura','サクラガイ','beach',3,18,1,3,{shape:'bivalve',c1:'#ffc0cb',c2:'#ff8fab',g:1,bottom:1,kind:'sakura',sz:.55},'桜の花びらのような薄ピンクの貝殻。浜辺で見つかると幸運のしるし。'),
S('shinju','アコヤガイ','beach',4,50,5,10,{shape:'bivalve',c1:'#e8e0d0',c2:'#b8a890',g:1,bottom:1,pearl:1,kind:'akoya',sz:.95},'貝の中で真珠を育てる。ごくまれに大粒の真珠を抱いている。'),
// ---- サンゴ礁 ----
S('deba','デバスズメダイ','reef',1,5,4,8,{c1:'#7fe3e0',c2:'#3fb8b5',h:.5,pat:'none',tail:'fork'},'エメラルド色の小魚。危険を感じるとサンゴの枝の間に逃げ込む。'),
S('sora','ソラスズメダイ','reef',1,6,4,8,{c1:'#2f6bff',c2:'#1a3fb0',h:.48,pat:'none',tc:'#ffd23f',tail:'fork'},'空のような青い体と黄色い尾びれ。サンゴ礁の彩り役。'),
S('kumanomi','カクレクマノミ','reef',2,15,5,11,{c1:'#ff8a2b',c2:'#ffffff',h:.46,pat:'band'},'イソギンチャクと共生するオレンジの人気者。水族館の大スター。'),
S('chou','チョウチョウウオ','reef',2,14,10,22,{c1:'#ffe14d',c2:'#2b2b2b',h:.82,pat:'eyebar',tail:'square'},'尾の近くの黒い点は「ニセの目」。敵に頭の位置をごまかす作戦。'),
S('hanadai','キンギョハナダイ','reef',2,12,6,12,{c1:'#ff8c42',c2:'#c95a20',h:.42,pat:'none',tc:'#ff4f9a',tail:'lunate'},'オレンジ色の群れでサンゴ礁を彩る。成長するとメスがオスに変わる。'),
S('tsuno','ツノダシ','reef',2,16,10,20,{c1:'#ffe14d',c2:'#111111',h:.85,pat:'vstripe',dor:'tall'},'長く伸びた背びれがチャームポイント。白黒黄色のおしゃれな魚。'),
S('hako','ハコフグ','reef',2,14,8,20,{c1:'#ffd23f',c2:'#333333',h:.7,pat:'dots'},'体が硬い骨の箱で覆われている。小さなヒレで一生懸命泳ぐ。'),
S('iro','イロブダイ','reef',2,15,30,60,{c1:'#3ad0a0',c2:'#ff6fa8',h:.42,pat:'scales',tail:'lunate'},'夜は自分で作った粘液の膜に包まって眠る。'),
S('nanyo','ナンヨウハギ','reef',3,24,12,30,{c1:'#2457e6',c2:'#ffd23f',h:.55,pat:'tang',tail:'lunate'},'鮮やかな青い体に黄色い尾びれ。尾の付け根には鋭いトゲがある。'),
S('tako','マダコ','reef',3,28,30,80,{shape:'octo',c1:'#c8584a',c2:'#f0c0b0',bottom:1},'とても頭が良く、ビンのフタを開けることも。体の色を自在に変える。'),
S('nishiki','ニシキヤッコ','reef',3,28,15,25,{c1:'#ffcf33',c2:'#2f5bd8',h:.65,pat:'vstripe'},'黄色と青の縞が錦のように美しいキンチャクダイの仲間。'),
S('mino','ミノカサゴ','reef',3,34,15,35,{c1:'#ffb3a3',c2:'#8a1a1a',h:.5,pat:'vstripe',wing:1},'大きなヒレを広げて優雅に泳ぐ。トゲには毒がある。'),
S('mongara','モンガラカワハギ','reef',3,30,20,40,{c1:'#20202e',c2:'#ffd23f',h:.58,pat:'ws',tc:'#ffd23f',tail:'lunate',dor:'square'},'お腹の白い水玉模様が派手な、サンゴ礁のおしゃれさん。'),
S('utsubo','ハナヒゲウツボ','reef',3,30,60,120,{shape:'eel',c1:'#2a5bd8',c2:'#ffd23f'},'青と黄色の鮮やかなウツボ。成長につれて黒→青→黄と色が変わる。'),
S('kame','アオウミガメ','reef',4,65,60,120,{shape:'turtle',c1:'#7a8a5a',c2:'#5a6a3a'},'海藻を食べるおだやかなウミガメ。何十年も生きる長寿の生き物。'),
S('napoleon','メガネモチノウオ','reef',4,70,60,200,{c1:'#3aa58a',c2:'#1f6a5a',h:.5,pat:'wave'},'通称ナポレオンフィッシュ。おでこのコブが帽子のように見える。'),
S('manta','マンタ','reef',5,190,300,700,{shape:'ray',c1:'#2a3442',c2:'#e8eef4'},'翼を広げると7mにもなる巨大なエイ。ゆったり舞う姿は圧巻。'),
// ---- 沖合 ----
S('saba','マサバ','open',1,6,25,50,{c1:'#b8d0dc',c2:'#2a5070',h:.28,pat:'wave',tail:'fork',dor:'double'},'背中のくねくね模様が特徴。大きな群れで回遊する。'),
S('sanma','サンマ','open',1,5,25,40,{c1:'#d0dce8',c2:'#2a3e6a',h:.17,pat:'back',tail:'fork'},'刀のように細長い秋の味覚。漢字では「秋刀魚」と書く。'),

function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function lerpCol(a,b,f){const A=hex2rgb(a),B=hex2rgb(b);return rgb([A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f]);}
function shade(h,f){if(h[0]!=='#')return h;const c=hex2rgb(h);return rgb(c.map(v=>f<0?v*(1+f):v+(255-v)*f));}
function fmtSize(z){return z>=100?(z/100).toFixed(2)+'m':z.toFixed(1)+'cm';}
function fmtG(g){return Math.floor(g).toLocaleString()+'G';}
function hourNow(){return(6+s.time*24)%24;}
function night(h){if(h<5||h>=20.5)return 1;if(h<7)return(7-h)/2;if(h>18.5)return(h-18.5)/2;return 0;}
function timeMult(h){const ev=curEvent();if(ev&&ev.night&&(h>=19||h<6))return .95;if(h>=9&&h<19)return 1;if(h>=6&&h<9)return .5;if(h>=19&&h<22)return .6;return .15;}
function xpNeed(lv){return Math.floor(20*Math.pow(lv,1.7));}
function pxOf(sp,z){let L=clamp(14+11*Math.log2(z/4),18,86);const m={squid:1.3,crab:.9,star:.85,hermit:.85,shrimp:1,octo:1,turtle:1.05,puffer:.9,junk:.8,long:1.7,eel:1.6,jelly:.85,menda:.85,seahorse:.9,urchin:.75,shell:.75,clione:.8};return L*(sp.sz||m[sp.shape]||1);}
function rainChance(){return RAIN_CHANCE[Math.min(3,s.areas.length-1)];}
function tankCost(cap){return Math.round(TANK_BASE[Math.min(3,s.areas.length-1)]*Math.pow(1.55,Math.min(cap,10)-3)*Math.pow(1.3,Math.max(0,cap-10)));}
function bucketCost(){return Math.round(300*Math.pow(1.7,s.b.bucket||0));}
function areaIdx(id){return AREAS.findIndex(a=>a.id===id);}

function log(t,col){const el=document.createElement('div');el.className='msg';el.textContent=t;if(col)el.style.borderLeftColor=col;
 const lg=$('#log');lg.appendChild(el);while(lg.children.length>5)lg.removeChild(lg.firstChild);
 setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.remove(),900);},4500);}

const cv=$('#cv'),ctx=cv.getContext('2d');let W=300,H=300;
function resize(){const DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);

// ===================== 生き物の描画 =====================
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function drawCreature(c,sp,L,t,ph,dir){
 c.save();if(sp.a==='dream'){c.globalAlpha*=.85;c.shadowColor='rgba(255,210,245,.9)';c.shadowBlur=Math.min(18,L*.25);}
 if(sp.e){c.scale(-dir,1);c.rotate(Math.sin(t*2+ph)*.07);c.font=`${L}px ${EMOJI_FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(sp.e,0,0);c.restore();return;}
 c.scale(dir,1);
 switch(sp.shape){
  case'jelly':drawJelly(c,sp,L,t,ph);break;
  case'manbou':drawManbou(c,sp,L,t,ph);break;
  case'menda':drawMenda(c,sp,L,t,ph);break;
  case'angler':drawAngler(c,sp,L,t,ph);break;
  case'long':case'eel':drawLong(c,sp,L,t,ph);break;
  case'skeleton':drawSkeleton(c,sp,L,t,ph);break;
  case'pig':drawFishBody(c,sp,L,t,ph);drawPigFace(c,sp,L,t,ph);break;
  case'reisho':drawFishBody(c,sp,L,t,ph);drawReishoFace(c,sp,L,t,ph);break;
  case'seahorse':drawSeahorse(c,sp,L,t,ph);break;
  case'ray':drawRay(c,sp,L,t,ph);break;
  case'urchin':drawUrchin(c,sp,L,t,ph);break;
  case'slug':drawSlug(c,sp,L,t,ph);break;
  case'shell':drawShell(c,sp,L,t,ph);break;
  case'bivalve':drawBivalve(c,sp,L,t,ph);break;case'scallop':drawScallop(c,sp,L,t,ph);break;case'nautilus':drawNautilus(c,sp,L,t,ph);break;case'snail':drawSnail(c,sp,L,t,ph);break;
  case'isopod':drawIsopod(c,sp,L,t,ph);break;
  case'clione':drawClione(c,sp,L,t,ph);break;
  case'junk':drawJunk(c,sp,L,t,ph);break;
  case'puffer':drawPuffer(c,sp,L,t,ph);break;case'crab':drawCrab(c,sp,L,t,ph);break;case'star':drawStar(c,sp,L,t,ph);break;case'hermit':drawHermit(c,sp,L,t,ph);break;
  case'shrimp':drawShrimp(c,sp,L,t,ph);break;case'octo':drawOcto(c,sp,L,t,ph);break;case'turtle':drawTurtle(c,sp,L,t,ph);break;case'squid':drawSquid(c,sp,L,t,ph);break;
  default:drawFishBody(c,sp,L,t,ph);
 }
 c.restore();
}
function drawEye(c,x,y,r){c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(x+r*.15,y,r*.6,0,7);c.fill();c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(x+r*.35,y-r*.3,r*.22,0,7);c.fill();}
function drawFishBody(c,sp,L,t,ph){
 const h=L*(sp.h||.4),w=Math.sin(t*7+ph)*(sp.shark?.22:.35);
 const fx=(sp.pat==='rainbow'||sp.pat==='arcbow'||sp.pat==='irid'||sp.pat==='aurora')?`hsla(${(t*60+ph*40)%360},90%,72%,${sp.pat==='rainbow'?1:.8})`:sp.pat==='gold'?'#e0a800':(sp.pat==='sakura'||sp.pat==='petal')?sp.tc||shade(sp.c1,-.05):null;
 const tailCol=fx||sp.tc||(sp.pat==='tang'?sp.c2:shade(sp.c1,-.15));
 const finCol=fx||(sp.pat==='tang'?sp.c2:(sp.pat==='band'?sp.c1:shade(sp.c1,-.2)));
 // 尾びれ
 c.save();c.translate(-L*.42,0);c.rotate(w);c.fillStyle=tailCol;c.beginPath();
 const ts=sp.shark?'shark':(sp.tail||'def');
 switch(ts){
  case'shark':c.moveTo(4,0);c.lineTo(-L*.3,-h*1.1);c.quadraticCurveTo(-L*.12,-h*.1,-L*.18,h*.55);break;
  case'fork':c.moveTo(4,0);c.lineTo(-L*.31,-h*.72);c.lineTo(-L*.13,0);c.lineTo(-L*.31,h*.72);break;
  case'square':c.moveTo(4,-h*.14);c.lineTo(-L*.21,-h*.5);c.lineTo(-L*.23,-h*.5);c.lineTo(-L*.23,h*.5);c.lineTo(-L*.21,h*.5);c.lineTo(4,h*.14);break;
  case'round':c.moveTo(4,-h*.16);c.quadraticCurveTo(-L*.34,-h*.75,-L*.27,0);c.quadraticCurveTo(-L*.34,h*.75,4,h*.16);break;
  case'lunate':c.moveTo(3,0);c.quadraticCurveTo(-L*.1,-h*.25,-L*.3,-h*.9);c.quadraticCurveTo(-L*.17,0,-L*.3,h*.9);c.quadraticCurveTo(-L*.1,h*.25,3,0);break;
  case'pointed':c.moveTo(4,-h*.13);c.lineTo(-L*.42,0);c.lineTo(4,h*.13);break;
  case'veil':{const f=Math.sin(t*3+ph)*h*.18;c.globalAlpha=.85;c.moveTo(4,-h*.1);c.bezierCurveTo(-L*.2,-h*1,-L*.42,-h*.7+f,-L*.52,-h*.25+f);c.quadraticCurveTo(-L*.36,f*.5,-L*.52,h*.3+f);c.bezierCurveTo(-L*.42,h*.8+f,-L*.2,h*1,4,h*.1);break;}
  default:c.moveTo(4,0);c.lineTo(-L*.28,-h*.62);c.quadraticCurveTo(-L*.17,0,-L*.28,h*.62);}
 c.closePath();c.fill();c.globalAlpha=1;if(sp.pat==='band'){c.strokeStyle='#111';c.lineWidth=1.2;c.stroke();}
 if(!sp.shark){c.strokeStyle='rgba(0,0,0,.14)';c.lineWidth=Math.max(.6,L*.006);for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(0,k*h*.04);c.lineTo(-L*.2,k*h*.17);c.stroke();}}
 c.restore();
 // 背びれ
 c.fillStyle=finCol;
 if(sp.sail){c.save();c.globalAlpha=.85;c.fillStyle=sp.c2;c.beginPath();c.moveTo(L*.3,-h*.35);c.quadraticCurveTo(L*.1,-h*2.6-Math.sin(t*2+ph)*3,-L*.3,-h*.3);c.fill();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;for(let i=0;i<6;i++){const x=L*.25-i*L*.09;c.beginPath();c.moveTo(x,-h*.35);c.lineTo(x-L*.02,-h*(2.1-Math.abs(i-2)*.25));c.stroke();}c.restore();}
 else if(sp.shark){c.beginPath();c.moveTo(-L*.12,-h*.4);c.lineTo(-L*.02,-h*1.25);c.lineTo(L*.1,-h*.4);c.fill();c.beginPath();c.moveTo(-L*.32,-h*.25);c.lineTo(-L*.3,-h*.55);c.lineTo(-L*.25,-h*.25);c.fill();}
 else{const sw2=Math.sin(t*3+ph)*2;c.beginPath();
  switch(sp.dor){
   case'spiny':{c.moveTo(L*.17,-h*.38);const n=7,st=L*.44/n;for(let i=0;i<n;i++){const x=L*.17-i*st;c.lineTo(x-st*.25,-h*(1.02-i*.05)-sw2*.5);c.lineTo(x-st*.75,-h*.66);}c.lineTo(-L*.3,-h*.3);c.closePath();c.fill();
    c.strokeStyle=shade(finCol.startsWith('#')?finCol:'#888888',-.35);c.lineWidth=Math.max(.7,L*.008);for(let i=0;i<n;i++){const x=L*.17-i*st;c.beginPath();c.moveTo(x-st*.2,-h*.42);c.lineTo(x-st*.25,-h*(1.02-i*.05)-sw2*.5);c.stroke();}break;}
   case'square':c.moveTo(L*.14,-h*.38);c.lineTo(L*.1,-h*.88-sw2);c.lineTo(-L*.2,-h*.88-sw2);c.lineTo(-L*.26,-h*.32);c.closePath();c.fill();break;
   case'double':c.moveTo(L*.17,-h*.38);c.lineTo(L*.08,-h*.95-sw2);c.lineTo(L*.0,-h*.42);c.closePath();c.fill();c.beginPath();c.moveTo(-L*.08,-h*.4);c.quadraticCurveTo(-L*.15,-h*.82-sw2,-L*.27,-h*.32);c.closePath();c.fill();break;
   case'long':c.moveTo(L*.28,-h*.4);for(let x=L*.24;x>=-L*.42;x-=L*.04)c.lineTo(x,-h*(.68+.05*Math.sin(x/L*20+t*4)));c.lineTo(-L*.44,-h*.15);c.closePath();c.fill();break;
   case'tall':c.moveTo(L*.12,-h*.4);c.quadraticCurveTo(L*.04,-h*1.5,-L*.16,-h*1.55-sw2*2);c.lineTo(-L*.08,-h*.95);c.lineTo(-L*.22,-h*.35);c.closePath();c.fill();break;
   case'veil':{const f=Math.sin(t*2.5+ph)*h*.15;c.globalAlpha=.85;c.moveTo(L*.15,-h*.4);c.bezierCurveTo(L*.05,-h*1.3,-L*.25,-h*1.4+f,-L*.48,-h*1.0+f);c.quadraticCurveTo(-L*.3,-h*.65,-L*.28,-h*.32);c.closePath();c.fill();c.globalAlpha=1;break;}
   default:c.moveTo(-L*.25,-h*.3);c.quadraticCurveTo(-L*.02,-h*.95-sw2,L*.14,-h*.38);c.fill();}}
 c.beginPath();if(sp.dor==='long'){c.moveTo(L*.05,h*.4);for(let x=0;x>=-L*.4;x-=L*.04)c.lineTo(x,h*(.66+.05*Math.sin(x/L*20+t*4)));c.lineTo(-L*.42,h*.15);c.closePath();}
 else if(sp.dor==='veil'){const f=Math.sin(t*2.5+ph+1)*h*.15;c.globalAlpha=.85;c.moveTo(-L*.02,h*.4);c.bezierCurveTo(-L*.1,h*1.1,-L*.3,h*1.15+f,-L*.45,h*.8+f);c.quadraticCurveTo(-L*.32,h*.55,-L*.25,h*.3);c.closePath();}
 else{c.moveTo(-L*.12,h*.36);c.quadraticCurveTo(0,h*.78,L*.06,h*.4);}
 c.fill();c.globalAlpha=1;
 // 吻（カジキ・ミツクリザメ）
 if(sp.bill){c.strokeStyle=shade(sp.c1,-.3);c.lineWidth=Math.max(1.5,h*.09);c.lineCap='round';c.beginPath();c.moveTo(L*.44,-h*.05);c.lineTo(L*(sp.shark?.66:.85),-h*.1);c.stroke();}
 // 体
 c.beginPath();
 if(sp.shark){c.moveTo(L*.52,-h*.02);c.quadraticCurveTo(L*.35,-h*.62,-L*.1,-h*.5);c.quadraticCurveTo(-L*.45,-h*.3,-L*.5,0);c.quadraticCurveTo(-L*.4,h*.35,0,h*.48);c.quadraticCurveTo(L*.4,h*.4,L*.52,-h*.02);}
 else c.ellipse(0,0,L/2,h/2,0,0,Math.PI*2);
 let g=c.createLinearGradient(0,-h/2,0,h/2);
 if(sp.pat==='rainbow'){for(let i=0;i<6;i++)g.addColorStop(i/5,`hsl(${(t*60+i*55+ph*40)%360},90%,${62+i*3}%)`);}
 else if(sp.pat==='irid'){g=c.createLinearGradient(-L/2,0,L/2,0);for(let i=0;i<5;i++)g.addColorStop(i/4,`hsl(${(t*40+i*70+ph*30)%360},80%,${66+(i%2)*8}%)`);}
 else if(sp.pat==='dream'){g.addColorStop(0,sp.c2);g.addColorStop(.5,sp.c1);g.addColorStop(1,'#ffffff');}
 else if(sp.pat==='gold'){g.addColorStop(0,'#8a6000');g.addColorStop(.4,'#ffd700');g.addColorStop(.6,'#fff3a0');g.addColorStop(1,'#d4a000');}
 else if(sp.pat==='back'||sp.pat==='stripes'||sp.pat==='ws'||sp.shark){g.addColorStop(0,sp.c2);g.addColorStop(.5,sp.c1);g.addColorStop(1,shade(sp.c1,.45));}
 else{g.addColorStop(0,shade(sp.c1,-.25));g.addColorStop(.5,sp.c1);g.addColorStop(1,shade(sp.c1,.35));}
 c.fillStyle=g;c.fill();
 c.save();c.clip();
 switch(sp.pat){
  case'dots':c.fillStyle='rgba(20,35,55,.8)';for(let i=0;i<6;i++){c.beginPath();c.arc(-L*.28+i*L*.1,-h*.05,h*.07,0,7);c.fill();}break;
  case'bluedots':c.fillStyle=sp.c2;for(let i=0;i<14;i++){c.beginPath();c.arc(-L*.35+((i*37)%75)/100*L,-h*.38+((i*53)%60)/100*h,Math.max(1,h*.045),0,7);c.fill();}break;
  case'line':c.strokeStyle=sp.c2;c.lineWidth=Math.max(1,h*.07);c.beginPath();c.moveTo(-L*.45,h*.02);for(let i=0;i<9;i++)c.lineTo(-L*.4+i*L*.08,(i%2?-1:1)*h*.04);c.stroke();break;
  case'spots':c.fillStyle=shade(sp.c2,0)+'';c.globalAlpha=.55;for(let i=0;i<9;i++){c.beginPath();c.arc(-L*.35+((i*37)%70)/100*L,-h*.35+((i*53)%70)/100*h,h*.07,0,7);c.fill();}c.globalAlpha=1;break;
  case'band':for(const x of[L*.2,-L*.06,-L*.32]){c.fillStyle='#111';c.fillRect(x-L*.065,-h,L*.13,h*2);c.fillStyle='#fff';c.fillRect(x-L*.045,-h,L*.09,h*2);}break;
  case'vstripe':c.fillStyle=sp.c2;c.globalAlpha=.8;for(let i=0;i<5;i++)c.fillRect(L*.22-i*L*.15,-h,L*.06,h*2);c.globalAlpha=1;break;
  case'wave':c.strokeStyle=sp.c2;c.lineWidth=Math.max(1,h*.06);for(let k=0;k<3;k++){c.beginPath();for(let x=-L*.5;x<L*.4;x+=3)c.lineTo(x,-h*.32+k*h*.14+Math.sin(x*.5/(L*.05))*h*.06);c.stroke();}break;
  case'eyebar':c.fillStyle='#222';c.fillRect(L*.24,-h,L*.07,h*2);c.fillStyle='#fff';c.beginPath();c.arc(-L*.25,-h*.12,h*.15,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(-L*.25,-h*.12,h*.11,0,7);c.fill();
   c.strokeStyle='rgba(180,130,0,.5)';c.lineWidth=1;for(let i=-3;i<4;i++){c.beginPath();c.moveTo(-L*.5,i*h*.15);c.lineTo(L*.5,i*h*.15+h*.3);c.stroke();}break;
  case'tang':c.strokeStyle='#0a0a2a';c.lineWidth=h*.13;c.lineCap='round';c.beginPath();c.moveTo(L*.28,-h*.18);c.quadraticCurveTo(0,h*.32,-L*.38,-h*.08);c.stroke();c.beginPath();c.moveTo(-L*.05,-h*.3);c.quadraticCurveTo(-L*.2,-h*.05,-L*.3,-h*.35);c.stroke();break;
  case'stripes':c.strokeStyle='rgba(25,45,75,.55)';c.lineWidth=Math.max(1,h*.06);for(const y of[.08,.19,.3]){c.beginPath();c.moveTo(-L*.4,h*y);c.lineTo(L*.25,h*y);c.stroke();}break;
  case'ws':c.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<14;i++)for(let j=0;j<3;j++){c.beginPath();c.arc(-L*.4+i*L*.065,-h*.35+j*h*.2+(i%2)*h*.08,h*.04,0,7);c.fill();}break;
  case'glow':{const a=.55+.45*Math.sin(t*3+ph);c.fillStyle=sp.c2;c.shadowColor=sp.c2;c.shadowBlur=6;c.globalAlpha=a;for(let i=0;i<9;i++){c.beginPath();c.arc(-L*.38+i*L*.09,h*.25,Math.max(1,h*.06),0,7);c.fill();}
   if(sp.shark){c.strokeStyle=sp.c2;c.lineWidth=2;c.beginPath();c.moveTo(-L*.35,-h*.1);for(let i=1;i<7;i++)c.lineTo(-L*.35+i*L*.1,(i%2?-1:1)*h*.18);c.stroke();}c.globalAlpha=1;c.shadowBlur=0;break;}
  case'hstripe':c.fillStyle=sp.c2;for(const y of[-.3,-.1,.1,.28])c.fillRect(-L/2,y*h,L,h*.075);break;
  case'scales':c.strokeStyle=sp.sc||'rgba(0,0,0,.2)';c.lineWidth=Math.max(.6,L*.007);for(let j=-4;j<=4;j++)for(let i=-8;i<=8;i++){const x=i*L*.055+(j%2)*L*.027,y=j*h*.11;c.beginPath();c.arc(x,y,L*.032,Math.PI*.25,Math.PI*.75);c.stroke();}break;
  case'speck':c.fillStyle=sp.c2;for(let i=0;i<40;i++){const x=-L*.42+((i*37)%100)/100*L*.85,y=-h*.45+((i*53)%60)/100*h*.75;c.beginPath();c.arc(x,y,Math.max(.6,L*.008),0,7);c.fill();}break;
  case'mottled':c.fillStyle=sp.c2;c.globalAlpha=.42;for(let i=0;i<12;i++){c.beginPath();c.ellipse(-L*.4+((i*37)%90)/100*L,-h*.4+((i*53)%80)/100*h,L*(.03+(i%3)*.018),h*(.06+(i%2)*.05),i,0,7);c.fill();}c.globalAlpha=1;break;
  case'saddle':c.fillStyle=sp.c2;c.globalAlpha=.6;for(let i=0;i<4;i++){c.beginPath();c.ellipse(L*.2-i*L*.18,-h*.5,L*.055,h*.42,0,0,7);c.fill();}c.globalAlpha=1;break;
  case'ocellus':c.fillStyle='#f4f0e0';c.beginPath();c.arc(-L*.04,0,h*.27,0,7);c.fill();c.fillStyle=sp.c2;c.beginPath();c.arc(-L*.04,0,h*.2,0,7);c.fill();break;
  case'arcbow':for(let k=0;k<6;k++){c.strokeStyle=`hsla(${(k*52+t*25)%360},95%,62%,.8)`;c.lineWidth=h*.085;c.beginPath();c.arc(-L*.02,h*1.05,h*(1.42-k*.1),Math.PI*1.1,Math.PI*1.9);c.stroke();}
   c.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<7;i++){const x=-L*.35+i*L*.11,y=h*.25+(i%2)*h*.08;c.beginPath();c.moveTo(x,y-h*.06);c.quadraticCurveTo(x+h*.05,y+h*.02,x,y+h*.04);c.quadraticCurveTo(x-h*.05,y+h*.02,x,y-h*.06);c.fill();}break;

  case'sakura':for(let i=0;i<9;i++){const x=-L*.38+((i*41)%85)/100*L,y=-h*.38+((i*29)%75)/100*h,r=h*(.07+(i%3)*.025),rot=i+t*.2;c.fillStyle=sp.c2;for(let q=0;q<5;q++){const a=rot+q/5*Math.PI*2;c.beginPath();c.ellipse(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6,r*.55,r*.35,a,0,7);c.fill();}c.fillStyle='#ff6a9a';c.beginPath();c.arc(x,y,r*.2,0,7);c.fill();}
   {const x=((t*.5+ph)%2-1)*L;const sg=c.createLinearGradient(x-L*.15,0,x+L*.15,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.45)');sg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=sg;c.fillRect(-L,-h,L*2,h*2);}break;
  case'irid':c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=Math.max(.6,L*.007);for(let j=-3;j<=3;j++)for(let i=-7;i<=7;i++){const x=i*L*.06+(j%2)*L*.03,y=j*h*.12;c.beginPath();c.arc(x,y,L*.035,Math.PI*.2,Math.PI*.8);c.stroke();}

function updateFishing(dt){

 for(const rp of ripples)rp.t+=dt*.8;ripples=ripples.filter(r=>r.t<1);
 for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt*1.2;}sparks=sparks.filter(p=>p.l>0);
 if(fs.st==='cast'&&fs.t>=.6){fs.st='wait';fs.t=0;ripples.push({x:fs.bx,y:fs.by,t:0});splash(fs.bx,fs.by,6);}
 else if(fs.st==='wait'){
  fs.nibT-=dt;if(fs.nib>0)fs.nib-=dt;
  if(fs.nibT<=0){fs.nibT=rand(.8,2);if(fs.t<fs.wait-.5){fs.nib=.25;ripples.push({x:fs.bx,y:fs.by,t:.3});}}
  if(fs.t>=fs.wait){fs.st='bite';fs.t=0;fs.sp=pickSpecies(s.area);fs.size=rollSize(fs.sp);fs.win=clamp(.95+effRod()*.08-fs.sp.r*.07,.5,1.4);
   ripples.push({x:fs.bx,y:fs.by,t:0});splash(fs.bx,fs.by,10);if(navigator.vibrate)navigator.vibrate(60);}
 }
 else if(fs.st==='bite'&&fs.t>fs.win){fs.st='idle';flash('逃げられた…💦','#ffb3b3');log('🐟 魚に逃げられた… 浮きが沈んだらすぐタップ！');}
 else if(fs.st==='reel'){fs.mk+=fs.md*fs.speed*dt;if(fs.mk>1){fs.mk=1;fs.md=-1;}if(fs.mk<0){fs.mk=0;fs.md=1;}}
 else if(fs.st==='result'&&fs.t>4){fs.st='idle';}

// ===================== 経営 =====================
function fishAppeal(f){const p=SPM[f.s],k=clamp((f.z-p.mn)/(p.mx-p.mn),0,1);return p.ap*(.8+.5*k);}
function tankTheme(i){const t=s.tanks[i];if(t&&t.dream)return DREAM;let k=0;for(let j=0;j<i;j++)if(!s.tanks[j].dream)k++;return AREAS[Math.min(k,3)];}
function normalTanks(){return s.tanks.filter(t=>!t.dream).length;}
const DREAM_TANK_COST=1500000;
function tankAppeal(t,i){
 const th=tankTheme(i).id,cnt={},tiers=new Set();let base=0,match=0,star=0,neu=0;
 for(const f of t.fish){const p=SPM[f.s];cnt[f.s]=(cnt[f.s]||0)+1;let v=fishAppeal(f)*[1,.6,.4,.3,.25][Math.min(4,cnt[f.s]-1)];
  if(p.a==='dream'){if(th==='dream'){v*=1.2;match++;}else{neu++;}}else if(p.a===th){v*=1.25;match++;}else v*=.8;base+=v;tiers.add(p.r);if(p.r>=4)star++;}
 const n=t.fish.length,uniq=Object.keys(cnt).length,variety=uniq*.05,eco=Math.max(0,tiers.size-1)*.12,unity=n>=3&&match>0&&match+neu===n?.2:0,jam=n>=3&&star/n>.5?-.25:0,dirt=tankDirt(t);
 const deco=tankDecoBonus(t),mul=Math.max(.1,1+variety+eco+unity+jam+deco);
 return{base,n,uniq,tiers:tiers.size,match,variety,eco,unity,jam,deco,dirt,mul,total:base*mul*(1-.6*dirt)};}
function curEvent(){return s.event&&s.event.left>0?EVM[s.event.id]:null;}
function evApp(){const e=curEvent();return e?e.app:1;}
function evVis(){const e=curEvent();return e?e.vis:1;}
let APPEAL_BASE=0;
function recalc(){let a=0;s.tanks.forEach((t,i)=>a+=tankAppeal(t,i).total);APPEAL_BASE=a;APPEAL=a*evApp()*stormApp();}
function evReqOk(e){for(const k in e.req){const v=e.req[k];if(k==='_pier'&&!s.b.pier)return false;if(k==='_lighthouse'&&!s.b.lighthouse)return false;if(k==='_rating'&&s.rating<v)return false;if(k==='_land'&&s.land<v)return false;if(k[0]!=='_'&&(s.deco[k]||0)<v)return false;}return true;}
function evReqText(e){return Object.entries(e.req).map(([k,v])=>{const ok=k==='_pier'?s.b.pier:k==='_lighthouse'?s.b.lighthouse:k==='_rating'?s.rating>=v:k==='_land'?s.land>=v:(s.deco[k]||0)>=v;
 const n=k==='_pier'?'⚓桟橋':k==='_lighthouse'?'💡灯台':k==='_rating'?`⭐評価Lv${v}`:k==='_land'?`🏗️埋め立て${v}段階`:`${DECOM[k].ic}${DECOM[k].n}${v>1?'×'+v:''}`;return`${ok?'✅':'🔒'}${n}`;}).join(' ');}
function avgTM(night){let a=0;for(let i=0;i<24;i++){const h=i+.5;a+=night&&(h>=19||h<6)?.95:timeMult(h);}return a/24;}
function estDaily(e){const A=APPEAL_BASE*(e?e.app:1);if(A<=0)return 0;const tk=Math.round(4+Math.sqrt(A)*1.2+s.rating*1.5)+cafeLv()*4+shopIncome();
 const vr=(.1+Math.sqrt(A)/40)*(1+.12*cottLv())*(lhOn()?1.15:1)*(s.rain?.7:1)*(1+nigiwai()/100)*dirtVisMul()*(e?e.vis:1);
 let tm=0;for(let i=0;i<24;i++){const h=i+.5;tm+=e&&e.night&&(h>=19||h<6)?.95:(h>=9&&h<19?1:h>=6&&h<9?.5:h>=19&&h<22?.6:.15);}return vr*(tm/24)*DAY_SEC*tk;}
function eventCost(e){return Math.round((e.min+Math.max(0,estDaily(e)-estDaily(null))*e.days*1.2)/100)*100;}
function startEvent(id){const e=EVM[id];if(s.storm){log('🌪 嵐の影響で、今はイベントを開催できない…');return;}if(curEvent()||!evReqOk(e))return;const free=!!e.special;if(free&&!(s.freeEv>0))return;const c=free?0:eventCost(e);if(s.gold<c)return;
 if(free)s.freeEv--;s.gold-=c;s.event={id,left:e.days*DAY_SEC,cost:c,inc:0};recalc();log(`${e.ic} ${e.n} 開催！（${e.days}日間・${free?'🎫 無料券を使用':'開催費 -'+fmtG(c)}）`,'#ff9ad5');if(e.instant)log('🎣 今日は投げた瞬間に魚が食いつく！釣り場へ急げ！','#ffd166');addXp(10*e.days);}
function updateEvent(dt){if(!s.event)return;if(s.event.left>0){s.event.left-=dt;if(s.event.left<=0){const e=EVM[s.event.id];
 log(`${e.ic} ${e.n} 終了！期間中の来場者でにぎわった！（売上 ${fmtG(s.event.inc)}）`,'#ff9ad5');s.event=null;recalc();if(tab==='island')renderPanel();}}}
function nigiwai(){const st=s.storm&&s.storm.debris||{};let b=0;for(let i=0;i<s.land;i++)if(!st['l'+i])b+=10;const a=activeDeco();for(const id in a)b+=(DECOM[id]?DECOM[id].b:0)*a[id];return Math.round(b);}
function shopIncome(){let g=0;const a=activeDeco();for(const id in a)g+=(DECOM[id]&&DECOM[id].shop||0)*a[id];return g;}
function nightIncome(){let g=0;const a=activeDeco();for(const id in a)g+=(DECOM[id]&&DECOM[id].night||0)*a[id];return Math.round(g*(1+s.rating*.05));}
function dirtVisMul(){let w=0,d=0;for(const t of s.tanks){w+=t.fish.length;d+=tankDirt(t)*t.fish.length;}return w?1-.6*d/w:1;}
function decoCost(id){const d=DECOM[id];return Math.round(d.c*Math.pow(d.lvl?2:1.45,s.deco[id]||0));}
function ticket(){return Math.round(4+Math.sqrt(APPEAL)*1.2+s.rating*1.5);}

function visRate(){if(APPEAL<=0)return 0;return(.1+Math.sqrt(APPEAL)/40)*(1+.12*cottLv())*(lhOn()?1.15:1)*(s.rain?.7:1)*(1+nigiwai()/100)*dirtVisMul()*evVis()*stormVis();}
function addXp(x){s.xp+=x;let need;while(s.xp>=(need=xpNeed(s.rating))){s.xp-=need;s.rating++;log(`🎉 島の評価が Lv${s.rating} にアップ！新しい施設やエリアが解放されるかも`,'#ffd166');if(tab==='island')renderPanel();}}
function updateEconomy(dt){
 s.time+=dt/DAY_SEC;if(s.time>=1)endDay();
 const h=hourNow();
 visAcc+=visRate()*timeMult(h)*dt;
 while(visAcc>=1){visAcc--;const tk=ticket(),cafe=cafeLv()*4+shopIncome();s.gold+=tk+cafe;pend.g+=tk;pend.cafe+=cafe;pend.n++;s.visToday++;s.totalVis++;s.incToday+=tk+cafe;if(s.event)s.event.inc+=tk+cafe;s.totalInc+=tk+cafe;
  present.push({until:T+rand(18,30),ix:Math.floor(Math.random()*1000),kid:Math.random()<.3});addXp((lhOn()?1.5:1)*((curEvent()||{}).xp||1));}
 present=present.filter(v=>v.until>T);
 pend.t+=dt;if(pend.t>=7){if(pend.n>0&&!s.dream)log(`🎫 入場料 +${pend.g}G（${pend.n}人）${pend.cafe?` ☕お店 +${pend.cafe}G`:''}`,'#4fd1c5');pend={g:0,n:0,cafe:0,t:0};}
}
function boardBoat(){if(!s.boat)return;s.boat=false;s.dream=true;s.dreamVisited=true;s.dreamTrips=(s.dreamTrips||0)+1;s.time=0;s.area='dream';fs.st='idle';
 log('⛵ 小舟に乗ると、深い霧に包まれた…気がつくと、その日の朝に戻っていた。','#ffc8ec');log('🌙 「夢で見た海」へ！今日1日だけ、伝説級の魚が釣れる','#ffc8ec');
 save();document.querySelector('[data-tab=fish]').click();}
function endDay(){
 const bonus=stormStage()==='storm'?0:cottLv()*30*s.rating+nightIncome();s.gold+=bonus;
 const sum=`来場 ${s.visToday}人 / 売上 ${fmtG(s.incToday+bonus)}${bonus?`（宿泊 +${bonus}G）`:''}`;
 if(s.dream){s.dream=false;if(s.area==='dream')s.area='beach';fs.st='idle';log('🌙 目が覚めると、いつもの島の朝だった…','#ffc8ec');log(`📊 夢を見ていたDay ${s.day}の島の売上 — ${sum}`,'#c98bff');}
 else log(`🌙 Day ${s.day} 終了 — ${sum}`,'#c98bff');
 s.day++;s.time=0;s.visToday=0;s.incToday=0;pend={g:0,n:0,cafe:0,t:0};
 if(s.boat){s.boat=false;log('🌫️ 砂浜の幻の小舟は、霧の中へ消えていった…','#d8c8ff');}

 if(s.rain&&!s.storm&&Math.random()<BOAT_CHANCE){s.boat=true;log('🌫️ 雨にけむる砂浜に、見慣れない小舟が流れ着いている…？（島タブ）','#d8c8ff');}
 if(s.rain)log(`☔ Day ${s.day} は雨…どの釣り場も「雨の日ステージ」に！雨の日限定の魚を狙おう`,'#7ab8ff');else if(was)log(`☀️ Day ${s.day} 雨が上がって晴れた！`,'#ffd166');

function buy(k){

 switch(k){

  case'tankup':cost=tankCost(tank.cap);if(tank.cap<TANK_MAX&&s.gold>=cost){tank.cap++;ok=true;msg=`💧 水槽${s.cur+1}を拡張！定員${tank.cap}匹`;}break;
  case'newtank':{const nn=normalTanks();cost=NEWTANK_COST[nn];if(nn<4&&s.gold>=cost&&s.rating>=nn+1){s.tanks.push({cap:3,fish:[]});ok=true;msg=`🏗️ 水槽${s.tanks.length}（${AREAS[nn].n}テーマ）を増設！`;}break;}
  case'cafe':{const c=CAFE[s.b.cafe];if(c&&s.gold>=c.c&&s.rating>=c.q){cost=c.c;s.b.cafe++;ok=true;msg=`☕ カフェが Lv${s.b.cafe} に！`;}break;}
  case'cottage':{const c=COTT[s.b.cottage];if(c&&s.gold>=c.c&&s.rating>=c.q){cost=c.c;s.b.cottage++;ok=true;msg=`🛖 コテージを建てた！（${s.b.cottage}棟）`;}break;}

  case'bucket':cost=bucketCost();if((s.b.bucket||0)<BUCKET_MAX&&s.gold>=cost){s.b.bucket=(s.b.bucket||0)+1;ok=true;msg=`🪣 いけすが ${bucketCap()}匹 まで入るようになった！`;}break;

// ===================== 🌪 嵐（やり込み後のイベント） =====================
const STORM_CHANCE=.03;   // 全部そろえた後、1日ごとに嵐が来る確率
function endgameDone(){return s.areas.length>=AREAS.length&&s.land>=LAND.length&&(freeSlot()<0||DECOS.every(d=>(s.deco[d.id]||0)>=d.max));}
function stormStage(){return s.storm?s.storm.stage:null;}
function bOn(k){return s.b[k]&&!(s.storm&&s.storm.bld&&s.storm.bld[k]);}
function cafeLv(){return bOn('cafe')?s.b.cafe:0;}
function cottLv(){return bOn('cottage')?s.b.cottage:0;}
function lhOn(){return !!bOn('lighthouse');}
function brokenSet(){return new Set(s.storm&&s.storm.broken||[]);}
function activeDeco(){const bs=brokenSet(),c={};s.decoList.forEach((id,i)=>{if(id&&i<slotCount()&&!bs.has(i))c[id]=(c[id]||0)+(DECOM[id].lvl?(s.deco[id]||1):1);});return c;}
function stormApp(){return stormStage()==='damage'?.4:1;}
function stormVis(){const st=stormStage();return st==='storm'?0:st==='warn'?.7:1;}
function decoPaid(i){const id=s.decoList[i],d=DECOM[id];if(d.lvl){let t=0;for(let j=0;j<(s.deco[id]||1);j++)t+=d.c*Math.pow(2,j);return t;}let n=0;for(let k=0;k<i;k++)if(s.decoList[k]===id)n++;return DECOM[id].c*Math.pow(1.45,n);}
function repairList(){if(stormStage()!=='damage')return[];const st=s.storm,L=[];
 if(st.debris.main)L.push({k:'main',ic:'🧹',n:'本島の片付け（倒木・がれき撤去）',c:100000});
 for(let i=0;i<s.land;i++)if(st.debris['l'+i])L.push({k:'l'+i,ic:'🧹',n:`${LAND[i].n}の片付け`,c:Math.round(LAND[i].c*.3*(1+(landLv(i)-1)*.5))});
 const sum=(arr,n)=>arr.slice(0,n).reduce((a,x)=>a+x.c,0);
 if(st.bld.cafe)L.push({k:'cafe',ic:'☕',n:'カフェの再建',c:Math.round(sum(CAFE,s.b.cafe)*.3)});
 if(st.bld.cottage)L.push({k:'cottage',ic:'🛖',n:`コテージ${s.b.cottage}棟の再建`,c:Math.round(sum(COTT,s.b.cottage)*.3)});
 if(st.bld.lighthouse)L.push({k:'lighthouse',ic:'💡',n:'灯台の再建',c:450});
 st.broken.forEach(i=>{const d=DECOM[s.decoList[i]];L.push({k:'d'+i,ic:d.ic,n:`${d.n}の再建`,c:Math.round(decoPaid(i)*.3)});});
 return L;}
function stormDamage(){
 const idx=s.decoList.map((_,i)=>i).filter(i=>i<slotCount()&&s.decoList[i]);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
 const broken=idx.slice(0,Math.max(1,Math.round(idx.length*rand(.3,.5)))).sort((a,b)=>a-b);
 const bld={};if(s.b.cafe&&Math.random()<.5)bld.cafe=1;if(s.b.cottage&&Math.random()<.6)bld.cottage=1;if(s.b.lighthouse&&Math.random()<.4)bld.lighthouse=1;
 const debris={main:1};for(let i=0;i<s.land;i++)debris['l'+i]=1;
 s.storm={stage:'damage',broken,bld,debris};
 s.tanks.forEach(t=>{ensureDirt(t);for(let i=0;i<t.dirt.length;i++)t.dirt[i]=Math.min(100,t.dirt[i]+40);});
 const tot=repairList().reduce((a,x)=>a+x.c,0);
 log(`🌪 嵐が去った…装飾${broken.length}か所と${Object.keys(bld).length}つの建物が崩壊し、島は荒れ果ててしまった`,'#ff8a8a');
 log(`🔨 復興に必要な費用：約${fmtG(tot)}。すべて復興するまで魅力度は40%に…（島タブ「🌪 復興」）`,'#ff8a8a');}
function fixItem(k){const it=repairList().find(x=>x.k===k);if(!it||s.gold<it.c)return false;s.gold-=it.c;const st=s.storm;

function latteShape(c,shape,cx,cy,R){const L=LATTE[shape]||LATTE.heart;c.save();c.translate(cx,cy);c.scale(R,R);c.lineCap='round';c.lineJoin='round';

function pickLatte(){let r=Math.random()*100,t=0;for(;t<3;t++){r-=LATTE_TIER[t].w;if(r<0)break;}const ks=Object.keys(LATTE).filter(k=>LATTE[k].t===t);return ks[Math.floor(Math.random()*ks.length)];}

  for(let y=0;y<100;y+=2)for(let x=0;x<100;x+=2){const i=y*100+x;if(!S[i])continue;let ok=D[i]>=rb;if(!ok){ok=true;for(let oy=-1;oy<=1&&ok;oy++)for(let ox=-1;ox<=1;ox++){const X=x+ox,Y=y+oy;if(X>=0&&Y>=0&&X<100&&Y<100&&D[Y*100+X]>D[i]){ok=false;break;}}}

function paintDab(c,px,py){const gr=c.createRadialGradient(px,py,0,px,py,15);gr.addColorStop(0,'rgba(255,250,240,.9)');gr.addColorStop(.7,'rgba(255,248,236,.6)');gr.addColorStop(1,'rgba(255,248,236,0)');c.fillStyle=gr;c.beginPath();c.arc(px,py,15,0,7);c.fill();}

function cafeDown(x,y){const g=cafe.g;if(cafe.scene==='soft'){if(g.st==='ready'){const cd=cafeToday();cd.mode='job';cd.job=true;save();g.st='play';g.tx=x;renderPanel();}else if(g.st==='play')g.tx=x;}
 else if(cafe.scene==='art'){if(g.st==='ready'){const cd=cafeToday();cd.mode='job';cd.job=true;save();g.st='pour';renderPanel();}else if(g.st==='art'){g.last=null;artDab(g,x,y);}}}
function cafeMove(x,y){const g=cafe.g;if(!g||!pdown)return;if(cafe.scene==='soft'&&g.st==='play')g.tx=x;if(cafe.scene==='art'&&g.st==='art')artDab(g,x,y);}
function cafeUp(){if(cafe&&cafe.scene==='art'&&cafe.g&&cafe.g.st==='pour'&&cafe.g.fill>3)finishPour(cafe.g);}
function updateCafe(dt){cafe.t+=dt;if(cafe.scene==='soft')updateSoft(cafe.g,dt);if(cafe.scene==='art')updateArt(cafe.g,dt);}
function drawCafe(){if(cafe.scene==='lobby')drawCafeLobby();else if(cafe.scene==='table')drawCafeTable();else if(cafe.scene==='kitchen')drawCafeKitchen(false);else if(cafe.scene==='soft')drawSoft(cafe.g);else if(cafe.scene==='art')drawArt(cafe.g);}
function renderCafePanel(){const P=$('#panel'),sc=cafe.scene;let h=`<div class="cafeHead"><div style="font-size:12px;opacity:.85">AQUA ISLAND</div><div class="cafeTitle">Aqua Café</div><div style="font-size:12px;opacity:.85">${{lobby:'店内',table:'テーブル席',kitchen:'キッチン',soft:'職場体験：ソフトクリーム作り',art:'職場体験：ラテアート'}[sc]}</div></div>`;
 if(sc==='lobby'){const cd=cafeToday();if(cd.mode)h+=`<div class="sub" style="margin:0 2px 8px">${cd.mode==='order'?`今日はテーブル席でのんびり（注文 ${cd.orders}/3）`:'今日は職場体験の日'}。注文と職場体験は、1日にどちらか1回だけ楽しめます。</div>`;else h+=`<div class="sub" style="margin:0 2px 8px">注文（最大3品）か職場体験（1回）、今日はどちらにしますか？</div>`;
  h+=`<div class="cafeOpt" data-act="cafego" data-k="table" style="${cd.mode==='job'?'opacity:.45;pointer-events:none':''}"><div class="ci">🪑</div><div><b>テーブル席へ</b><div class="sub2">窓辺の席で海を眺めながら、ほっと一息</div></div></div>
  <div class="cafeOpt" data-act="cafego" data-k="kitchen" style="${cafeToday().mode==='order'?'opacity:.45;pointer-events:none':''}"><div class="ci">🧑‍🍳</div><div><b>キッチンへ</b><div class="sub2">職場体験でカフェのお仕事に挑戦！お給料ももらえる</div></div></div>
  <button class="btn ghost" style="width:100%;margin-top:6px" data-act="cafeexit">🏝️ 島に戻る</button>`;}
 else if(sc==='table'){h+=`<div class="card cafeMenu"><h3 style="font-family:Georgia,serif;font-style:italic">Menu</h3>${(()=>{const cd=cafeToday(),full=cd.orders>=3;return(full?'<div style="text-align:center;padding:10px;border-radius:10px;background:#5a3a24;color:#ffe8c0;font-weight:bold;margin-bottom:6px">🍽️ もうお腹いっぱい…ごちそうさま！</div>':`<div class="sub2" style="margin-bottom:4px">今日はあと <b>${3-cd.orders}</b> 品まで注文できます</div>`)+CAFE_MENU.map(m=>`<div class="mrow"><div><b>${m.n}</b><div class="sub2">${m.d}</div></div><button class="btn sm gold" data-act="cafeorder" data-id="${m.id}" data-cost="${m.p}" ${s.gold<m.p||full?'disabled':''}>${fmtG(m.p)}</button></div>`).join('');})()}</div>
  <button class="btn ghost" style="width:100%" data-act="cafego" data-k="lobby">↩ 店内に戻る</button>`;}
 else if(sc==='kitchen'){const b=s.cafeBest||{},jd=cafeToday().job;if(jd)h+=`<div style="text-align:center;padding:10px;border-radius:10px;background:#5a3a24;color:#ffe8c0;font-weight:bold;margin-bottom:8px">今日の職場体験はおしまい。おつかれさま！</div>`;else h+=`<div class="sub" style="margin:0 2px 8px">挑戦できるのは1日にどちらか1回だけ！</div>`;
  h+=`<div class="cafeOpt" data-act="cafego" data-k="soft" style="${jd?'opacity:.45;pointer-events:none':''}"><div class="ci">🍦</div><div><b>ソフトクリーム作り</b><div class="sub2">落ちてくるクリームをコーンで受け止めて高く積もう（最高 ${b.soft||0}段）</div></div></div>
  <div class="cafeOpt" data-act="cafego" data-k="art" style="${cafeToday().job?'opacity:.45;pointer-events:none':''}"><div class="ci">☕</div><div><b>ラテアート</b><div class="sub2">ラテを注いで、ミルクで絵を描こう（最高 ${b.art||0}点）</div></div></div>
  <div class="sub" style="margin:4px 2px 8px">お給料はカフェのレベルが高いほどアップ（現在 ×${cafeRF().toFixed(1)}）</div>
  <button class="btn ghost" style="width:100%" data-act="cafego" data-k="lobby">↩ 店内に戻る</button>`;}
 else{const g=cafe.g;h+=`<div class="card sub">${sc==='soft'?'画面を左右にドラッグしてコーンを動かそう。急に動かすとタワーが傾いて倒れます。ミス5回か45秒で終了。':'長押しで注いで、緑のラインで離す → 点線をなぞってミルクで描く。'}</div>
  ${sc==='art'&&g&&g.st==='art'?'<button class="btn gold" style="width:100%;margin-bottom:6px" data-act="artdone">✨ 完成！</button>':''}
  <button class="btn ghost" style="width:100%" data-act="cafego" data-k="kitchen">↩ キッチンに戻る</button>`;}
 P.innerHTML=h;}
function cafeAct(act,el){
 if(act==='cafeexit'){exitCafe();return true;}
 if(act==='cafego'){cafeGo(el.dataset.k);return true;}
 if(act==='cafeorder'){const m=CAFE_MENU.find(x=>x.id===el.dataset.id),cd=cafeToday();if(cd.mode==='job'||cd.orders>=3)return true;if(m&&s.gold>=m.p){cd.mode='order';cd.orders++;s.gold-=m.p;cafe.order=m.id;cafe.t=0;cafe.msg=CAFE_MSG[Math.floor(Math.random()*CAFE_MSG.length)];log(`☕ ${m.n}を注文した。${cafe.msg}`,'#e8c8a0');if(cd.orders>=3){cafe.msg='もうお腹いっぱい…ごちそうさま！';log('☕ もうお腹いっぱい…今日はごちそうさま！','#e8c8a0');}save();updateTop();renderPanel();}return true;}
 if(act==='artdone'){if(cafe.g)finishArt(cafe.g);return true;}
 if(act==='entercafe'){enterCafe();return true;}
 return false;}

// ===================== 確認ダイアログ（ゲーム内） =====================
let confirmCb=null;
function askConfirm(msg,cb){confirmCb=cb;$('#mbox').innerHTML=`<div style="white-space:pre-line;font-size:14px;line-height:1.6;margin:6px 0 14px">${msg}</div><div class="row" style="justify-content:center"><button class="btn" data-yes>はい</button><button class="btn ghost" data-close>やめる</button></div>`;$('#modal').style.display='flex';}
function closeModal(){$('#modal').style.display='none';}
function afterChange(){recalc();save();renderPanel();updateTop();}

// ===================== GMモード（動作確認用） =====================
// 「📖 図鑑」タブと「魚図鑑 ○/○」の欄を同時に長押し → コード入力 →「GMモード」
const gmPress={tab:false,card:false},gmPtr={};let gmTimer=null;
function gmCheck(){if(gmPress.tab&&gmPress.card){if(!gmTimer)gmTimer=setTimeout(()=>{gmTimer=null;if(gmPress.tab&&gmPress.card){gmPress.tab=gmPress.card=false;openCodeInput();}},900);}
 else if(gmTimer){clearTimeout(gmTimer);gmTimer=null;}}
document.querySelector('[data-tab=dex]').addEventListener('pointerdown',e=>{gmPtr[e.pointerId]='tab';gmPress.tab=true;gmCheck();});
$('#panel').addEventListener('pointerdown',e=>{if(e.target.closest('[data-gm]')){gmPtr[e.pointerId]='card';gmPress.card=true;gmCheck();}});
function gmUp(e){const k=gmPtr[e.pointerId];if(k){gmPress[k]=false;delete gmPtr[e.pointerId];gmCheck();}}
window.addEventListener('pointerup',gmUp);window.addEventListener('pointercancel',gmUp);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-gm],[data-tab=dex]'))e.preventDefault();});
function openCodeInput(){
 $('#mbox').innerHTML=`<h3>🔐 コード入力</h3><input id="gmCode" class="gmin" type="text" autocomplete="off" placeholder="コードを入力"><div id="gmMsg" class="sub" style="min-height:18px;margin:6px 0"></div><div class="row" style="justify-content:center"><button class="btn" data-gmok>決定</button><button class="btn ghost" data-close>やめる</button></div>`;
 $('#modal').style.display='flex';setTimeout(()=>{const i=$('#gmCode');if(i)i.focus();},50);
 $('#gmCode').addEventListener('keydown',e=>{if(e.key==='Enter')checkCode();});
}
function checkCode(){const v=($('#gmCode').value||'').replace(/\s/g,'').toUpperCase();
 if(v==='GMモード'||v==='GMﾓｰﾄﾞ')openGM();else $('#gmMsg').textContent='❌ コードが違います';}
function gmSpeciesOptions(){const groups=[...AREAS.map(a=>[a.id,`${a.ic} ${a.n}`]),['dream','🌙 夢で見た海'],['any','🥾 ハズレ']];
 return groups.map(([id,n])=>`<optgroup label="${n}">${SPECIES.filter(p=>p.a===id).map(p=>`<option value="${p.id}">${p.n} ${RAR[p.r]}${p.rain?' ☔':''}${p.g?' (採取)':''}</option>`).join('')}</optgroup>`).join('');}
let gmLastSp='iwashi';
function openGM(msg){
 const b=(act,label,cls='')=>`<button class="btn sm ${cls}" data-gma="${act}">${label}</button>`;
 $('#mbox').innerHTML=`<h3>🛠️ GMモード</h3><div class="sub" style="margin-bottom:6px">動作確認用の管理画面です</div><div id="gmMsg" class="sub" style="color:#7ee081;min-height:18px">${msg||''}</div>
 <div class="gmbox">
 <div class="gms">💰 お金（所持 ${fmtG(s.gold)}）</div><div class="row">${b('g1k','+1,000G')}${b('g100k','+10万G')}${b('g10m','+1000万G')}${b('g0','0Gにする','red')}</div>
 <div class="gms">🐟 魚を追加</div>
 <select id="gmSp" class="gmin">${gmSpeciesOptions()}</select>
 <div class="row" style="margin-top:6px"><span class="sub">数</span><input id="gmN" class="gmin" type="number" min="1" max="50" value="1" style="width:64px"><label class="sub"><input id="gmBig" type="checkbox" checked> 最大サイズ</label></div>
 <div class="row">${b('fishBucket','いけすへ追加')}${b('fishTank','今の水槽へ展示')}</div>
 <div class="row">${b('fishRand','ランダム5匹')}${b('dexAll','図鑑を全部登録','gold')}${b('dexClear','図鑑リセット','red')}</div>
 <div class="gms">🌦️ 天気・時間（${s.rain?'☔ 雨':'☀️ 晴れ'}／Day ${s.day}）</div>
 <div class="row">${b('sun','☀️ 晴れ')}${b('rain','☔ 雨')}${b('t6','朝')}${b('t12','昼')}${b('t18','夕方')}${b('t22','夜')}${b('nextDay','▶ 次の日へ')}</div>
 <div class="gms">⛵ 幻の小舟・夢の海（小舟:${s.boat?'あり':'なし'}／夢:${s.dream?'訪問中':'—'}）</div>
 <div class="row">${b('boat','小舟を砂浜に出す')}${b('dreamGo','すぐ夢の海へ','gold')}${b('dreamEnd','夢から覚める')}</div>
 <div class="gms">⭐ 島・設備</div>
 <div class="row">${b('lv1','評価Lv+1')}${b('lv5','評価Lv+5')}${b('areas','全エリア解放')}${b('rod','竿MAX')}${b('baits','餌を全部+10')}${b('tanks','水槽4基・定員MAX')}</div>
 <div class="row">${b('land','埋め立て+1')}${b('landMax','埋立地Lv MAX')}${b('decoAll','装飾を全部置く')}${b('evEnd','イベント終了')}</div>
 <div class="gms">🌪 嵐（${stormStage()||'なし'}／条件:${endgameDone()?'達成':'未達成'}）</div>
 <div class="row">${b('stormWarn','嵐を予報')}${b('stormNow','すぐ大嵐')}${b('stormDmg','すぐ被害')}${b('stormFix','復興完了','gold')}${b('ticket','🎫無料券+1')}</div>
 <div class="gms">🧽 水槽の濁り</div>
 <div class="row">${b('dirty','全水槽を汚す')}${b('cleanAll','全水槽をピカピカ')}</div>
 </div><button class="btn" style="width:100%;margin-top:10px" data-close>閉じる</button>`;
 $('#modal').style.display='flex';
 const sel=$('#gmSp');if(sel)sel.value=gmLastSp;
}
function gmAct(a){
 const sp=SPM[($('#gmSp')||{}).value]||SPM.iwashi,n=clamp(+(($('#gmN')||{}).value)||1,1,50),big=($('#gmBig')||{}).checked;gmLastSp=sp.id;
 const sz=p=>big?p.mx:rollSize(p);let m='✅ 実行しました';
 switch(a){
  case'g1k':s.gold+=1000;break;case'g100k':s.gold+=1e5;break;case'g10m':s.gold+=1e7;break;case'g0':s.gold=0;break;
  case'fishBucket':for(let i=0;i<n;i++)registerCatch(sp,sz(sp));m=`✅ ${sp.n}×${n} をいけすへ`;break;
  case'fishTank':{const t=s.tanks[s.cur];let k=0;if(sp.junk){m='❌ ハズレは展示できません';break;}for(let i=0;i<n&&t.fish.length<t.cap;i++){registerCatch(sp,sz(sp));t.fish.push(s.bucket.pop());k++;}m=`✅ ${sp.n}×${k} を水槽${s.cur+1}へ（定員 ${t.fish.length}/${t.cap}）`;break;}
  case'fishRand':for(let i=0;i<5;i++){const p=SPECIES[Math.floor(Math.random()*SPECIES.length)];registerCatch(p,rollSize(p));}m='✅ ランダムに5匹いけすへ';break;
  case'dexAll':SPECIES.forEach(p=>{if(!s.dex[p.id])s.dex[p.id]={c:1,max:p.mx};});s.dreamVisited=true;m='✅ 図鑑を全部登録しました';break;
  case'dexClear':s.dex={};s.dreamVisited=false;m='✅ 図鑑をリセットしました';break;
  case'sun':s.rain=false;break;case'rain':s.rain=true;break;
  case't6':s.time=0;break;case't12':s.time=.25;break;case't18':s.time=.5;break;case't22':s.time=16/24;break;
  case'nextDay':endDay();m=`✅ Day ${s.day} になりました`;break;
  case'boat':s.rain=true;s.boat=true;m='✅ 雨の砂浜に小舟を出しました（島タブ）';break;
  case'dreamGo':s.boat=true;closeModal();boardBoat();afterChange();return;
  case'dreamEnd':if(s.dream){s.dream=false;if(s.area==='dream')s.area='beach';fs.st='idle';}m='✅ 夢から覚めました';break;
  case'lv1':s.rating++;break;case'lv5':s.rating+=5;break;
  case'areas':s.areas=AREAS.map(x=>x.id);break;case'rod':s.rod=ROD_MAX;break;
  case'baits':BAITS.forEach(b=>s.baits[b.id]=(s.baits[b.id]||0)+10);m='✅ 全部の餌を+10';break;
  case'tanks':while(s.tanks.length<4)s.tanks.push({cap:3,fish:[]});s.tanks.forEach(t=>{t.cap=TANK_MAX;ensureDirt(t);});break;
  case'land':if(s.land<LAND.length){s.landLv[s.land]=1;addLandSlots(s.land,1);s.land++;}break;
  case'landMax':for(let i=0;i<s.land;i++)while(landLv(i)<LAND_LV_MAX){const lv=landLv(i);s.landLv[i]=lv+1;addLandSlots(i,lv+1);}break;
  case'decoAll':for(const d of DECOS)while((s.deco[d.id]||0)<d.max&&placeDeco(d.id));m=`✅ 区画 ${decoUsed()}/${slotCount()} まで配置`;break;
  case'evEnd':if(s.event){s.event.left=0.001;}break;
  case'stormWarn':s.storm={stage:'warn'};s.rain=true;m='✅ 今日は大雨、明日が大嵐です';break;
  case'stormNow':s.storm={stage:'storm'};s.rain=true;m='✅ 大嵐になりました（休業中）';break;
  case'stormDmg':s.storm={stage:'storm'};stormDamage();s.rain=false;m=`✅ 被害が発生（復興${repairList().length}件）`;break;
  case'stormFix':if(s.storm&&stormStage()==='damage'){for(const it of repairList()){s.gold+=it.c;fixItem(it.k);}}else s.storm=null;m='✅ 復興完了にしました';break;
  case'ticket':s.freeEv=(s.freeEv||0)+1;m=`✅ 無料券 ${s.freeEv}枚`;break;
  case'dirty':s.tanks.forEach(t=>{ensureDirt(t);t.dirt.fill(90);});break;
  case'cleanAll':s.tanks.forEach(t=>{ensureDirt(t);t.dirt.fill(0);});break;
 }
 afterChange();openGM(m);
}
$('#mbox').addEventListener('click',e=>{
 if(e.target.closest('[data-yes]')){const cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();return;}
 if(e.target.closest('[data-gmok]')){checkCode();return;}
 const g=e.target.closest('[data-gma]');if(g)gmAct(g.dataset.gma);
});

// ===================== セーブ/ロード =====================
function save(){s.last=Date.now();for(const t of s.tanks)if(t.dirt)t.dirt=t.dirt.map(v=>Math.round(v*10)/10);try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1){const n=newState();d.b=Object.assign(n.b,d.b||{});if(!d.landLv)d.landLv=[];d.baits=Object.assign({shrimp:30},d.baits||{});if(!d.bait)d.bait='shrimp';if(d.decoList)for(const dd of DECOS)if(dd.lvl){let f=-1;d.decoList.forEach((x,i)=>{if(x===dd.id){if(f<0)f=i;else d.decoList[i]=null;}});if(d.deco&&d.deco[dd.id])d.deco[dd.id]=Math.min(dd.max,d.deco[dd.id]);}(d.tanks||[]).forEach(ensureDirt);return Object.assign(n,d);}}catch(e){}return null;}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

// ===================== ループ =====================
let lastT=performance.now();
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;T+=dt;
 updateEconomy(dt);updateDirt(dt);updateEvent(dt);if(gatherCd>0)gatherCd-=dt;
 recalcT-=dt;if(recalcT<=0){recalcT=1;recalc();}
 if(thunder>0)thunder-=dt;else if(s.rain&&Math.random()<dt*.04){thunder=.35;if(tab==='fish')log('⚡ ゴロゴロ…');}
 if(stormStage()==='storm'&&thunder<=0&&Math.random()<dt*.35)thunder=.3;
 if(tab==='tank')updateTank(dt);
 if(tab==='fish'||fs.st!=='idle')updateFishing(dt);
 if(tab==='dex'){for(const b of bubbles){b.y-=b.v*dt;if(b.y<-10){b.y=H+10;b.x=rand(0,W);}}}
 ctx.clearRect(0,0,W,H);
 if(spa){updateSpa(dt);drawSpa();}else if(cafe){updateCafe(dt);drawCafe();}else if(tab==='tank')drawTank();else if(tab==='fish')drawFishing();else if(tab==='island')drawIsland();else drawDexBg();
 topT-=dt;if(topT<=0){topT=.25;updateTop();}
 saveT+=dt;if(saveT>10){saveT=0;save();}
 requestAnimationFrame(loop);
}
// 起動
resize();recalc();
(function offline(){const el=Math.min(7200,(Date.now()-(s.last||Date.now()))/1000);if(el>60){updateDirt(el*.5);recalc();}
 if(el>60&&APPEAL>0){const g=Math.round(visRate()*.6*ticket()*el*.4);s.gold+=g;log(`🌙 留守の間に観光客が来ていた！ +${fmtG(g)}`,'#ffd166');}})();
if(!s.totalVis&&!Object.keys(s.dex).length)setTimeout(()=>log('🌴 ようこそ無人島へ！まずは「🎣釣り場」で魚を釣ってみよう'),300);
(function migrateHotel(){const n=s.decoList.filter(x=>x==='hotel').length,own=s.deco.hotel||0;if(own>n){let short=own-n;while(short>0){const i=freeSlot();if(i<0)break;s.decoList[i]='hotel';short--;}
 if(short>0){s.deco.hotel=own-short;const g=Math.round(400000*short);s.gold+=g;log(`🏨 ホテルの仕様変更のため、置けなかった${short}棟分 ${fmtG(g)} を返金しました`,'#ffd166');}save();}})();
renderPanel();updateTop();requestAnimationFrame(loop);
</script>
