<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏝️ Aqua Island 〜無人島アクアリウム〜</title>
<style>
:root{--bg:#062a3e;--panel:#0b3a52;--card:#11506e;--acc:#4fd1c5;--gold:#ffd166;--txt:#e8f7ff;--sub:#9cc7da}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:#073246 linear-gradient(#04202f,#073246) fixed;color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
#top{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 8px 4px;position:sticky;top:0;background:rgba(4,32,47,.96);z-index:5}
.stat{background:var(--panel);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;line-height:1.3;color:var(--sub)}
.stat b{display:block;font-size:14px;color:var(--gold);white-space:nowrap}
#dayBar{grid-column:1/-1;height:4px;background:#0b3a52;border-radius:2px;overflow:hidden}
#dayFill{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff8fab,#7b6cff)}
#tabs{display:flex;gap:4px;padding:4px 8px 0}
.tab{flex:1;padding:9px 2px;border:none;border-radius:10px 10px 0 0;background:var(--panel);color:var(--sub);font-size:12.5px;font-weight:bold;font-family:inherit}
.tab.on{background:var(--card);color:#fff}
#stage{position:relative;margin:0 8px;border-top:3px solid var(--card)}
canvas#cv{display:block;width:100%;height:min(50vh,420px);border-radius:0 0 12px 12px;background:#000;touch-action:manipulation}
#log{position:absolute;left:6px;top:6px;right:6px;pointer-events:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.msg{background:rgba(0,18,30,.72);padding:3px 9px;border-radius:8px;font-size:12px;transition:opacity .8s;max-width:92%;border-left:3px solid var(--acc)}
#panel{padding:8px 8px 40px;flex:1}
.btn{border:none;border-radius:10px;padding:10px 12px;background:var(--acc);color:#04202f;font-weight:bold;font-size:14px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn:disabled{background:#2e5568;color:#7fa2b2}
.btn.sm{padding:6px 9px;font-size:12px}
.btn.gold{background:var(--gold)}
.btn.red{background:#ff7b8a}
.btn.ghost{background:var(--card);color:var(--txt)}
.btn.on{outline:2px solid #fff}
.btn.big{flex:1;padding:14px;font-size:16px}
.btn.gold:disabled,.btn.red:disabled,.btn.ghost:disabled{background:#2e5568;color:#7fa2b2}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.card{background:var(--panel);border-radius:12px;padding:10px;margin-bottom:8px}
h3{margin:2px 0 8px;font-size:14.5px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.item{background:var(--card);border-radius:10px;padding:6px;display:flex;gap:6px;align-items:center;font-size:12px}
.item .info{flex:1;min-width:0}
.item .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:48px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.th img{max-width:48px;max-height:30px}
.th .em{font-size:24px;line-height:1}
.unk{filter:brightness(0) opacity(.45)}
.up{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:6px}
.up .ic{font-size:26px;width:34px;text-align:center}
.up .info{flex:1;font-size:12px}
.up .info b{font-size:13.5px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.dc{background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;border:2px solid transparent}
.dc .th{margin:0 auto 3px;width:64px;height:40px}
.dc .th img{max-width:64px;max-height:40px}
.dc .th .em{font-size:30px}
.prog{height:8px;background:#062a3e;border-radius:4px;overflow:hidden;margin-top:4px}
.prog div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
.mbox{background:var(--panel);border-radius:16px;padding:16px;width:min(90vw,360px);text-align:center}
.mbox .th{width:150px;height:90px;margin:4px auto 8px}
.mbox .th img{max-width:150px;max-height:90px}
.mbox .th .em{font-size:64px}
.mbox table{width:100%;font-size:13px;margin:8px 0;text-align:left}
.mbox{max-height:88vh;overflow-y:auto}
.gmin{width:100%;padding:9px;border-radius:8px;border:1px solid #2e6a88;background:#062a3e;color:#fff;font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
.cafeHead{background:linear-gradient(135deg,#3a2216,#7a4a2a);border-radius:14px;padding:12px;text-align:center;color:#ffe8c0;margin-bottom:8px;border:1px solid #c89a5a}
.cafeTitle{font-family:"Brush Script MT","Snell Roundhand",Georgia,serif;font-style:italic;font-size:28px;color:#fff3dc;letter-spacing:1px}
.cafeOpt{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#f6ead6,#e4cca8);color:#3a2216;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #c89a5a;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cafeOpt:active{transform:scale(.98)}.ringSw{position:relative;flex:none;width:52px;height:28px;border-radius:14px;background:#b8a898;transition:.2s;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}.ringSw .rkn{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.ringSw .rsl{position:absolute;right:8px;top:4px;font-size:13px;color:#fff;font-weight:bold;opacity:.7}.ringSw.on{background:#2aa8a0}.ringSw.on .rkn{left:27px}.ringSw.on .rsl{right:auto;left:8px;opacity:1;border:none}.cafeOpt .ci{font-size:30px;width:44px;text-align:center}.cafeOpt b{font-size:15px}.sub2{font-size:12px;opacity:.8;line-height:1.5}
.cafeMenu{background:linear-gradient(180deg,#fbf3e4,#efdcbc)!important;color:#3a2216}.cafeMenu .mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed #c8a878}
.gmbox{text-align:left}.gms{font-weight:bold;font-size:13px;margin:10px 0 5px;color:var(--gold)}
[data-gm],[data-tab=dex]{-webkit-touch-callout:none;touch-action:none}
.mbox td:first-child{color:var(--sub);width:40%}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat">所持金<b id="sG">0G</b></div>
    <div class="stat"><span id="sW">日付</span><b id="sD">Day 1</b></div>
    <div class="stat">観光客<b id="sV">0人</b></div>
    <div class="stat">島の評価<b id="sR">Lv1</b></div>
    <div id="dayBar"><div id="dayFill"></div></div>
  </div>
  <div id="tabs">
    <button class="tab on" data-tab="tank">🐠 水槽</button>
    <button class="tab" data-tab="fish">🎣 釣り場</button>
    <button class="tab" data-tab="island">🏝️ 島・設備</button>
    <button class="tab" data-tab="dex">📖 図鑑</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="log"></div></div>
  <div id="panel"></div>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
// ===================== データ =====================
const AREAS=[
 {id:'beach',n:'浅瀬',ic:'🏖️',cost:0,req:1,w:['#62d4e8','#0c6f93']},
 {id:'reef',n:'サンゴ礁',ic:'🐠',cost:600,req:2,w:['#48e0cf','#0b5f86']},
 {id:'open',n:'沖合',ic:'🌊',cost:2500,req:3,w:['#2d8fd0','#0a3768']},
 {id:'deep',n:'深海',ic:'🌑',cost:9000,req:5,w:['#1b4a7c','#01060f']},
];
const AREAM={};AREAS.forEach(a=>AREAM[a.id]=a);
const DREAM={id:'dream',n:'夢で見た海',ic:'🌙',w:['#e8d8ff','#f6d6ec']};AREAM.dream=DREAM;
const DREAM_WAIT=[0,5.6,4.5,3.5,2.7,1.85,1.2,1.05,.95,.85,.75];  // 竿Lvごとの「夢で見た海」の待ち時間倍率
const BOAT_CHANCE=.06;                      // 雨の日に幻の小舟が現れる確率
const RAR=['','★','★★','★★★','★★★★','★★★★★','🌈幻★6'];
const RCOL=['','#cfd8dc','#7ee081','#5ab0ff','#c98bff','#ffcf40','#ff6bd6'];
const WAIT_MULT=[1,1.35,1.75,2.2];      // エリアが深いほど魚がかかるまで遅い
const RAIN_CHANCE=[0,.1,.2,.3];        // 解放エリア数に応じた雨の確率
const TANK_BASE=[80,300,900,2500];     // 解放エリア数に応じた水槽拡張の基本価格
const S=(id,n,a,r,ap,mn,mx,o,d)=>Object.assign({id,n,a,r,ap,mn,mx,d},o);
const SPECIES=[
// ---- 浅瀬 ----
S('iwashi','マイワシ','beach',1,3,10,22,{c1:'#dfeaf2',c2:'#2f5f8f',h:.3,pat:'dots',tail:'fork'},'体の横に黒い点が並ぶ小魚。大きな群れをつくって外敵から身を守る。'),
S('kisu','シロギス','beach',1,5,15,30,{c1:'#f4efe4',c2:'#c9b98f',h:.24,pat:'none',tail:'square',dor:'double'},'砂地にすむ上品な白身魚。その美しさから「海の女王」とも呼ばれる。'),
S('aji','マアジ','beach',1,4,15,40,{c1:'#e3ead2',c2:'#5f7f55',h:.33,pat:'line',tail:'fork',dor:'double'},'体の側面に「ぜいご」という硬いウロコの列をもつ。食卓でもおなじみ。'),
S('haze','マハゼ','beach',1,4,8,20,{c1:'#d6c8a6',c2:'#7a6646',h:.26,pat:'spots'},'河口や浅い砂地にすむ。秋のハゼ釣りは昔からの風物詩。'),
S('suzume','スズメダイ','beach',1,4,5,12,{c1:'#56688a',c2:'#28324a',h:.5,pat:'none',tail:'fork',dor:'long'},'岩場で群れる小さな魚。地味な色だが、よく見ると青く光る。'),
S('mejina','メジナ','beach',1,5,15,40,{c1:'#46596a',c2:'#1d2a35',h:.45,pat:'scales',tail:'square'},'磯釣りの人気ターゲット。「グレ」とも呼ばれ、引きが強い。'),
S('kawahagi','カワハギ','beach',2,9,12,30,{c1:'#e0cfa2',c2:'#8b6a3a',h:.62,pat:'spots'},'おちょぼ口でエサだけをかすめ取る、釣り人泣かせの「エサ取り名人」。'),
S('harisen','ハリセンボン','beach',2,13,15,35,{shape:'puffer',c1:'#e6d49a',c2:'#5a4a2a'},'驚くと水を吸って体をふくらませ、トゲを立てて身を守る。'),
S('kasago','カサゴ','beach',2,10,10,30,{c1:'#c0392b',c2:'#6e1b14',h:.42,pat:'spots',bigEye:1,tail:'round',dor:'spiny'},'岩のすき間でじっと獲物を待つ。ゴツゴツした見た目だが味は絶品。'),
S('mebaru','メバル','beach',2,9,15,30,{c1:'#8a6a55',c2:'#4a3528',h:.42,pat:'vstripe',bigEye:1,tail:'square',dor:'spiny'},'大きな目が名前の由来（目張る）。夜になると活発に泳ぐ。'),
S('karei','マコガレイ','beach',2,11,15,45,{c1:'#b9a27e',c2:'#6b5638',h:.62,pat:'spots',tail:'round',dor:'long'},'平たい体で砂にまぎれる。成長すると両目が体の右側に寄る。'),
S('ishidai','イシダイ','beach',2,14,20,60,{c1:'#e8e2d0',c2:'#222222',h:.55,pat:'vstripe',dor:'spiny'},'白黒のしま模様が目印。硬い歯でサザエの殻もかみ砕く。'),
S('madai','マダイ','beach',3,28,30,90,{c1:'#ff7a8a',c2:'#5ab0ff',h:.5,pat:'bluedots',tail:'fork',dor:'spiny'},'「魚の王様」と呼ばれるおめでたい魚。体には青い点が散らばる。'),
S('hirame','ヒラメ','beach',3,26,30,90,{c1:'#a8916a',c2:'#5b4628',h:.6,pat:'spots',tail:'round',dor:'long'},'カレイとは逆に、目が体の左側にある。砂に潜って獲物を狙う。'),
S('hata','キジハタ','beach',3,24,20,50,{c1:'#c96f3a',c2:'#ff9a5a',h:.4,pat:'spots',tail:'round',dor:'spiny'},'オレンジの斑点が美しい高級魚。関西では「アコウ」と呼ばれる。'),
S('tatsu','タツノオトシゴ','beach',3,30,5,15,{shape:'seahorse',c1:'#f2b84b',c2:'#c47a1a'},'馬のような顔をした魚の仲間。オスがお腹の袋で赤ちゃんを育てる。'),
S('ei','アカエイ','beach',3,32,40,150,{shape:'ray',c1:'#a0705a',c2:'#5e3c2c'},'ひらひらと海底を飛ぶように泳ぐ。尾には毒のトゲがある。'),
S('kue','クエ','beach',4,60,60,130,{c1:'#6b5a4a',c2:'#3a2e24',h:.42,pat:'saddle',tail:'round',dor:'spiny'},'岩礁の主ともいえる大型のハタ。幻の高級魚として知られる。'),
// ---- 浜辺の採取 ----
S('kani','イソガニ','beach',1,4,3,8,{shape:'crab',c1:'#c0503a',c2:'#7a2a1a',g:1,bottom:1},'磯の岩のすき間にすむ小さなカニ。横歩きでちょこちょこ動き回る。'),
S('hitode','イトマキヒトデ','beach',1,3,5,15,{shape:'star',c1:'#ff8a3a',c2:'#3a5ad8',g:1,bottom:1},'糸巻きのような形のヒトデ。腕が切れても再生する力をもつ。'),
S('namako','マナマコ','beach',1,4,10,30,{shape:'slug',c1:'#6a5a3a',c2:'#3d3220',g:1,bottom:1},'海底の砂を食べてきれいにする「海の掃除屋」。'),
S('yado','ヤドカリ','beach',2,7,2,10,{shape:'hermit',c1:'#e8cba0',c2:'#d0402a',g:1,bottom:1},'貝殻をお家にして暮らす。成長すると大きな貝殻へお引っ越し。'),
S('kuruma','クルマエビ','beach',2,10,10,25,{shape:'shrimp',c1:'#d8c0a0',c2:'#4a3a5a',band:1,g:1,bottom:1},'体を丸めると縞模様が車輪のように見えることが名前の由来。'),
S('uni','ムラサキウニ','beach',2,8,4,8,{shape:'urchin',c1:'#4b2a5a',c2:'#2a1033',g:1,bottom:1},'トゲをゆっくり動かして歩く。海藻を食べる磯の住人。'),
S('ebi','イセエビ','beach',3,22,15,35,{shape:'shrimp',c1:'#a83a2a',c2:'#f0d0a0',lob:1,g:1,bottom:1},'長いヒゲが立派な高級エビ。夜になると岩陰から出てくる。'),
S('sakura','サクラガイ','beach',3,18,1,3,{shape:'bivalve',c1:'#ffc0cb',c2:'#ff8fab',g:1,bottom:1,kind:'sakura',sz:.55},'桜の花びらのような薄ピンクの貝殻。浜辺で見つかると幸運のしるし。'),
S('shinju','アコヤガイ','beach',4,50,5,10,{shape:'bivalve',c1:'#e8e0d0',c2:'#b8a890',g:1,bottom:1,pearl:1,kind:'akoya',sz:.95},'貝の中で真珠を育てる。ごくまれに大粒の真珠を抱いている。'),
// ---- サンゴ礁 ----
S('deba','デバスズメダイ','reef',1,5,4,8,{c1:'#7fe3e0',c2:'#3fb8b5',h:.5,pat:'none',tail:'fork'},'エメラルド色の小魚。危険を感じるとサンゴの枝の間に逃げ込む。'),
S('sora','ソラスズメダイ','reef',1,6,4,8,{c1:'#2f6bff',c2:'#1a3fb0',h:.48,pat:'none',tc:'#ffd23f',tail:'fork'},'空のような青い体と黄色い尾びれ。サンゴ礁の彩り役。'),
S('kumanomi','カクレクマノミ','reef',2,15,5,11,{c1:'#ff8a2b',c2:'#ffffff',h:.46,pat:'band'},'イソギンチャクと共生するオレンジの人気者。水族館の大スター。'),
S('chou','チョウチョウウオ','reef',2,14,10,22,{c1:'#ffe14d',c2:'#2b2b2b',h:.82,pat:'eyebar',tail:'square'},'尾の近くの黒い点は「ニセの目」。敵に頭の位置をごまかす作戦。'),
S('hanadai','キンギョハナダイ','reef',2,12,6,12,{c1:'#ff8c42',c2:'#c95a20',h:.42,pat:'none',tc:'#ff4f9a',tail:'lunate'},'オレンジ色の群れでサンゴ礁を彩る。成長するとメスがオスに変わる。'),
S('tsuno','ツノダシ','reef',2,16,10,20,{c1:'#ffe14d',c2:'#111111',h:.85,pat:'vstripe',dor:'tall'},'長く伸びた背びれがチャームポイント。白黒黄色のおしゃれな魚。'),
S('hako','ハコフグ','reef',2,14,8,20,{c1:'#ffd23f',c2:'#333333',h:.7,pat:'dots'},'体が硬い骨の箱で覆われている。小さなヒレで一生懸命泳ぐ。'),
S('iro','イロブダイ','reef',2,15,30,60,{c1:'#3ad0a0',c2:'#ff6fa8',h:.42,pat:'scales',tail:'lunate'},'夜は自分で作った粘液の膜に包まって眠る。'),
S('nanyo','ナンヨウハギ','reef',3,24,12,30,{c1:'#2457e6',c2:'#ffd23f',h:.55,pat:'tang',tail:'lunate'},'鮮やかな青い体に黄色い尾びれ。尾の付け根には鋭いトゲがある。'),
S('tako','マダコ','reef',3,28,30,80,{shape:'octo',c1:'#c8584a',c2:'#f0c0b0',bottom:1},'とても頭が良く、ビンのフタを開けることも。体の色を自在に変える。'),
S('nishiki','ニシキヤッコ','reef',3,28,15,25,{c1:'#ffcf33',c2:'#2f5bd8',h:.65,pat:'vstripe'},'黄色と青の縞が錦のように美しいキンチャクダイの仲間。'),
S('mino','ミノカサゴ','reef',3,34,15,35,{c1:'#ffb3a3',c2:'#8a1a1a',h:.5,pat:'vstripe',wing:1},'大きなヒレを広げて優雅に泳ぐ。トゲには毒がある。'),
S('mongara','モンガラカワハギ','reef',3,30,20,40,{c1:'#20202e',c2:'#ffd23f',h:.58,pat:'ws',tc:'#ffd23f',tail:'lunate',dor:'square'},'お腹の白い水玉模様が派手な、サンゴ礁のおしゃれさん。'),
S('utsubo','ハナヒゲウツボ','reef',3,30,60,120,{shape:'eel',c1:'#2a5bd8',c2:'#ffd23f'},'青と黄色の鮮やかなウツボ。成長につれて黒→青→黄と色が変わる。'),
S('kame','アオウミガメ','reef',4,65,60,120,{shape:'turtle',c1:'#7a8a5a',c2:'#5a6a3a'},'海藻を食べるおだやかなウミガメ。何十年も生きる長寿の生き物。'),
S('napoleon','メガネモチノウオ','reef',4,70,60,200,{c1:'#3aa58a',c2:'#1f6a5a',h:.5,pat:'wave'},'通称ナポレオンフィッシュ。おでこのコブが帽子のように見える。'),
S('manta','マンタ','reef',5,190,300,700,{shape:'ray',c1:'#2a3442',c2:'#e8eef4'},'翼を広げると7mにもなる巨大なエイ。ゆったり舞う姿は圧巻。'),
// ---- 沖合 ----

const thumbCache={};
function thumb(sp,unk){

 if(sp.e)return`<div class="th"><span class="em${cls}">${sp.e}</span></div>`;
 if(!thumbCache[sp.id]){const oc=document.createElement('canvas');oc.width=192;oc.height=120;const c=oc.getContext('2d');c.translate(96,60);
  let L=130;if(sp.bill){L=118;c.translate(-22,0);}if(sp.sail){L=105;c.translate(0,25);}if(sp.wing)L=115;if(sp.shape==='wingfish'){L=sp.big?82:92;c.translate(0,20);}if(sp.shape==='dopa'){L=96;c.translate(-6,2);}if(sp.shape==='birdfish'){L=104;c.translate(-12,sp.peacock?10:0);}if(sp.hammer)L=120;
  const TL={bivalve:105,scallop:112,nautilus:120,snail:115,puffer:118,crab:118,star:112,hermit:118,shrimp:135,octo:118,turtle:140,squid:150,junk:120,eel:175,seahorse:112,ray:150,urchin:112,slug:160,isopod:150,clione:100,shell:118};if(TL[sp.shape])L=TL[sp.shape];if(sp.shape==='shell')c.translate(0,22);if(sp.shape==='isopod')c.translate(-10,10);
  if(sp.shape==='manbou')L=95;if(sp.shape==='long')L=180;if(sp.shape==='jelly'){L=100;c.translate(0,-15);}if(sp.shape==='menda')L=110;if(sp.shape==='angler'){L=110;c.translate(-12,12);}
  drawCreature(c,sp,L,0.6,0,1);thumbCache[sp.id]=oc.toDataURL();}
 return`<div class="th"><img class="${cls}" src="${thumbCache[sp.id]}"></div>`;

function registerCatch(sp,size){

 if(!d)s.dex[sp.id]={c:1,max:size};else{d.c++;if(size>d.max){d.max=size;record=true;}}
 if(isNew)addXp(5*sp.r);

}

function fishAppeal(f){const p=SPM[f.s],k=clamp((f.z-p.mn)/(p.mx-p.mn),0,1);return p.ap*(.8+.5*k);}
function tankTheme(i){const t=s.tanks[i];if(t&&t.dream)return DREAM;let k=0;for(let j=0;j<i;j++)if(!s.tanks[j].dream)k++;return AREAS[Math.min(k,3)];}
function normalTanks(){return s.tanks.filter(t=>!t.dream).length;}
const DREAM_TANK_COST=1500000;
function tankAppeal(t,i){
 const th=tankTheme(i).id,cnt={},tiers=new Set();let base=0,match=0,star=0,neu=0;
 for(const f of t.fish){const p=SPM[f.s];cnt[f.s]=(cnt[f.s]||0)+1;let v=fishAppeal(f)*[1,.6,.4,.3,.25][Math.min(4,cnt[f.s]-1)];
  if(p.a==='dream'){if(th==='dream'){v*=1.2;match++;}else{neu++;}}else if(p.a===th){v*=1.25;match++;}else v*=.8;base+=v;tiers.add(p.r);if(p.r>=4)star++;}
 const n=t.fish.length,uniq=Object.keys(cnt).length,variety=uniq*.05,eco=Math.max(0,tiers.size-1)*.12,unity=n>=3&&match>0&&match+neu===n?.2:0,jam=n>=3&&star/n>.5?-.25:0,dirt=tankDirt(t);
 const deco=tankDecoBonus(t),mul=Math.max(.1,1+variety+eco+unity+jam+deco);
 return{base,n,uniq,tiers:tiers.size,match,variety,eco,unity,jam,deco,dirt,mul,total:base*mul*(1-.6*dirt)};}
function curEvent(){return s.event&&s.event.left>0?EVM[s.event.id]:null;}
function evApp(){const e=curEvent();return e?e.app:1;}
function evVis(){const e=curEvent();return e?e.vis:1;}
let APPEAL_BASE=0;
function recalc(){mRecalc();let a=0;s.tanks.forEach((t,i)=>a+=tankAppeal(t,i).total);APPEAL_BASE=a;APPEAL=a*evApp()*stormApp();}
function evReqOk(e){for(const k in e.req){const v=e.req[k];if(k==='_pier'&&!s.b.pier)return false;if(k==='_lighthouse'&&!s.b.lighthouse)return false;if(k==='_rating'&&s.rating<v)return false;if(k==='_land'&&s.land<v)return false;if(k[0]!=='_'&&(s.deco[k]||0)<v)return false;}return true;}
function evReqText(e){return Object.entries(e.req).map(([k,v])=>{const ok=k==='_pier'?s.b.pier:k==='_lighthouse'?s.b.lighthouse:k==='_rating'?s.rating>=v:k==='_land'?s.land>=v:(s.deco[k]||0)>=v;
 const n=k==='_pier'?'⚓桟橋':k==='_lighthouse'?'💡灯台':k==='_rating'?`⭐評価Lv${v}`:k==='_land'?`🏗️埋め立て${v}段階`:`${DECOM[k].ic}${DECOM[k].n}${v>1?'×'+v:''}`;return`${ok?'✅':'🔒'}${n}`;}).join(' ');}
function avgTM(night){let a=0;for(let i=0;i<24;i++){const h=i+.5;a+=night&&(h>=19||h<6)?.95:timeMult(h);}return a/24;}
function estDaily(e){const A=APPEAL_BASE*(e?e.app:1);if(A<=0)return 0;const tk=Math.round(4+Math.sqrt(A)*1.2+s.rating*1.5)+cafeLv()*4+shopIncome();
 const vr=(.1+Math.sqrt(A)/40)*(1+.12*cottLv())*(lhOn()?1.15:1)*(s.rain?.7:1)*(1+nigiwai()/100)*dirtVisMul()*(e?e.vis:1);
 let tm=0;for(let i=0;i<24;i++){const h=i+.5;tm+=e&&e.night&&(h>=19||h<6)?.95:(h>=9&&h<19?1:h>=6&&h<9?.5:h>=19&&h<22?.6:.15);}return vr*(tm/24)*DAY_SEC*tk;}
function eventCost(e){return Math.round((e.min+Math.max(0,estDaily(e)-estDaily(null))*e.days*1.2)/100)*100;}
function startEvent(id){const e=EVM[id];if(s.storm){log('🌪 嵐の影響で、今はイベントを開催できない…');return;}const tvf=id==='tv'&&s.tvq===1;if(curEvent()||(!tvf&&!evReqOk(e)))return;const free=!!e.special||tvf;if(free&&!tvf&&!(s.freeEv>0))return;const c=free?0:eventCost(e);if(s.gold<c)return;
 if(tvf)s.tvq=2;else if(free)s.freeEv--;s.gold-=c;s.event={id,left:e.days*DAY_SEC,cost:c,inc:0};recalc();log(`${e.ic} ${e.n} 開催！（${e.days}日間・${tvf?'📺 特別取材のため無料':free?'🎫 無料券を使用':'開催費 -'+fmtG(c)}）`,'#ff9ad5');if(e.instant)log('🎣 今日は投げた瞬間に魚が食いつく！釣り場へ急げ！','#ffd166');addXp(10*e.days);}

function nigiwai(){const st=s.storm&&s.storm.debris||{};let b=0;for(let i=0;i<s.land;i++)if(!st['l'+i])b+=10;const a=activeDeco();for(const id in a)b+=(DECOM[id]?DECOM[id].b:0)*a[id];return Math.round(b);}

 <div class="row">${b('land','埋め立て+1')}${b('landMax','埋立地Lv MAX')}${b('decoAll','装飾を全部置く')}${b('evEnd','イベント終了')}</div>
 <div class="gms">🌪 嵐（${stormStage()||'なし'}／条件:${endgameDone()?'達成':'未達成'}）</div>
 <div class="row">${b('stormWarn','嵐を予報')}${b('stormNow','すぐ大嵐')}${b('stormDmg','すぐ被害')}${b('stormFix','復興完了','gold')}${b('ticket','🎫無料券+1')}</div>
 <div class="gms">🧽 水槽の濁り</div>
 <div class="row">${b('dirty','全水槽を汚す')}${b('cleanAll','全水槽をピカピカ')}</div>
 </div><button class="btn" style="width:100%;margin-top:10px" data-close>閉じる</button>`;
 $('#modal').style.display='flex';
 const sel=$('#gmSp');if(sel)sel.value=gmLastSp;
}
function gmAct(a){
 const sp=SPM[($('#gmSp')||{}).value]||SPM.iwashi,n=clamp(+(($('#gmN')||{}).value)||1,1,50),big=($('#gmBig')||{}).checked;gmLastSp=sp.id;
 const sz=p=>big?p.mx:rollSize(p);let m='✅ 実行しました';
 switch(a){
  case'g1k':s.gold+=1000;break;case'g100k':s.gold+=1e5;break;case'g10m':s.gold+=1e7;break;case'g0':s.gold=0;break;
  case'fishBucket':for(let i=0;i<n;i++)registerCatch(sp,sz(sp));m=`✅ ${sp.n}×${n} をいけすへ`;break;
  case'fishTank':if(inMain()){const t=mTank(s.ctank);let k=0;if(sp.junk){m='❌ ハズレは展示できません';break;}for(let i=0;i<n&&t.fish.length<t.cap;i++){registerCatch(sp,sz(sp));const f=s.mbucket.pop();t.fish.push(f);s.don[f.s]=1;k++;}if(sp.a==='izumi'&&!s.nekoQ)s.nekoQ=1;mRecalc();m=`✅ ${sp.n}×${k} を${MAREAM[s.ctank].n}の水槽へ（定員 ${t.fish.length}/${t.cap}）`;break;}
  {const t=s.tanks[s.cur];let k=0;if(sp.junk){m='❌ ハズレは展示できません';break;}for(let i=0;i<n&&t.fish.length<t.cap;i++){registerCatch(sp,sz(sp));t.fish.push(s.bucket.pop());k++;}m=`✅ ${sp.n}×${k} を水槽${s.cur+1}へ（定員 ${t.fish.length}/${t.cap}）`;break;}
  case'fishRand':for(let i=0;i<5;i++){const p=SPECIES[Math.floor(Math.random()*SPECIES.length)];registerCatch(p,rollSize(p));}m='✅ ランダムに5匹いけすへ';break;
  case'dexAll':if(gmDexMain()){MSPECIES.forEach(p=>{if(!s.dex[p.id])s.dex[p.id]={c:1,max:p.mx};});m='✅ 大陸の図鑑を全部登録しました';}else{SPECIES.forEach(p=>{if(!s.dex[p.id])s.dex[p.id]={c:1,max:p.mx};});s.dreamVisited=true;m='✅ 島の図鑑を全部登録しました';}break;
  case'dexClear':if(gmDexMain()){MSPECIES.forEach(p=>delete s.dex[p.id]);s.don={};m='✅ 大陸の図鑑をリセットしました';}else{SPECIES.forEach(p=>delete s.dex[p.id]);s.dreamVisited=false;m='✅ 島の図鑑をリセットしました';}break;
  case'sun':s.rain=false;break;case'rain':s.rain=true;break;
  case't6':s.time=0;break;case't12':s.time=.25;break;case't18':s.time=.5;break;case't22':s.time=16/24;break;
  case'nextDay':endDay();m=`✅ Day ${s.day} になりました`;break;
  case'boat':s.rain=true;s.boat=true;m='✅ 雨の砂浜に小舟を出しました（島タブ）';break;
  case'dreamGo':s.boat=true;closeModal();boardBoat();afterChange();return;
  case'dreamEnd':if(s.dream){s.dream=false;if(s.area==='dream')s.area='beach';fs.st='idle';}m='✅ 夢から覚めました';break;
  case'lv1':s.rating++;break;case'lv5':s.rating+=5;break;
  case'areas':s.areas=AREAS.map(x=>x.id);break;case'tvfree':s.tvq=1;break;case'mainunlock':s.tvq=3;s.invite=1;break;case'mareas':s.mareas=MAREAS.map(x=>x.id);break;case'spirit':s.spirit=true;s.rain=false;break;case'nekoQ':s.nekoQ=1;break;case'izumiEnd':if(s.izumi){s.izumi=false;if(s.area==='izumi')s.area=s.marea||'pond';fs.st='idle';}break;case'nekoMax':s.neko=NEKO_MAX;s.nekoQ=2;break;case'izumiGo':if(inMain()){s.spirit=true;followSpirit();}break;case'rod':s.rod=ROD_MAX;break;
  case'baits':BAITS.forEach(b=>s.baits[b.id]=(s.baits[b.id]||0)+10);m='✅ 全部の餌を+10';break;
  case'tanks':while(s.tanks.length<4)s.tanks.push({cap:3,fish:[]});s.tanks.forEach(t=>{t.cap=TANK_MAX;ensureDirt(t);});break;
  case'land':if(s.land<LAND.length){s.landLv[s.land]=1;addLandSlots(s.land,1);s.land++;}break;
  case'landMax':for(let i=0;i<s.land;i++)while(landLv(i)<LAND_LV_MAX){const lv=landLv(i);s.landLv[i]=lv+1;addLandSlots(i,lv+1);}break;
  case'decoAll':for(const d of DECOS)while((s.deco[d.id]||0)<d.max&&placeDeco(d.id));m=`✅ 区画 ${decoUsed()}/${slotCount()} まで配置`;break;
  case'evEnd':if(s.event){s.event.left=0.001;}break;
  case'stormWarn':s.storm={stage:'warn'};s.rain=true;m='✅ 今日は大雨、明日が大嵐です';break;
  case'stormNow':s.storm={stage:'storm'};s.rain=true;m='✅ 大嵐になりました（休業中）';break;
  case'stormDmg':s.storm={stage:'storm'};stormDamage();s.rain=false;m=`✅ 被害が発生（復興${repairList().length}件）`;break;
  case'stormFix':if(s.storm&&stormStage()==='damage'){for(const it of repairList()){s.gold+=it.c;fixItem(it.k);}}else s.storm=null;m='✅ 復興完了にしました';break;
  case'ticket':s.freeEv=(s.freeEv||0)+1;m=`✅ 無料券 ${s.freeEv}枚`;break;
  case'dirty':s.tanks.forEach(t=>{ensureDirt(t);t.dirt.fill(90);});break;
  case'cleanAll':s.tanks.forEach(t=>{ensureDirt(t);t.dirt.fill(0);});break;
 }
 afterChange();openGM(m);
}
$('#mbox').addEventListener('click',e=>{
 if(e.target.closest('[data-yes]')){const cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();return;}
 if(e.target.closest('[data-gmok]')){checkCode();return;}
 const g=e.target.closest('[data-gma]');if(g)gmAct(g.dataset.gma);
});

// ===================== セーブ/ロード =====================
function save(){s.last=Date.now();for(const t of s.tanks)if(t.dirt)t.dirt=t.dirt.map(v=>Math.round(v*10)/10);try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1){const n=newState();d.b=Object.assign(n.b,d.b||{});if(!d.landLv)d.landLv=[];d.baits=Object.assign({shrimp:30},d.baits||{});if(!d.bait)d.bait='shrimp';if(d.decoList)for(const dd of DECOS)if(dd.lvl){let f=-1;d.decoList.forEach((x,i)=>{if(x===dd.id){if(f<0)f=i;else d.decoList[i]=null;}});if(d.deco&&d.deco[dd.id])d.deco[dd.id]=Math.min(dd.max,d.deco[dd.id]);}(d.tanks||[]).forEach(ensureDirt);if(!d.tvq&&(d.tanks||[]).some(t=>(t.fish||[]).some(f=>SPM[f.s]&&SPM[f.s].a==='dream')))d.tvq=1;return Object.assign(n,d);}}catch(e){}return null;}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

// ===================== ループ =====================
let lastT=performance.now();
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;T+=dt;
 updateEconomy(dt);updateDirt(dt);updateEvent(dt);if(gatherCd>0)gatherCd-=dt;
 recalcT-=dt;if(recalcT<=0){recalcT=1;recalc();}
 if(thunder>0)thunder-=dt;else if(s.rain&&Math.random()<dt*.04){thunder=.35;if(tab==='fish')log('⚡ ゴロゴロ…');}
 if(stormStage()==='storm'&&thunder<=0&&Math.random()<dt*.35)thunder=.3;
 if(tab==='tank')updateTank(dt);
 if(tab==='fish'||fs.st!=='idle')updateFishing(dt);
 if(tab==='dex'){for(const b of bubbles){b.y-=b.v*dt;if(b.y<-10){b.y=H+10;b.x=rand(0,W);}}}
 ctx.clearRect(0,0,W,H);
 if(spa){updateSpa(dt);drawSpa();}else if(cafe){updateCafe(dt);drawCafe();}else if(tab==='tank'){if(inMain())drawChikugo();else drawTank();}else if(tab==='fish')drawFishing();else if(tab==='island'&&inMain())drawMainland();else if(tab==='island'){const sk=stormStage()==='storm'?2.2*stormGust()+.4:0;ctx.save();if(sk)ctx.translate(Math.sin(T*41)*sk,Math.cos(T*33)*sk);drawIsland();ctx.restore();}else drawDexBg();
 topT-=dt;if(topT<=0){topT=.25;updateTop();}
 saveT+=dt;if(saveT>10){saveT=0;save();}
 requestAnimationFrame(loop);
}
// 起動
resize();recalc();
(function offline(){const el=Math.min(7200,(Date.now()-(s.last||Date.now()))/1000);if(el>60){updateDirt(el*.5);recalc();}
 if(el>60&&APPEAL>0){const g=Math.round(visRate()*.6*ticket()*el*.4);s.gold+=g;log(`🌙 留守の間に観光客が来ていた！ +${fmtG(g)}`,'#ffd166');}})();
if(!s.totalVis&&!Object.keys(s.dex).length)setTimeout(()=>log('🌴 ようこそ無人島へ！まずは「🎣釣り場」で魚を釣ってみよう'),300);
(function migrateHotel(){const n=s.decoList.filter(x=>x==='hotel').length,own=s.deco.hotel||0;if(own>n){let short=own-n;while(short>0){const i=freeSlot();if(i<0)break;s.decoList[i]='hotel';short--;}
 if(short>0){s.deco.hotel=own-short;const g=Math.round(400000*short);s.gold+=g;log(`🏨 ホテルの仕様変更のため、置けなかった${short}棟分 ${fmtG(g)} を返金しました`,'#ffd166');}save();}})();
renderPanel();updateTop();requestAnimationFrame(loop);
</script>
